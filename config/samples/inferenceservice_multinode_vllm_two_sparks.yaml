# One model across two DGX Sparks (GB10) over their ConnectX-7 RoCE link, with
# vLLM tensor parallel 2 + expert parallel (#1423). Measured 2026-09-02 on the
# Shadowstack ring with DeepSeek-V4-Flash-Vision-Exp: 2,089 tok/s prefill,
# 24.0 tok/s single-stream decode. Each member reads the weights from its own
# claim because the cluster has no ReadWriteMany class; both claims must exist.
#
# The fabric block is per member on purpose: the same cable has a different
# NIC and HCA name at each end. rdmaResource is the RDMA shared device plugin's
# extended resource; it adds CAP_IPC_LOCK so NCCL can pin memory.
#
# The parser triple in extraArgs below (--reasoning-parser, --tool-call-parser,
# --enable-auto-tool-choice) has a typed form that passes the auto-tool-choice
# flag itself: vllmConfig.toolCallParser and vllmConfig.reasoningParser. This
# spec keeps the measured extraArgs form, which still works; extraArgs lands last.
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: dsv4-vision-ring
spec:
  modelRef: deepseek-v4-flash-vision-exp
  runtime: vllm
  image: vllm/vllm-openai:deepseekv4-flash-vision-arm64-cu130
  resources:
    gpu: 1
    memory: 110Gi
    cpu: "8"
  vllmConfig:
    tensorParallelSize: 2
    pipelineParallelSize: 1
    enableExpertParallel: true
    kvCacheDtype: fp8_e4m3
    maxModelLen: 262144
  extraArgs:
    - --reasoning-parser
    - deepseek_v4
    - --tool-call-parser
    - deepseek_v4
    - --enable-auto-tool-choice
    - --max-num-seqs
    - "2"
    # Speculative decoding with the drafter folded into this checkpoint raised
    # single-stream decode from 25 to 37 tok/s on the ring for a third of the KV
    # cache. The drafter ships inside the checkpoint, so the typed route is
    # vllmConfig.speculative {enabled, method: dspark, numSpeculativeTokens};
    # this spec keeps the extraArgs form because the method-specific keys below
    # (draft_sample_method, rejection_sample_method, adaptive verification) have
    # no typed field and extraArgs wins over the block. adaptive verification
    # exists only in the custom image pinned above, not in the operator's
    # default image, and vLLM's config parser rejects keys it does not know:
    # - --speculative-config={"method":"dspark","model":"/model-source/snapshots/<hash>","num_speculative_tokens":3,"draft_sample_method":"probabilistic","enable_adaptive_verification":false}
  env:
    - name: HF_HUB_OFFLINE
      value: "1"
    - name: PYTORCH_CUDA_ALLOC_CONF
      value: expandable_segments:True
  multiNode:
    rdmaResource: rdma/rdma_shared_device_a
    ibGIDIndex: 3
    members:
      - node: spark-3
        fabric:
          address: 10.10.4.1
          socketInterface: enp1s0f0np0
          ibHCA: rocep1s0f0
        modelCache:
          claimName: dsv4-vision-dgx3
      - node: spark-1
        fabric:
          address: 10.10.4.2
          socketInterface: enp1s0f1np1
          ibHCA: rocep1s0f1
        modelCache:
          claimName: dsv4-vision-dgx1
