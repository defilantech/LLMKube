# DeepSeek-V4.1-Flash EXL3 3.5bpw across THREE DGX Sparks cabled in a ring (P0->P1, three /30 legs, no
# switch), tensor-parallel 3. Measured 2026-09-13 on the Shadowstack ring: three-rank NCCL all-reduce
# 23.2 GB/s bus bandwidth; model numbers in docs/site/guides/multi-node-inference.md ("Three-Spark ring").
#
# Two things about the fabric block that the field docs do not say loudly enough:
#   - fabric.address is the BOOTSTRAP plane and must be reachable from every member. On a ring no
#     fabric /30 is, so it is the management IP; socketInterface is the management NIC.
#   - ibHCA is the DATA plane and takes a comma list; list all four ConnectX ports and set
#     NCCL_IB_SUBNET_AWARE_ROUTING=1 (NCCL >= 2.30) so NCCL picks, per peer, the port on that peer's
#     subnet. Without it NCCL pairs NICs by channel index on both ends, which a P0->P1 ring never satisfies.
#
# Before creating this: stage all 54 checkpoint files on every member (config/samples/model_dsv41_flash_exl3.yaml),
# apply config/samples/jobs/dsv41-tp3-config.yaml (72 heads / 9 o_groups), and apply
# config/samples/gb10-memory-guard.yaml once: with the KV pin below, vLLM skips memory profiling, so nothing else
# catches a dirty page cache (a fresh 460 GB stage leaves ~10 GiB of it resident even with the group down; measured
# 2026-09-20). multiNode.memory below drops the cache and sets the two vm sysctls on every member right before its
# runtime starts, on every boot (a privileged init container, so the namespace must allow privileged pods); the
# guard DaemonSet keeps MemFree above 4 GiB while serving and suspends the group before the allocator stalls.
#
# Turn swap off on every member before the first boot (sudo swapoff -a): a memory overrun then OOM-kills the worker,
# which the operator restarts, instead of paging kubelet out and wedging the node. The image pre-warms FlashInfer's
# JIT modules; MAX_JOBS=1 below bounds any remaining first-serve compile to one nvcc at a time (~6 GB of host RAM).
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: dsv41-exl3-ring
  namespace: default
spec:
  modelRef: dsv41-flash-exl3
  runtime: vllm
  image: ghcr.io/defilantech/llmkube-vllm-cuda-gb10-dsv41-exl3@sha256:24b44f422363117990b4d2edfbdea1399ff89a4a74a075cd773f52704ef5b98c
  replicas: 1
  containerPort: 8080
  resources:
    gpu: 1
    memory: 110Gi
    cpu: "8"
  # Pinned to a member claim so the operator does not also create a dynamic <isvc>-model-cache.
  modelCache:
    claimName: dsv41-dgx1
  vllmConfig:
    tensorParallelSize: 3
    pipelineParallelSize: 1
    # 524288 works on three Sparks only together with the KV pin in extraArgs. Without it vLLM's profiler sizes
    # the pool from what it measures after load, and on a GB10 that count includes reclaimable page cache: at
    # 524288 it reported 1.49-1.59 GiB against a 2.08 GiB requirement and the group could not boot, while the
    # true CUDA-free at init on a clean cache is ~111 GiB. The indexer prefill buffer also scales with this
    # value (about 5.2 GiB at 1M per tonyd2wild's RECIPE.md), which is why 300000, his TP3 serving config, is
    # the largest context the profiler allows here and the fallback if the pin is ever removed. opencode's
    # provider limit.context must be this minus its limit.output (524288 - 65536 = 458752) or turns in that band
    # get HTTP 400 instead of compacting. YaRN is already factor 16 in the checkpoint (1,048,576 positions).
    maxModelLen: 524288
    # Ignored while --kv-cache-memory-bytes is set (vLLM: "skipped memory profiling. This does not respect the
    # gpu_memory_utilization config"). Kept at tonyd2wild's 0.80 for the un-pinned fallback.
    gpuMemoryUtilization: 0.80
    # EP stays off: the TP3 DSpark patch relaxes the 128-expert divisibility check only when
    # expert parallelism is off and every expert stays local to its rank.
  # The parser triple below (--reasoning-parser, --tool-call-parser, --enable-auto-tool-choice)
  # has a typed form that passes the auto-tool-choice flag itself: vllmConfig.toolCallParser
  # and vllmConfig.reasoningParser. This spec keeps the measured extraArgs form; extraArgs lands last.
  extraArgs:
    - --served-model-name
    - DeepSeek-V4.1-Flash-EXL3
    - --reasoning-parser
    - deepseek_v41
    - --tool-call-parser
    - deepseek_v41
    - --enable-auto-tool-choice
    - --block-size
    - "128"
    - --max-num-seqs
    - "2"
    # 8192, not 16384: the encoder cache is budgeted off this value and profiled with limit-mm x max-num-seqs
    # max-size images, so 16384 cost 2.77 GiB of KV on rank 0 (measured -1.13 -> +1.64 GiB) and tonyd2wild's
    # b1-mb16k row lost 35.8% of its pool for it. 8192 = 64 x 128 stays block-aligned.
    - --max-num-batched-tokens
    - "8192"
    # Vision on. The tower loads only when --language-model-only is absent; the checkpoint's vision_config
    # is 32 layers and its weights ride in shards 1, 2, 43-48, byte-identical to the release.
    - --limit-mm-per-prompt
    - '{"image":4}'
    # 0, not 1: the processor cache lives in the API server on rank 0 only (measured +1.16 GiB on rank 0,
    # nothing on ranks 1 and 2). vLLM sizes the pool from the tightest rank, which is rank 2 here, so a
    # gigabyte spent on rank 0 would make rank 0 the floor and shrink the pool for everyone.
    - --mm-processor-cache-gb
    - "0"
    # Async scheduling is default-on for dspark in this build (config/vllm.py resolver), so no flag is passed.
    # The patched engram.py reads the two n-gram tables from the safetensors shards on disk
    # (DSV41_ENGRAM_DISK=1 below); never resident.
    - --engram-config
    - '{"cpu_offload": false}'
    # Thinking off for the first boot; the deepseek_v41 reasoning parser stays wired.
    - --default-chat-template-kwargs
    - '{"thinking": false}'
    # CUDA graphs (FULL_AND_PIECEWISE). With speculative decoding the decode batch is k or k+1 tokens per sequence, so the
    # capture sizes are the multiples of k up to k x max-num-seqs plus the multiples of k+1: for k=5 and 2 sequences,
    # [5,6,10,12]. The first request should check logprobs for NaN (a GB10 TP2 build emitted NaN with graphs on).
    - --compilation-config
    - '{"cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[5,6,10,12]}'
    # DSpark k=5 speculative decoding: the drafter lives in the checkpoint; block verification with probabilistic draft
    # sampling is lossless (same distribution as the target). Measured 2026-09-13 on the ring: code 2.4x, arithmetic 2x,
    # prose 1.2 to 1.3x, 1.5x across a mixed set. Capture sizes follow the rule above.
    # Adaptive verification is unsupported on GB10 (SM12x sparse indexer); leave it false.
    - --speculative-config
    - '{"method":"dspark","num_speculative_tokens":5,"draft_sample_method":"probabilistic","rejection_sample_method":"block","enable_adaptive_verification":false}'
    # KV pin: 4.2 GiB per rank = 1,057,457 tokens, 2.02x at 512K (measured 2026-09-20, generation 43, vision
    # on, DSpark k=5: stripe PASS, prefill 2,000 / 2,120 tok/s at 10K / 40K, a 450,979-token request at
    # 1,472 tok/s, decode 84-86). vLLM then skips memory profiling and ignores gpuMemoryUtilization; the pin
    # is the whole budget, which is what lets 512K + vision fit (see maxModelLen). Two things become
    # mandatory: drop caches on every member before every boot (multiNode.memory below; no profiler
    # catches a dirty cache), and a serving-phase flusher under 4 GiB MemFree (rank 2 dipped to 2.7 GiB under
    # the 450K prefill even with one). Do not raise the pin past ~4.2 GiB on three Sparks: MemAvailable while
    # serving is ~10 GiB. 2.3 GiB (1.10x) also boots and serves if headroom matters more than concurrency.
    - --kv-cache-memory-bytes
    - "4509715660"
    # TP3: 64 heads / 8 o_groups do not divide by 3. virtual_heads.py pads to 72 / 9 at load time
    # against the declaration that config/samples/jobs/dsv41-tp3-config.yaml writes into the staged config.json (what
    # tonyd2wild's reddie_prep_tp3.sh (https://github.com/tonyd2wild/DeepSeek-V4.1-Flash-vLLM-DGX-Spark) does). NOT --hf-overrides: on this build text_config is
    # dict-typed, and the dict form replaces the whole sub-config (measured: "text_config ... does
    # not have num_attention_heads").
    # No --quantization: bot-lab-21's config.json carries quant_method exl3, which cuda-exl3's
    # Exl3Config reads via the vllm.general_plugins entry point found on PYTHONPATH.
  env:
    - {name: NCCL_NET, value: IB}
    - {name: NCCL_IB_DISABLE, value: "0"}
    - {name: NCCL_IB_ROCE_VERSION_NUM, value: "2"}
    - {name: NCCL_IB_ADDR_FAMILY, value: AF_INET}
    - {name: NCCL_IB_TC, value: "106"}
    - {name: NCCL_IB_TIMEOUT, value: "22"}
    - {name: NCCL_IB_SUBNET_AWARE_ROUTING, value: "1"}
    - {name: NCCL_IB_MERGE_NICS, value: "0"}
    - {name: NCCL_NET_PLUGIN, value: none}
    - {name: NCCL_NVLS_ENABLE, value: "0"}
    # 4, not 8. NCCL_MAX_NCHANNELS=8 came from bot-lab-21's ladder, which is a switched fabric (+10.7% C6 there).
    # This ring is a switchless cycle, and on that topology koldfrontier (tonyd2wild issue #9) measured 8 as
    # neutral and reverted to 4. Same here: 8 -> 4 moved prefill and decode inside the run-to-run spread (10K
    # +6%, 40K -2%, decode -1%) and cut NCCL's pinned host Shmem from 0.77 to 0.47 GiB on every rank, which on
    # a unified-memory GB10 is KV. Measured 2026-09-20, generation 37.
    - {name: NCCL_MAX_NCHANNELS, value: "4"}
    - {name: NCCL_CUMEM_ENABLE, value: "0"}
    - {name: NCCL_IGNORE_CPU_AFFINITY, value: "1"}
    - {name: TORCH_NCCL_ASYNC_ERROR_HANDLING, value: "1"}
    # INFO plus INIT,NET prints the per-peer port choice during bring-up; drop both once the ring is proven.
    - {name: NCCL_DEBUG, value: INFO}
    - {name: NCCL_DEBUG_SUBSYS, value: "INIT,NET"}
    - {name: MN_IF_NAME, value: enP7s7}  # bootstrap NIC name vLLM's multi-node launcher reads
    - {name: TORCH_CUDA_ARCH_LIST, value: 12.1a}
    - {name: FLASHINFER_CUDA_ARCH_LIST, value: 12.1a}
    - {name: FLASHINFER_DISABLE_VERSION_CHECK, value: "1"}
    # Match the image's prewarm env exactly (a JIT with different nvcc flags is a different cache
    # entry) and bound any first-serve JIT so it cannot exhaust unified memory.
    - {name: MAX_JOBS, value: "1"}
    - {name: FLASHINFER_NVCC_THREADS, value: "1"}
    - {name: VLLM_HAS_FLASHINFER_CUBIN, value: "1"}
    - {name: VLLM_ENGINE_READY_TIMEOUT_S, value: "3600"}
    - {name: PYTORCH_CUDA_ALLOC_CONF, value: "expandable_segments:True,garbage_collection_threshold:0.6"}
    - {name: VLLM_USE_BREAKABLE_CUDAGRAPH, value: "1"}
    - {name: VLLM_USE_FLASHINFER_SAMPLER, value: "0"}
    # Engram-on-disk (tonyd2wild engram.py): rows are read from model-00047/48 in the model dir per forward.
    - {name: DSV41_ENGRAM_DISK, value: "1"}
    # 32 is tonyd2wild's default. Measured neutral on a warm page cache (10K prefill 0%, 40K +4% inside the
    # run-to-run spread, decode -1%): the rows are already resident, so reads are not the bottleneck. It costs
    # nothing and only pays on a cold cache; his fast-staging gain is GPU dequant, a separate patch.
    - {name: DSV41_ENGRAM_DISK_THREADS, value: "32"}
    - {name: DSV41_ENGRAM_DISK_CHUNK, value: "8"}
    # The two env-gated levers llmkube-runtimes#47 added to the image (candidate 24b44f42, tonyd2wild's speed-run
    # patches, MIT), each accepted on this ring by a one-change boot against the row before it (2026-09-20, same
    # 10K/40K/450K cold-prefill probe, vision stripe test and count decode on every row, 0 guard drops on any):
    #   row 0, gates off (the cuda-exl3 limit kernel alone): prefill 2,127 / 2,142 / 1,559, decode 84-85; the
    #          "has no 'limit' argument" warning is gone from the boot log.
    #   row 1, DSV41_ENGRAM_FAST=1: 2,216 / 2,249 / 1,655, decode 86-89. Engram rows gathered through a numpy
    #          memmap and dequantized on the GPU; bit-identical to the preadv path (tools/test_stage_fast.py, 288
    #          and 98,304 rows). Boot log line: "Engram FAST staging on (DSV41_ENGRAM_FAST=1)".
    #   row 2, + DSV41_INDEXER_TP_SPLIT=1: 2,209 / 2,262 / 1,740, decode 80-90. Each rank computes the lightning
    #          indexer's top-k for a slice of the prefill rows, then one all-gather; byte-equal to the unsplit
    #          reference at tp=3 (test_idxsplit.py sim). The value MUST be identical on every member. Boot log
    #          line: "DSV41_INDEXER_TP_SPLIT on: indexer prefill rows split across 3 TP ranks".
    # Against the previous image (gen 43: 1,447 tok/s at 450K) the long prefill is +20%. Set either to "0" to
    # fall back to the previous behaviour without a rebuild.
    - {name: DSV41_ENGRAM_FAST, value: "1"}
    - {name: DSV41_INDEXER_TP_SPLIT, value: "1"}
    # cuda-exl3 reads quantization_config.json next to the weights; the operator serves the cached
    # multi-file model from /models/<cacheKey>.
    - {name: CUDA_EXL3_MODEL_PATH, value: /models/22fa141368a3262a}
    - {name: HF_HUB_OFFLINE, value: "1"}
    - {name: TRANSFORMERS_OFFLINE, value: "1"}
    - {name: HF_HOME, value: /cache/huggingface}
    - {name: VLLM_CACHE_ROOT, value: /cache/vllm}
    - {name: TRITON_CACHE_DIR, value: /cache/triton}
    - {name: TILELANG_CACHE_DIR, value: /cache/tilelang}
    - {name: TORCHINDUCTOR_CACHE_DIR, value: /cache/torchinductor}
    - {name: CUDA_CACHE_PATH, value: /cache/jit}
  extraVolumes:
    - name: cache
      hostPath: {path: /var/lib/vllm-cache/dsv41, type: DirectoryOrCreate}
    - name: shm
      emptyDir: {medium: Memory, sizeLimit: 8Gi}
  extraVolumeMounts:
    - {name: cache, mountPath: /cache}
    - {name: shm, mountPath: /dev/shm}
  multiNode:
    rdmaResource: rdma/rdma_shared_device_a
    ibGIDIndex: 3
    # The nodes shipped at vm.min_free_kbytes 44 MiB and watermark_scale_factor 10, which left background reclaim
    # no room; with these two set, a 450,977-token prefill needed no serving-phase drop (measured 2026-09-20).
    memory:
      dropPageCacheBeforeBoot: true
      sysctls:
        vm.min_free_kbytes: "1048576"
        vm.watermark_scale_factor: "200"
    members:
      - node: ahazidgx1
        fabric: {address: 192.168.1.28, socketInterface: enP7s7, ibHCA: "rocep1s0f0,rocep1s0f1,roceP2p1s0f0,roceP2p1s0f1"}
        modelCache: {claimName: dsv41-dgx1}
      - node: ahazidgx2
        fabric: {address: 192.168.1.86,  socketInterface: enP7s7, ibHCA: "rocep1s0f0,rocep1s0f1,roceP2p1s0f0,roceP2p1s0f1"}
        modelCache: {claimName: dsv41-dgx2}
      - node: ahazidgx3
        fabric: {address: 192.168.1.220, socketInterface: enP7s7, ibHCA: "rocep1s0f0,rocep1s0f1,roceP2p1s0f0,roceP2p1s0f1"}
        modelCache: {claimName: dsv41-dgx3}
