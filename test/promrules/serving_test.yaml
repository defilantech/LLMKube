# promtool unit tests for the chart's llmkube-serving group. Run with
# `make test-chart-rules`, which renders the chart's PrometheusRule into
# rules.yaml next to a copy of this file.
# InferenceMetricsMissing also fires on these inputs because running-count
# metrics are absent; only InferenceAdmissionStalled is asserted here.
rule_files:
  - rules.yaml

evaluation_interval: 1m

tests:
  # llama.cpp embedder working off a backlog: queued requests, decode calls
  # advancing, zero predicted tokens (embedding never generates). Must not
  # page. A server with the same backlog and no decode progress must.
  - interval: 1m
    input_series:
      - series: 'llamacpp:requests_deferred{namespace="ai",service="embedder"}'
        values: '50x20'
      - series: 'llamacpp:n_decode_total{namespace="ai",service="embedder"}'
        values: '0+100x20'
      - series: 'llamacpp:tokens_predicted_total{namespace="ai",service="embedder"}'
        values: '0x20'
      - series: 'llamacpp:requests_deferred{namespace="ai",service="stuck"}'
        values: '5x20'
      - series: 'llamacpp:n_decode_total{namespace="ai",service="stuck"}'
        values: '1000x20'
    alert_rule_test:
      - eval_time: 9m
        alertname: InferenceAdmissionStalled
        exp_alerts: []
      - eval_time: 15m
        alertname: InferenceAdmissionStalled
        exp_alerts:
          - exp_labels:
              severity: critical
              component: inference
              namespace: ai
              service: stuck
            exp_annotations:
              summary: "Inference engine is queuing requests but making no progress"
              description: "stuck in ai has 5 requests queued while making no progress. The process is up; it is not admitting work."

  # vLLM engines that are healthy but read as idle or nearly so. A prefill-only
  # burst finishes each request in the step that admits it, so running stays 0
  # while prompt tokens advance (#2464). A single-slot engine works through a
  # queue at running=1 while generation advances. The burst's queue is empty by
  # 3m, but the 10m average keeps seeing it, which is what let the old ceiling
  # page after the fact. A wedged engine with flat counters must still page.
  - interval: 1m
    input_series:
      - series: 'vllm:num_requests_waiting{namespace="ai",service="prefill",pod="prefill-0",engine="0"}'
        values: '30x3 0x17'
      - series: 'vllm:num_requests_running{namespace="ai",service="prefill",pod="prefill-0",engine="0"}'
        values: '0x20'
      - series: 'vllm:prompt_tokens_total{namespace="ai",service="prefill",pod="prefill-0",engine="0"}'
        values: '0+5000x20'
      - series: 'vllm:generation_tokens_total{namespace="ai",service="prefill",pod="prefill-0",engine="0"}'
        values: '0x20'
      - series: 'vllm:num_requests_waiting{namespace="ai",service="oneslot",pod="oneslot-0",engine="0"}'
        values: '3x20'
      - series: 'vllm:num_requests_running{namespace="ai",service="oneslot",pod="oneslot-0",engine="0"}'
        values: '1x20'
      - series: 'vllm:prompt_tokens_total{namespace="ai",service="oneslot",pod="oneslot-0",engine="0"}'
        values: '500x20'
      - series: 'vllm:generation_tokens_total{namespace="ai",service="oneslot",pod="oneslot-0",engine="0"}'
        values: '0+200x20'
      - series: 'vllm:num_requests_waiting{namespace="ai",service="stuck",pod="stuck-0",engine="0"}'
        values: '5x20'
      - series: 'vllm:num_requests_running{namespace="ai",service="stuck",pod="stuck-0",engine="0"}'
        values: '0x20'
      - series: 'vllm:prompt_tokens_total{namespace="ai",service="stuck",pod="stuck-0",engine="0"}'
        values: '500x20'
      - series: 'vllm:generation_tokens_total{namespace="ai",service="stuck",pod="stuck-0",engine="0"}'
        values: '900x20'
    alert_rule_test:
      - eval_time: 9m
        alertname: InferenceAdmissionStalled
        exp_alerts: []
      - eval_time: 12m
        alertname: InferenceAdmissionStalled
        exp_alerts:
          - exp_labels:
              severity: critical
              component: inference
              namespace: ai
              service: stuck
              pod: stuck-0
              engine: "0"
            exp_annotations:
              summary: "Inference engine is queuing requests but making no progress"
              description: "stuck in ai has 5 requests queued while making no progress. The process is up; it is not admitting work."

  # A vLLM engine that wedges after working: the counters have to read flat for
  # the whole 10m window before `for: 10m` starts, so a wedge at 10m pages at
  # about 30m and not before.
  - interval: 1m
    input_series:
      - series: 'vllm:num_requests_waiting{namespace="ai",service="wedged",pod="wedged-0",engine="0"}'
        values: '5x40'
      - series: 'vllm:prompt_tokens_total{namespace="ai",service="wedged",pod="wedged-0",engine="0"}'
        values: '0+100x10 1000x30'
      - series: 'vllm:generation_tokens_total{namespace="ai",service="wedged",pod="wedged-0",engine="0"}'
        values: '0+100x10 1000x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: InferenceAdmissionStalled
        exp_alerts: []
      - eval_time: 32m
        alertname: InferenceAdmissionStalled
        exp_alerts:
          - exp_labels:
              severity: critical
              component: inference
              namespace: ai
              service: wedged
              pod: wedged-0
              engine: "0"
            exp_annotations:
              summary: "Inference engine is queuing requests but making no progress"
              description: "wedged in ai has 5 requests queued while making no progress. The process is up; it is not admitting work."

  # SGLang's heartbeat carries a `mode` label the queue gauge lacks, so one mode
  # advancing is progress, and flat in every mode must still join and page.
  - interval: 1m
    input_series:
      - series: 'sglang:num_queue_reqs{namespace="ai",service="sgbusy",pod="sgbusy-0",tp_rank="0"}'
        values: '5x20'
      - series: 'sglang:num_running_reqs{namespace="ai",service="sgbusy",pod="sgbusy-0",tp_rank="0"}'
        values: '0x20'
      - series: 'sglang:realtime_tokens_total{namespace="ai",service="sgbusy",pod="sgbusy-0",tp_rank="0",mode="prefill_compute"}'
        values: '0+16384x20'
      - series: 'sglang:realtime_tokens_total{namespace="ai",service="sgbusy",pod="sgbusy-0",tp_rank="0",mode="inference"}'
        values: '100x20'
      - series: 'sglang:num_queue_reqs{namespace="ai",service="sgstuck",pod="sgstuck-0",tp_rank="0"}'
        values: '5x20'
      - series: 'sglang:realtime_tokens_total{namespace="ai",service="sgstuck",pod="sgstuck-0",tp_rank="0",mode="prefill_compute"}'
        values: '7000x20'
      - series: 'sglang:realtime_tokens_total{namespace="ai",service="sgstuck",pod="sgstuck-0",tp_rank="0",mode="inference"}'
        values: '100x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: InferenceAdmissionStalled
        exp_alerts:
          - exp_labels:
              severity: critical
              component: inference
              namespace: ai
              service: sgstuck
              pod: sgstuck-0
              tp_rank: "0"
            exp_annotations:
              summary: "Inference engine is queuing requests but making no progress"
              description: "sgstuck in ai has 5 requests queued while making no progress. The process is up; it is not admitting work."
