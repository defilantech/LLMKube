name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  # The merge queue runs the required checks on the merged result before it
  # lands (#2379). GitHub ignores paths filters for merge_group, which is why
  # the path-filtered workflows are not required checks and have no trigger.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  test:
    # Unique across workflows: a required status check is matched by job name
    # alone, and Lint's job was also called "Run on Ubuntu" (#2379).
    name: Unit and envtest
    runs-on: ubuntu-latest
    # actions: read lets the timing report download the go-test-report
    # artifact of the last green main run to compare against (#2382). It is
    # read-only: it lists runs and downloads their artifacts, nothing else.
    permissions:
      contents: read
      actions: read
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Download Go modules
        # Once, before any step builds; retried on network errors only (#2380).
        run: hack/go-mod-download.sh

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip3 install jsonschema pyyaml

      - name: Validate samples against CRD schemas
        run: make validate-samples

      # llmkube.com renders docs/site from main and fails its build on a link
      # to a page that does not exist; checked here so it fails before merge.
      - name: Check docs/site links
        run: make check-docs-links

      # Shell regression suites go test never runs: the seed's single
      # evaluation (#1817; the gate log is where a seed is read to replay a
      # failure), make gate, make test-affected and cmd/affected-packages.
      - name: Shell script tests
        run: make test-scripts

      # go test -json records every test's elapsed time; the report script
      # streams the text to this log as `go test -v` would and keeps the JSON
      # for the timing summary below (#2141). shell: bash runs the pipeline
      # under -o pipefail, so make's exit status still fails the step.
      - name: Running Tests (seed 11)
        shell: bash
        run: |
          go mod tidy
          make test GINKGO_SEED=11 GO_TEST_FLAGS=-json 2>&1 \
            | tee test-report-seed11.jsonl | hack/go-test-report.sh stream

      # Spec-order pollution only shows under some seeds, so CI runs the
      # envtest suites a second time under a second fixed seed (#1693).
      # `make test` and the Foreman gate stay single-pass.
      - name: Envtest suites (seed 22)
        shell: bash
        run: |
          make test-envtest GINKGO_SEED=22 GO_TEST_FLAGS=-json 2>&1 \
            | tee test-report-seed22.jsonl | hack/go-test-report.sh stream

      # The baseline for the timing report's growth list: the go-test-report
      # artifact of the latest successful push to main (selected by workflow
      # file, event and branch, so PR and merge queue runs never qualify).
      # No such run, an expired artifact, or a token that cannot read it
      # leaves the directory empty and the report says "no baseline"; this
      # step never fails the job.
      - name: Download baseline test reports
        if: ${{ !cancelled() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          dir="$RUNNER_TEMP/go-test-report-baseline"
          mkdir -p "$dir"
          if ! run="$(gh run list --workflow test.yml --branch main --event push \
              --status success --limit 1 --json databaseId,headSha,createdAt \
              --jq '.[0] // empty | "\(.databaseId) \(.headSha[:9]) \(.createdAt)"')"; then
            echo "no baseline: cannot list the Tests runs on main"
          elif [ -z "$run" ]; then
            echo "no baseline: no successful Tests run on main"
          else
            read -r id sha created <<<"$run"
            url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$id"
            if gh run download "$id" --name go-test-report --dir "$dir"; then
              echo "baseline: main at $sha, $created, $url"
            else
              rm -rf "$dir" && mkdir -p "$dir"
              echo "no baseline: $url has no go-test-report artifact this token can read (expired or never uploaded)"
            fi
          fi

      # Where the time went: package times, each budgeted package against its
      # budget (a ::warning:: over it, never a failure), failures, tests a
      # -timeout killed mid-run, the slowest tests, and the tests that grew
      # most since the baseline above. Runs after a failure too, which is
      # when it matters most.
      - name: Test timing report
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          for f in test-report-seed*.jsonl; do
            [ -f "$f" ] || continue
            echo "### $f"
            hack/go-test-report.sh summary "$f" 25 "$RUNNER_TEMP/go-test-report-baseline/$f"
            echo
          done

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-test-report
          path: test-report-seed*.jsonl
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload coverage to Codecov
        # make test writes cover.out via `go test -coverprofile`.
        # Do not fail CI if Codecov is unreachable.
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./cover.out
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: B200 harness self-test (#1376)
        # Hardware-free guard on the B200 validation harness wiring: preflight
        # floor gate, capture round-trip, matrix-doc rewrite, dry-run resume.
        run: make test-b200-harness

      - name: Build Metal Agent (compile check)
        run: GOOS=darwin GOARCH=arm64 go build -o /dev/null ./cmd/metal-agent
