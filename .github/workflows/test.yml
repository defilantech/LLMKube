name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip3 install jsonschema pyyaml

      - name: Validate samples against CRD schemas
        run: make validate-samples

      # Guards the seed's single evaluation (#1817): the gate log is where a
      # seed is read to replay a failure.
      - name: GINKGO_SEED expands once
        run: scripts/check-ginkgo-seed_test.sh

      - name: Running Tests (seed 11)
        run: |
          go mod tidy
          make test GINKGO_SEED=11

      # Spec-order pollution only shows under some seeds, so CI runs the
      # envtest suites a second time under a second fixed seed (#1693).
      # `make test` and the Foreman gate stay single-pass.
      - name: Envtest suites (seed 22)
        run: make test-envtest GINKGO_SEED=22

      - name: Upload coverage to Codecov
        # make test writes cover.out via `go test -coverprofile`.
        # Do not fail CI if Codecov is unreachable.
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./cover.out
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Build Metal Agent (compile check)
        run: GOOS=darwin GOARCH=arm64 go build -o /dev/null ./cmd/metal-agent
