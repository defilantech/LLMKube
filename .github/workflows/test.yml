name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  # The merge queue runs the required checks on the merged result before it
  # lands (#2379). GitHub ignores paths filters for merge_group, which is why
  # the path-filtered workflows are not required checks and have no trigger.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  test:
    # Unique across workflows: a required status check is matched by job name
    # alone, and Lint's job was also called "Run on Ubuntu" (#2379).
    name: Unit and envtest
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip3 install jsonschema pyyaml

      - name: Validate samples against CRD schemas
        run: make validate-samples

      # Shell regression suites go test never runs: the seed's single
      # evaluation (#1817; the gate log is where a seed is read to replay a
      # failure), make gate, make test-affected and cmd/affected-packages.
      - name: Shell script tests
        run: make test-scripts

      # go test -json records every test's elapsed time; the report script
      # streams the text to this log as `go test -v` would and keeps the JSON
      # for the timing summary below (#2141). shell: bash runs the pipeline
      # under -o pipefail, so make's exit status still fails the step.
      - name: Running Tests (seed 11)
        shell: bash
        run: |
          go mod tidy
          make test GINKGO_SEED=11 GO_TEST_FLAGS=-json 2>&1 \
            | tee test-report-seed11.jsonl | hack/go-test-report.sh stream

      # Spec-order pollution only shows under some seeds, so CI runs the
      # envtest suites a second time under a second fixed seed (#1693).
      # `make test` and the Foreman gate stay single-pass.
      - name: Envtest suites (seed 22)
        shell: bash
        run: |
          make test-envtest GINKGO_SEED=22 GO_TEST_FLAGS=-json 2>&1 \
            | tee test-report-seed22.jsonl | hack/go-test-report.sh stream

      # Where the time went: package times, failures, tests a -timeout killed
      # mid-run, and the slowest tests. Runs after a failure too, which is
      # when it matters most.
      - name: Test timing report
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          for f in test-report-seed*.jsonl; do
            [ -f "$f" ] || continue
            echo "### $f"
            hack/go-test-report.sh summary "$f" 25
            echo
          done

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-test-report
          path: test-report-seed*.jsonl
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload coverage to Codecov
        # make test writes cover.out via `go test -coverprofile`.
        # Do not fail CI if Codecov is unreachable.
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./cover.out
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: B200 harness self-test (#1376)
        # Hardware-free guard on the B200 validation harness wiring: preflight
        # floor gate, capture round-trip, matrix-doc rewrite, dry-run resume.
        run: make test-b200-harness

      - name: Build Metal Agent (compile check)
        run: GOOS=darwin GOARCH=arm64 go build -o /dev/null ./cmd/metal-agent
