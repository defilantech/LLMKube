name: Lint

on:
  push:
    branches:
      - main
  pull_request:
  # The merge queue runs the required checks on the merged result before it
  # lands (#2379). GitHub ignores paths filters for merge_group, which is why
  # the path-filtered workflows are not required checks and have no trigger.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  lint:
    # Unique across workflows: a required status check is matched by job name
    # alone, and the Tests job was also called "Run on Ubuntu" (#2379).
    name: Lint and static checks
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The copyright check diffs against the merge base, which a shallow
          # copy does not have. The full pack is about 29 MiB.
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Download Go modules
        # Once, before any step builds; retried on network errors only (#2380).
        run: hack/go-mod-download.sh

      - name: Run linter
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

      - name: Dead production code guard
        # Re-runs `unused` with test files dropped from the graph, so a symbol
        # referenced only by its own tests is reported. The step above cannot
        # see that class of bug: the tests make the code look used.
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          args: --config=.golangci-deadcode.yml ./...

      - name: Check reviewer prompt sync
        run: make check-reviewer-prompts

      - name: Check golang builder images match go.mod
        run: make check-go-version

      - name: Check AGENTS.md references
        # AGENTS.md is the file agents read first; a make target, path, or Go
        # version it names that no longer resolves sends them down a dead end.
        run: make check-agents-md

      - name: Check new Go file copyright headers
        # A new file copies its header from a neighbor, so a stale year spreads
        # unless each added file is checked (#2298). The base SHA is the PR's
        # target on a pull_request; on a push it is the commit before the range,
        # and an all-zero value there (a new branch's first push) makes the
        # check a no-op rather than failing every existing header. In the merge
        # queue it is the commit the queued PRs are merged onto.
        run: make check-copyright
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
