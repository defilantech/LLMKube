name: Release image scan

# Gates the release-please PR on the same Trivy scan the goreleaser job runs
# after the tag is cut, so a blocking CVE fails the PR instead of leaving a
# half-published release (v0.9.26, #1815).
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Release image scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and tags whenever the scan runs, like the release
          # job's checkout. Go stamps the router-proxy binary's main module
          # version from git: a shallow clone has no tag to describe from, so
          # it stamps v0.0.0-<date>-<hash>, and Trivy then matches LLMKube's
          # own fixed advisories against it (CVE-2026-68903, patched in 0.9.0,
          # failed the 0.11.0 release PR #2590). With tags reachable the stamp
          # is a pseudo-version above the latest release. Other PRs skip the
          # scan and keep the shallow clone. The '0' is a string because a bare
          # 0 is falsy in an expression and would fall through to the '1'.
          fetch-depth: ${{ (github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release-please--branches--main')) && '0' || '1' }}

      - name: Self-test the scan harness
        run: ./scripts/scan-images_test.sh

      # The gate is on the steps, not the job: a skipped job does not satisfy a
      # required status check, so the job must report success on every PR and
      # only the expensive scan is skipped for non-release PRs. workflow_dispatch
      # has an empty head_ref, hence the event_name clause, so the scan can be
      # exercised on a branch before merge.
      - name: Set up Docker Buildx
        if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release-please--branches--main') }}
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Set up Go
        if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release-please--branches--main') }}
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Download Go modules
        # Once, before the scan builds; retried on network errors only (#2380).
        if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release-please--branches--main') }}
        run: hack/go-mod-download.sh

      - name: Install Trivy
        # The same pinned Trivy the release job scans with
        # (hack/install-pinned-tool.sh), so this gate and the release agree.
        if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release-please--branches--main') }}
        run: |
          ./hack/install-pinned-tool.sh trivy "$RUNNER_TEMP/trivy"
          echo "$RUNNER_TEMP/trivy" >> "$GITHUB_PATH"

      - name: Scan images before push (Trivy, amd64)
        if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release-please--branches--main') }}
        run: ./hack/scan-images.sh
