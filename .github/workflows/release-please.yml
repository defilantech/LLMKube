name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build+scan+sign against a throwaway :provenance-test tag; do not cut a release"
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write
  packages: write        # push images + attestations to GHCR
  id-token: write        # keyless cosign / OIDC
  attestations: write    # actions/attest-* write to the attestations store

jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  goreleaser:
    needs: release-please
    if: ${{ always() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    # The macOS signing and notary secrets live in the "release" environment,
    # which only main can deploy to, so a workflow run from any other branch
    # reads them as empty (docs/contributing/macos-signing.md).
    environment: release
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch all tags
        run: git fetch --force --tags

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Trivy
        # Trivy is not preinstalled on ubuntu-latest; hack/scan-images.sh calls
        # the bare `trivy` CLI, so without this the scan step below exits 127
        # and no release can ever be cut (#233 review, Critical 1). No
        # restrictive `if:` here - the scan below runs on both the push and
        # workflow_dispatch paths, so this must too.
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567  # v0.3.1

      - name: Scan images before push (Trivy, amd64)
        run: ./hack/scan-images.sh
        env:
          VERSION: ${{ needs.release-please.outputs.version || github.sha }}

      - name: Install rcodesign
        # hack/macos-sign.sh, the GoReleaser post-build hook for the darwin
        # binaries, signs them with rcodesign, which runs on Linux (#2084).
        # Pinned by version and SHA-256 in hack/install-rcodesign.sh: a
        # mismatch fails the release, while a failed download only warns
        # (the hook then fails if signing is configured).
        if: ${{ github.event_name == 'push' }}
        run: |
          ./hack/install-rcodesign.sh "$RUNNER_TEMP/rcodesign"
          echo "$RUNNER_TEMP/rcodesign" >> "$GITHUB_PATH"

      - name: Check macOS signing and notarization settings
        # The notarize-macos job runs after the release is published, so a
        # notary misconfiguration has to fail here, before anything is.
        if: ${{ github.event_name == 'push' }}
        env:
          MACOS_SIGNING_REQUIRED: ${{ vars.MACOS_SIGNING_REQUIRED }}
          MACOS_SIGN_P12_SET: ${{ secrets.MACOS_SIGN_P12 != '' }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: ./hack/macos-notarize.sh --preflight >/dev/null

      - name: Run GoReleaser
        if: ${{ github.event_name == 'push' }}
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: 'v2.19.0'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          # Read by hack/macos-sign.sh (docs/contributing/macos-signing.md).
          # Unset: the darwin binaries are ad-hoc signed. A .p12 without its
          # password fails the release, and so does a missing .p12 once the
          # repository variable MACOS_SIGNING_REQUIRED is true. The notary
          # key is not needed here: the notarize-macos job submits the
          # binaries after the release.
          MACOS_SIGNING_REQUIRED: ${{ vars.MACOS_SIGNING_REQUIRED }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}

      - name: Publish Homebrew formula
        # GoReleaser no longer manages the tap (its cask replacement is
        # macOS-only). Publish a cross-platform binary formula from the
        # release checksums so `brew install defilantech/tap/llmkube` works on
        # macOS and Linux and tracks every release (#1039 / #1040).
        if: ${{ github.event_name == 'push' }}
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: ./hack/publish-homebrew-formula.sh "$VERSION" dist/checksums.txt

      - name: Upload artifacts
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-artifacts
          path: dist/*

      - name: Install cosign
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Install crane
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b  # v0.7

      # Full sha256:... digests per image, captured once so every sign/attest/
      # verify step below references the exact bytes GoReleaser pushed (#233).
      - name: Capture image digests
        if: ${{ github.event_name == 'push' }}
        id: digests
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          for id in controller foreman-operator foreman-agent router-proxy; do
            d="$(crane digest "ghcr.io/defilantech/llmkube-${id}:${VERSION}")"
            echo "${id}=${d}" >> "$GITHUB_OUTPUT"
          done

      # NOTE: step output names with hyphens (foreman-operator, foreman-agent,
      # router-proxy) are not valid dot-notation identifiers in GitHub Actions
      # expressions (the `-` parses as subtraction), so every reference below
      # uses bracket notation: steps.digests.outputs['foreman-operator'].
      - name: Sign images
        if: ${{ github.event_name == 'push' }}
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          cosign sign --yes "ghcr.io/defilantech/llmkube-controller@${{ steps.digests.outputs.controller }}"
          cosign sign --yes "ghcr.io/defilantech/llmkube-foreman-operator@${{ steps.digests.outputs['foreman-operator'] }}"
          cosign sign --yes "ghcr.io/defilantech/llmkube-foreman-agent@${{ steps.digests.outputs['foreman-agent'] }}"
          cosign sign --yes "ghcr.io/defilantech/llmkube-router-proxy@${{ steps.digests.outputs['router-proxy'] }}"

      - name: Generate SBOM (controller)
        if: ${{ github.event_name == 'push' }}
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          image: ghcr.io/defilantech/llmkube-controller@${{ steps.digests.outputs.controller }}
          format: spdx-json
          output-file: sbom-controller.spdx.json

      - name: Attest SBOM (controller)
        if: ${{ github.event_name == 'push' }}
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ghcr.io/defilantech/llmkube-controller
          subject-digest: ${{ steps.digests.outputs.controller }}
          sbom-path: sbom-controller.spdx.json
          push-to-registry: true

      - name: Attest provenance (controller)
        if: ${{ github.event_name == 'push' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/defilantech/llmkube-controller
          subject-digest: ${{ steps.digests.outputs.controller }}
          push-to-registry: true

      - name: Generate SBOM (foreman-operator)
        if: ${{ github.event_name == 'push' }}
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          image: ghcr.io/defilantech/llmkube-foreman-operator@${{ steps.digests.outputs['foreman-operator'] }}
          format: spdx-json
          output-file: sbom-foreman-operator.spdx.json

      - name: Attest SBOM (foreman-operator)
        if: ${{ github.event_name == 'push' }}
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ghcr.io/defilantech/llmkube-foreman-operator
          subject-digest: ${{ steps.digests.outputs['foreman-operator'] }}
          sbom-path: sbom-foreman-operator.spdx.json
          push-to-registry: true

      - name: Attest provenance (foreman-operator)
        if: ${{ github.event_name == 'push' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/defilantech/llmkube-foreman-operator
          subject-digest: ${{ steps.digests.outputs['foreman-operator'] }}
          push-to-registry: true

      - name: Generate SBOM (foreman-agent)
        if: ${{ github.event_name == 'push' }}
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          image: ghcr.io/defilantech/llmkube-foreman-agent@${{ steps.digests.outputs['foreman-agent'] }}
          format: spdx-json
          output-file: sbom-foreman-agent.spdx.json

      - name: Attest SBOM (foreman-agent)
        if: ${{ github.event_name == 'push' }}
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ghcr.io/defilantech/llmkube-foreman-agent
          subject-digest: ${{ steps.digests.outputs['foreman-agent'] }}
          sbom-path: sbom-foreman-agent.spdx.json
          push-to-registry: true

      - name: Attest provenance (foreman-agent)
        if: ${{ github.event_name == 'push' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/defilantech/llmkube-foreman-agent
          subject-digest: ${{ steps.digests.outputs['foreman-agent'] }}
          push-to-registry: true

      - name: Generate SBOM (router-proxy)
        if: ${{ github.event_name == 'push' }}
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          image: ghcr.io/defilantech/llmkube-router-proxy@${{ steps.digests.outputs['router-proxy'] }}
          format: spdx-json
          output-file: sbom-router-proxy.spdx.json

      - name: Attest SBOM (router-proxy)
        if: ${{ github.event_name == 'push' }}
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ghcr.io/defilantech/llmkube-router-proxy
          subject-digest: ${{ steps.digests.outputs['router-proxy'] }}
          sbom-path: sbom-router-proxy.spdx.json
          push-to-registry: true

      - name: Attest provenance (router-proxy)
        if: ${{ github.event_name == 'push' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/defilantech/llmkube-router-proxy
          subject-digest: ${{ steps.digests.outputs['router-proxy'] }}
          push-to-registry: true

      - name: Verify signatures + attestations
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image=ghcr.io/defilantech/llmkube-controller
          ref="${image}@${{ steps.digests.outputs.controller }}"
          # github.repository preserves the real case (defilantech/LLMKube).
          # GitHub OIDC's workflow_ref does too, so a case-sensitive regexp
          # match against a lowercased literal never matches (#233 review,
          # Critical 2).
          id_re="^${{ github.server_url }}/${{ github.repository }}/\.github/workflows/release-please\.yml@.*$"
          iss=https://token.actions.githubusercontent.com
          owner="${{ github.repository_owner }}"
          cosign verify "$ref" --certificate-identity-regexp "$id_re" --certificate-oidc-issuer "$iss"
          # actions/attest-build-provenance and actions/attest-sbom write to the
          # GitHub attestations store (SLSA v1 provenance + in-toto SBOM
          # predicates), not the older cosign-native predicate types that
          # `cosign verify-attestation --type` expects, so `gh attestation
          # verify` is the canonical verifier for both (#233 review, Important 3).
          gh attestation verify "oci://${ref}" --owner "$owner"
          gh attestation verify "oci://${ref}" --owner "$owner" \
            --predicate-type https://spdx.dev/Document/v2.3

      - name: Attest release binary provenance
        if: ${{ github.event_name == 'push' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - name: Dry-run build + sign + verify (workflow_dispatch)
        # Exercises the full scan -> push -> sign -> verify chain without
        # cutting a release: builds only the controller image for amd64,
        # staged the same way hack/scan-images.sh stages it, then pushes it
        # to a throwaway :provenance-test tag under the running repo's own
        # GHCR namespace (lowercased - GHCR rejects uppercase), so this works
        # unmodified on a fork. The whole point of the dry run is validating
        # the chain before merge, and a fork's token cannot push into
        # ghcr.io/defilantech (#233 review, Important 4).
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          owner_lc="${GITHUB_REPOSITORY_OWNER,,}"
          img="ghcr.io/${owner_lc}/llmkube-controller"
          ctx="$(mktemp -d)"
          mkdir -p "$ctx/linux/amd64"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -o "$ctx/linux/amd64/manager" ./cmd/main.go
          docker buildx build --platform linux/amd64 --push \
            -f Dockerfile.goreleaser -t "${img}:provenance-test" "$ctx"
          digest="$(crane digest "${img}:provenance-test")"
          cosign sign --yes "${img}@${digest}"
          # github.repository preserves real case and resolves to whichever
          # repo (fork or upstream) is actually running the workflow (#233
          # review, Critical 2).
          id_re="^${{ github.server_url }}/${{ github.repository }}/\.github/workflows/release-please\.yml@.*$"
          cosign verify "${img}@${digest}" \
            --certificate-identity-regexp "$id_re" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

  notarize-macos:
    # Submits every darwin binary of the release to Apple's notary service in
    # one submission (hack/macos-notarize.sh, #2084). It runs after the
    # release is published because notarization does not change the
    # binaries: the published assets become notarized when Apple accepts
    # them. A slow queue or a transient failure fails only this job, and
    # "Re-run failed jobs" resubmits without rebuilding anything.
    needs: [release-please, goreleaser]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 75
    permissions:
      contents: read
    env:
      MACOS_SIGNING_REQUIRED: ${{ vars.MACOS_SIGNING_REQUIRED }}
      MACOS_SIGN_P12_SET: ${{ secrets.MACOS_SIGN_P12 != '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check whether to notarize
        id: check
        env:
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        # An assignment, not echo "$(...)", so a failed check fails the step.
        run: |
          notarize="$(./hack/macos-notarize.sh --preflight)"
          echo "notarize=${notarize}" >> "$GITHUB_OUTPUT"

      - name: Download the release's binaries
        if: ${{ steps.check.outputs.notarize == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts
          path: dist

      - name: Install rcodesign
        if: ${{ steps.check.outputs.notarize == 'true' }}
        run: |
          ./hack/install-rcodesign.sh "$RUNNER_TEMP/rcodesign"
          echo "$RUNNER_TEMP/rcodesign" >> "$GITHUB_PATH"

      - name: Notarize the darwin binaries
        if: ${{ steps.check.outputs.notarize == 'true' }}
        env:
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: ./hack/macos-notarize.sh dist/artifacts.json

  release-helm:
    # After goreleaser, not beside it: every image the charts use by default
    # comes from goreleaser, so a chart published first points at images that
    # do not exist yet, and the newest chart cannot be installed until the
    # build finishes (#2361). A failed build also leaves the chart unpublished.
    needs: [release-please, goreleaser]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Sync Chart CRDs Before Packaging
        run: make chart-crds

      - name: Log in to GHCR for Helm OCI
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | helm registry login ghcr.io --username "$GHCR_USER" --password-stdin

      - name: Package and push charts to GHCR (OCI)
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
          OCI_REPO: oci://ghcr.io/defilantech/charts
        run: |
          for chart in llmkube foreman; do
            helm package "charts/$chart" --destination dist-charts
            helm push "dist-charts/$chart-${VERSION}.tgz" "$OCI_REPO"
          done

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@92c6b97fa9f664492a2592e0d1d80bc6bf378957 # v1.9.0
        with:
          mark_as_latest: false
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

  publish-coder-image:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      # The coder image (llmkube-foreman-agent-coder) is built in the separate
      # llmkube-runtimes repo, triggered by a coder-v<version> tag. Create that
      # tag on every release so its coder image publishes automatically, then
      # verify it lands (#932). Requires RUNTIMES_TOKEN: a PAT or GitHub App
      # token with contents:write on llmkube-runtimes (needed both to push the
      # tag and to trigger the downstream workflow — the default GITHUB_TOKEN
      # cannot do cross-repo writes and would not fire the tag-triggered build).
      # Without the secret this job is a warning-only no-op, so releases still
      # succeed until it is provisioned.
      - name: Gate on cross-repo token
        id: gate
        env:
          RUNTIMES_TOKEN: ${{ secrets.RUNTIMES_TOKEN }}
        run: |
          if [ -z "$RUNTIMES_TOKEN" ]; then
            echo "::warning::RUNTIMES_TOKEN not set; skipping automatic coder-image publish for v${{ needs.release-please.outputs.version }}. Add the secret (contents:write on llmkube-runtimes) to automate, or push coder-v${{ needs.release-please.outputs.version }} manually (#932)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag llmkube-runtimes to build the coder image
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.RUNTIMES_TOKEN }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          repo=defilantech/llmkube-runtimes
          tag="coder-v${VERSION}"
          if gh api "repos/${repo}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            echo "tag ${tag} already exists in ${repo}; not recreating"
          else
            sha=$(gh api "repos/${repo}/commits/main" --jq .sha)
            gh api "repos/${repo}/git/refs" -f ref="refs/tags/${tag}" -f sha="${sha}"
            echo "created ${repo}@${tag} -> ${sha}"
          fi

      - name: Verify coder image published
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          image=defilantech/llmkube-foreman-agent-coder
          for i in $(seq 1 45); do
            token=$(curl -sSf "https://ghcr.io/token?scope=repository:${image}:pull" | jq -r .token)
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${token}" \
              -H 'Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.docker.distribution.manifest.v2+json' \
              "https://ghcr.io/v2/${image}/manifests/${VERSION}")
            if [ "${code}" = "200" ]; then
              echo "coder image ${image}:${VERSION} is published"
              exit 0
            fi
            echo "waiting for ${image}:${VERSION} (attempt ${i}/45, http ${code})"
            sleep 40
          done
          echo "::error::coder image ${image}:${VERSION} not published within ~30m; check the build-coder run in llmkube-runtimes (#932)"
          exit 1

  notify-released:
    # Tell issue reporters and outside contributors that their fix or PR
    # shipped. Waits for the images, binaries and charts, so nobody is pointed
    # at a release they cannot install yet.
    needs: [release-please, goreleaser, release-helm]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: ./.github/workflows/release-notify.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
