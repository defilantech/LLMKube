{{- if .Values.prometheus.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "llmkube.fullname" . }}-alerts
  namespace: {{ include "llmkube.prometheus.prometheusRule.namespace" . }}
  labels:
    {{- include "llmkube.labels" . | nindent 4 }}
    {{- with .Values.prometheus.prometheusRule.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
  {{- if .Values.prometheus.prometheusRule.rules.gpu.enabled }}
  {{- $m := include "llmkube.gpuMetricNames" . | fromYaml }}
  - name: llmkube-slo
    interval: 30s
    rules:
    # GPU High Utilization Alert
    - alert: GPUHighUtilization
      expr: ({{ $m.util }}) > {{ .Values.prometheus.prometheusRule.rules.gpu.highUtilizationThreshold }}
      for: 5m
      labels:
        severity: warning
        component: gpu
      annotations:
        summary: "GPU utilization is high"
        description: "GPU {{`{{ $labels.instance }}`}} utilization is {{`{{ $value }}`}}% (threshold: {{ .Values.prometheus.prometheusRule.rules.gpu.highUtilizationThreshold }}%)"

    # GPU High Temperature Alert
    - alert: GPUHighTemperature
      expr: ({{ $m.temp }}) > {{ .Values.prometheus.prometheusRule.rules.gpu.highTemperatureThreshold }}
      for: 2m
      labels:
        severity: critical
        component: gpu
      annotations:
        summary: "GPU temperature is critically high"
        description: "GPU {{`{{ $labels.instance }}`}} temperature is {{`{{ $value }}`}}°C (threshold: {{ .Values.prometheus.prometheusRule.rules.gpu.highTemperatureThreshold }}°C)"

    {{- if .Values.prometheus.prometheusRule.rules.gpu.memoryPressure.enabled }}
    # GPU Memory Pressure Alert. Off by default: on an inference host VRAM
    # utilization is a configured value, not pressure. The runtime reserves
    # whatever fraction it was given (SGLang mem-fraction-static, vLLM
    # gpu-memory-utilization) and holds it for the process lifetime, so the
    # gauge reports the setting rather than demand and never falls under load.
    # Enable where VRAM is allocated on demand and a high reading means
    # something.
    - alert: GPUMemoryPressure
      expr: ({{ $m.mem }}) > {{ .Values.prometheus.prometheusRule.rules.gpu.memoryPressureThreshold }}
      for: 5m
      labels:
        severity: warning
        component: gpu
      annotations:
        summary: "GPU memory usage is high"
        description: "GPU {{`{{ $labels.instance }}`}} memory usage is {{`{{ $value }}`}}% (threshold: {{ .Values.prometheus.prometheusRule.rules.gpu.memoryPressureThreshold }}%)"
    {{- end }}

    # GPU Power Limit Alert
    - alert: GPUPowerLimit
      expr: ({{ $m.power }}) > {{ .Values.prometheus.prometheusRule.rules.gpu.powerLimitThreshold }}
      for: 10m
      labels:
        severity: warning
        component: gpu
      annotations:
        summary: "GPU power usage is high"
        description: "GPU {{`{{ $labels.instance }}`}} power usage is {{`{{ $value }}`}}W (threshold: {{ .Values.prometheus.prometheusRule.rules.gpu.powerLimitThreshold }}W)"

    # The utilization series dropping out (not dropping to zero) reads as a
    # healthy idle GPU, same silent no-op class as #1356 — none of the known
    # exporters (DCGM, amdgpu-sysfs, drm) is reporting.
    - alert: GPUMetricsMissing
      expr: absent(DCGM_FI_DEV_GPU_UTIL) and absent(amdgpu_gpu_busy_percent) and absent(drm_engine_utilization_ratio)
      for: 15m
      labels:
        severity: warning
        component: gpu
      annotations:
        summary: "GPU metrics are not being scraped"
        description: "No DCGM, amdgpu-sysfs, or drm-exporter utilization series for 15 minutes. Check that a GPU metrics exporter is running."
  {{- end }}

  {{- if .Values.prometheus.prometheusRule.rules.gpuHealth.enabled }}
  {{- $xids := .Values.prometheus.prometheusRule.rules.gpuHealth.criticalXids }}
  {{- /* --set ...criticalXids=null deletes the key and skips the schema's
         minItems; an empty list renders xid=~"" and an empty or-chain. */}}
  {{- if not $xids }}
  {{- fail "prometheus.prometheusRule.rules.gpuHealth.criticalXids must list at least one Xid; set gpuHealth.enabled=false to drop the GPU fault alerts instead" }}
  {{- end }}
  - name: llmkube-gpu-health
    interval: 30s
    rules:
    # The driver's own verdict that the GPU needs recovery (Xid 154 carries
    # it). Nothing else names the required action, and the device plugin
    # keeps the GPU allocatable meanwhile. Not in the exporter's default
    # counters: needs DCGM_FI_DEV_GPU_RECOVERY_ACTION in its CSV.
    - alert: GPURecoveryActionRequired
      expr: DCGM_FI_DEV_GPU_RECOVERY_ACTION > 0
      for: 1m
      labels:
        severity: critical
        component: gpu
      annotations:
        summary: "GPU needs a recovery action before it can run work"
        description: "GPU {{`{{ $labels.gpu }}`}} ({{`{{ $labels.UUID }}`}}) on {{`{{ $labels.Hostname }}`}} reports recovery action {{`{{ $value }}`}} (1=GPU reset, 2=node reboot, 3=drain P2P, 4=drain and reset){{`{{ if $labels.pod }}`}} while allocated to pod {{`{{ $labels.namespace }}`}}/{{`{{ $labels.pod }}`}}{{`{{ end }}`}}. New CUDA contexts on it fail until the action is taken, and the device plugin may still schedule pods onto it."

    # Counts every Xid, including one the next Xid overwrites a few seconds
    # later (154 followed by 109 is a real sequence); the last-value gauge
    # below loses those. Needs DCGM_EXP_XID_ERRORS_TOTAL, dcgm-exporter
    # 4.6.0-4.8.3 or newer.
    #
    # The exporter creates a GPU's series for an Xid at its first occurrence,
    # already at 1, and increase() needs an earlier sample to see a jump, so
    # increase() alone misses the first fault of each Xid on each GPU. The
    # second arm catches a series that is new in the window.
    - alert: GPUCriticalXid
      expr: |
        increase(DCGM_EXP_XID_ERRORS_TOTAL{xid=~"{{ join "|" $xids }}"}[15m]) > 0
        or
        (
          DCGM_EXP_XID_ERRORS_TOTAL{xid=~"{{ join "|" $xids }}"}
          unless DCGM_EXP_XID_ERRORS_TOTAL{xid=~"{{ join "|" $xids }}"} offset 15m
        )
      for: 0m
      labels:
        severity: critical
        component: gpu
      annotations:
        summary: "GPU reported an Xid that needs a reset or hardware follow-up"
        description: "GPU {{`{{ $labels.gpu }}`}} ({{`{{ $labels.UUID }}`}}) on {{`{{ $labels.Hostname }}`}} reported Xid {{`{{ $labels.xid }}`}} in the last 15 minutes{{`{{ if $labels.pod }}`}}, while allocated to pod {{`{{ $labels.namespace }}`}}/{{`{{ $labels.pod }}`}}{{`{{ end }}`}}. Check the NVIDIA Xid catalog for the resolution before scheduling more work on it."

    # Fallback for exporters without the Xid counter: the default
    # DCGM_FI_DEV_XID_ERRORS holds only the most recent Xid. Value equality,
    # not the err_code label, so older exporters without that label still
    # match. The counter emits a series only for a GPU and Xid it has seen, so
    # the unless hands a GPU over to GPUCriticalXid once the counter has
    # counted a fault there, and one fault does not page twice.
    - alert: GPUCriticalXidLastValue
      expr: |
        (
          {{- range $i, $x := $xids }}
          {{ if $i }}or {{ end }}DCGM_FI_DEV_XID_ERRORS == {{ $x }}
          {{- end }}
        )
        unless on (UUID) DCGM_EXP_XID_ERRORS_TOTAL
      for: 0m
      labels:
        severity: critical
        component: gpu
      annotations:
        summary: "GPU's most recent Xid needs a reset or hardware follow-up"
        description: "GPU {{`{{ $labels.gpu }}`}} ({{`{{ $labels.UUID }}`}}) on {{`{{ $labels.Hostname }}`}} last reported Xid {{`{{ $value }}`}}{{`{{ if $labels.pod }}`}}, while allocated to pod {{`{{ $labels.namespace }}`}}/{{`{{ $labels.pod }}`}}{{`{{ end }}`}}. This exporter reports only the latest Xid, so an earlier one may be hidden; enable DCGM_EXP_XID_ERRORS_TOTAL to see all of them."

    # Row remapping failed: the GPU can no longer retire bad memory rows.
    # In the default counters.
    - alert: GPURowRemapFailure
      expr: DCGM_FI_DEV_ROW_REMAP_FAILURE > 0
      for: 0m
      labels:
        severity: critical
        component: gpu
      annotations:
        summary: "GPU memory row remapping failed"
        description: "GPU {{`{{ $labels.gpu }}`}} ({{`{{ $labels.UUID }}`}}) on {{`{{ $labels.Hostname }}`}} failed to remap a memory row. Take it out of service and open a support case."

    # In the default counters.
    - alert: GPUUncorrectableRowsRemapped
      expr: increase(DCGM_FI_DEV_UNCORRECTABLE_REMAPPED_ROWS[1h]) > 0
      for: 0m
      labels:
        severity: warning
        component: gpu
      annotations:
        summary: "GPU remapped memory rows after uncorrectable errors"
        description: "GPU {{`{{ $labels.gpu }}`}} ({{`{{ $labels.UUID }}`}}) on {{`{{ $labels.Hostname }}`}} remapped memory rows after uncorrectable ECC errors in the last hour. Check nvidia-smi -q -d ROW_REMAPPER for a pending remap, which takes effect after a GPU reset."

    # DCGM's own health watches (20 = FAIL, 10 = WARN). Needs
    # DCGM_EXP_GPU_HEALTH_STATUS, dcgm-exporter 4.6.0-4.8.3 or newer.
    - alert: GPUHealthCheckFailed
      expr: DCGM_EXP_GPU_HEALTH_STATUS == 20
      for: 0m
      labels:
        severity: critical
        component: gpu
      annotations:
        summary: "DCGM health check reports a GPU failure"
        description: "GPU {{`{{ $labels.gpu }}`}} ({{`{{ $labels.UUID }}`}}) on {{`{{ $labels.Hostname }}`}} fails the DCGM {{`{{ $labels.health_watch }}`}} health watch ({{`{{ $labels.health_error_code }}`}})."

    - alert: GPUHealthCheckWarning
      expr: DCGM_EXP_GPU_HEALTH_STATUS == 10
      for: 15m
      labels:
        severity: warning
        component: gpu
      annotations:
        summary: "DCGM health check reports a GPU warning"
        description: "GPU {{`{{ $labels.gpu }}`}} ({{`{{ $labels.UUID }}`}}) on {{`{{ $labels.Hostname }}`}} has warned on the DCGM {{`{{ $labels.health_watch }}`}} health watch ({{`{{ $labels.health_error_code }}`}}) for 15 minutes."
  {{- end }}

  {{- if and .Values.prometheus.prometheusRule.rules.serving.enabled .Values.prometheus.inferencePodMonitor.enabled }}
  - name: llmkube-serving
    interval: 30s
    rules:
    # TGI, PersonaPlex and Generic export no queue metrics under these
    # selectors, so they're left out. LlamaCppRouter is NOT excluded: it runs
    # llama-server and runtime_llamacpp_router.go appends --metrics, so router
    # pods emit llamacpp:* and are covered by the third arm.
    #
    # avg_over_time and a "<= 1" ceiling (not "== 0") catch a partial stall and
    # survive a single scrape ticking above it.
    #
    # The llama.cpp arm gates on THROUGHPUT rather than a running-count ceiling,
    # because that ceiling is meaningless there. executor.go omits --parallel
    # when ParallelSlots <= 1 (one slot is llama-server's own default), so
    # requests_processing is only ever 0 or 1 and the "<= 1" test is permanently
    # true: a healthy single-slot engine at processing=1, deferred=3 would page
    # at severity critical. A ceiling is also unstable around its own boundary --
    # with running oscillating 0/1/2 the 10m average lands either side of 1 on
    # consecutive evaluations, so `for: 10m` is never satisfied and a REAL stall
    # hovering there never fires either. Zero decode calls while a queue
    # persists is the honest definition of "not admitting work", and it holds
    # for one slot and for many. n_decode_total, not tokens_predicted_total:
    # --embedding and --reranking servers decode but never predict a token.
    - alert: InferenceAdmissionStalled
      expr: |
        (avg_over_time(vllm:num_requests_waiting[10m]) > 0 and avg_over_time(vllm:num_requests_running[10m]) <= 1)
        or
        (avg_over_time(sglang:num_queue_reqs[10m]) > 0 and avg_over_time(sglang:num_running_reqs[10m]) <= 1)
        or
        (avg_over_time(llamacpp:requests_deferred[10m]) > 0 and rate(llamacpp:n_decode_total[10m]) == 0)
      for: 10m
      labels:
        severity: critical
        component: inference
      annotations:
        summary: "Inference engine is queuing requests but running almost none"
        description: "{{`{{ $labels.service }}`}} in {{`{{ $labels.namespace }}`}} has {{`{{ $value }}`}} requests queued while running almost none. The process is up; it is not admitting work."

    # Same silent no-op class as GPUMetricsMissing/ControllerMetricsMissing: a
    # dead selector reads as an idle-but-healthy engine, not a gap.
    - alert: InferenceMetricsMissing
      expr: absent(vllm:num_requests_running) and absent(sglang:num_running_reqs) and absent(llamacpp:requests_processing)
      for: 15m
      labels:
        severity: warning
        component: inference
      annotations:
        summary: "Inference serving metrics are not being scraped"
        description: "No vLLM, SGLang, or llama.cpp request-count series for 15 minutes. Check the inference PodMonitor selector and pod labels."

    # Reuses the per-pod p95 record below instead of re-deriving the ratio, so
    # a third runtime is a one-line record edit. count>5 guards against a
    # single slow request after a cold start reading as a sustained breach.
    # `and on (...)` below is load-bearing, not stylistic. The p95 record stamps
    # latency_kind="queue_wait" via its labels: block, while the min-sample guard
    # is a bare sum by (service, namespace, runtime, pod) and carries no such
    # label. A plain `and` matches on the FULL label set, so the two sides never
    # join and the alert cannot fire on any input. Naming the join keys keeps it
    # alive. KVOffloadLoadSlow uses the bare form safely because both of its
    # sides are sum by (...) with identical labels, which is what makes this
    # invisible on a read-through.
    - alert: InferenceQueueTimeHigh
      expr: |
        (
          llmkube:inference:queue_time_seconds:p95_5m
          and on (service, namespace, runtime, pod) (
            sum by (service, namespace, runtime, pod) (increase(vllm:request_queue_time_seconds_count[15m]))
            or
            sum by (service, namespace, runtime, pod) (increase(sglang:queue_time_seconds_count[15m]))
          ) > 5
        ) > {{ .Values.prometheus.prometheusRule.rules.serving.queueTimeSecondsThreshold }}
      for: 15m
      labels:
        severity: warning
        component: inference
      annotations:
        summary: "Inference requests are waiting a long time before starting"
        description: "{{`{{ $labels.service }}`}} pod {{`{{ $labels.pod }}`}} in {{`{{ $labels.namespace }}`}} is queuing requests {{`{{ $value | printf \"%.0f\" }}`}}s before they start (threshold: {{ .Values.prometheus.prometheusRule.rules.serving.queueTimeSecondsThreshold }}s)."

    {{- if .Values.prometheus.prometheusRule.rules.serving.kvOffload.enabled }}
    # A slow async KV load holds its blocks for the whole transfer, gating
    # admission; names the cause where InferenceQueueTimeHigh only sees the symptom.
    - alert: KVOffloadLoadSlow
      expr: |
        (
          sum by (service, namespace, runtime, pod) (increase(vllm:kv_offload_lookup_async_delay_seconds_sum[30m]))
          /
          sum by (service, namespace, runtime, pod) (increase(vllm:kv_offload_lookup_async_delay_seconds_count[30m]))
          and sum by (service, namespace, runtime, pod) (increase(vllm:kv_offload_lookup_async_delay_seconds_count[30m])) > 5
        ) > {{ .Values.prometheus.prometheusRule.rules.serving.kvOffload.loadSecondsThreshold }}
      for: 15m
      labels:
        severity: warning
        component: inference
      annotations:
        summary: "KV offload loads are slow enough to gate admission"
        description: "{{`{{ $labels.service }}`}} pod {{`{{ $labels.pod }}`}} in {{`{{ $labels.namespace }}`}} is averaging {{`{{ $value | printf \"%.0f\" }}`}}s per async KV-offload load (threshold: {{ .Values.prometheus.prometheusRule.rules.serving.kvOffload.loadSecondsThreshold }}s)."
    {{- end }}
  {{- end }}

  {{- if .Values.prometheus.prometheusRule.rules.inference.enabled }}
  - name: llmkube-inference
    interval: 30s
    rules:
    # Inference Service Down Alert
    - alert: InferenceServiceDown
      expr: up{job="llmkube-inference"} == 0
      for: 1m
      labels:
        severity: critical
        component: inference
      annotations:
        summary: "Inference service is down"
        description: "Inference service {{`{{ $labels.instance }}`}} has been down for more than 1 minute"

    # Model Controller Down Alert
    - alert: ControllerDown
      expr: up{job="llmkube-controller"} == 0
      for: 2m
      labels:
        severity: critical
        component: controller
      annotations:
        summary: "LLMKube controller is down"
        description: "Controller {{`{{ $labels.instance }}`}} has been down for more than 2 minutes"

    {{- if .Values.prometheus.serviceMonitor.enabled }}
    # up{} == 0 needs the series to exist; a stale job label removes it
    # instead, which is how #1223 stayed silent. Gated on the chart owning
    # the scrape target.
    - alert: ControllerMetricsMissing
      expr: absent(up{job="llmkube-controller"})
      for: 15m
      labels:
        severity: warning
        component: controller
      annotations:
        summary: "LLMKube controller metrics are not being scraped"
        description: "No up series for job=llmkube-controller for 15 minutes — the scrape target is gone, or its job label no longer matches ControllerDown."
    {{- end }}

  - name: llmkube-inference-recording
    interval: 30s
    rules:
    # Request latency over 5m. vLLM and SGLang both export the histogram;
    # llama.cpp's server exposes 11 metrics and none of them is a
    # request-latency histogram. The runtime label keeps the prefixes apart.
    - record: llmkube:inference:request_latency:p95_5m
      expr: |
        histogram_quantile(0.95,
          sum by (service, namespace, runtime, le) (
            rate(vllm:e2e_request_latency_seconds_bucket[5m])
            or rate(sglang:e2e_request_latency_seconds_bucket[5m])
          )
        )
      labels:
        latency_kind: end_to_end

    - record: llmkube:inference:request_latency:p50_5m
      expr: |
        histogram_quantile(0.50,
          sum by (service, namespace, runtime, le) (
            rate(vllm:e2e_request_latency_seconds_bucket[5m])
            or rate(sglang:e2e_request_latency_seconds_bucket[5m])
          )
        )
      labels:
        latency_kind: end_to_end

    # Inference pod restart rate as a coarse error proxy. Per-request
    # 4xx/5xx counters are tracked in #409 and will replace this once the
    # upstream metric paths are confirmed for each runtime.
    #
    # Alternation is every backend's ContainerName(), enforced by
    # TestChartRestartRuleCoversEveryBackend. Keyed by pod because
    # kube-state-metrics carries no service or runtime label.
    - record: llmkube:inference:restarts:rate5m
      expr: |
        sum by (namespace, pod, container) (
          rate(kube_pod_container_status_restarts_total{
            container=~"llama-server|sglang|vllm|tgi|personaplex|inference-server"
          }[5m])
        )

    # TTFT over 5m, same two runtimes.
    - record: llmkube:inference:ttft_seconds:p95_5m
      expr: histogram_quantile(0.95, sum by (service, namespace, runtime, le) (rate(vllm:time_to_first_token_seconds_bucket[5m]) or rate(sglang:time_to_first_token_seconds_bucket[5m])))
      labels:
        latency_kind: ttft

    - record: llmkube:inference:ttft_seconds:p50_5m
      expr: histogram_quantile(0.50, sum by (service, namespace, runtime, le) (rate(vllm:time_to_first_token_seconds_bucket[5m]) or rate(sglang:time_to_first_token_seconds_bucket[5m])))
      labels:
        latency_kind: ttft

    # Queue wait over 5m, covers vLLM and SGLang. By pod, not just service (unlike
    # the request_latency/ttft_seconds records above): a service-wide percentile
    # would dilute one stalled replica out of it, and InferenceQueueTimeHigh
    # alerts straight off this one.
    - record: llmkube:inference:queue_time_seconds:p95_5m
      expr: histogram_quantile(0.95, sum by (service, namespace, runtime, pod, le) (rate(vllm:request_queue_time_seconds_bucket[5m]) or rate(sglang:queue_time_seconds_bucket[5m])))
      labels:
        latency_kind: queue_wait

    - record: llmkube:inference:queue_time_seconds:p50_5m
      expr: histogram_quantile(0.50, sum by (service, namespace, runtime, pod, le) (rate(vllm:request_queue_time_seconds_bucket[5m]) or rate(sglang:queue_time_seconds_bucket[5m])))
      labels:
        latency_kind: queue_wait
  {{- end }}

  {{- $watchCanary := .Values.controllerManager.watchCanary | default dict }}
  {{- /* The canary alerts read the canary's gauges, which only the canary
         updates, so render them only when the canary itself is on (interval
         set and not "0s"), matching the deployment args and the Role
         condition. The unreconciled-generation alert is gated the same way on
         its own check. The group renders when either is on. */}}
  {{- $canaryAlerts := and .Values.prometheus.prometheusRule.rules.watchCanary.enabled $watchCanary.interval (ne (toString $watchCanary.interval) "0s") }}
  {{- $ug := .Values.controllerManager.unreconciledGeneration | default dict }}
  {{- $ugRules := .Values.prometheus.prometheusRule.rules.unreconciledGeneration | default dict }}
  {{- $ugAlert := and $ugRules.enabled $ug.interval (ne (toString $ug.interval) "0s") }}
  {{- if or $canaryAlerts $ugAlert }}
  - name: llmkube-controller-watch
    interval: 30s
    rules:
    {{- if $canaryAlerts }}
    # The operator's watch pipeline stopped delivering events (#2069): the pod
    # stays Running, its probes pass and its webhooks answer while every
    # controller goes silent, so spec changes are silently ignored. The
    # canary's liveness probe restarts the pod once
    # --watch-canary-fail-after elapses; this alert pages when the stall
    # outlasts that (restart loops, or a canary that cannot write at all).
    - alert: LLMKubeControllerWatchStalled
      expr: llmkube_watch_canary_up == 1 and (time() - llmkube_watch_canary_last_observed_timestamp_seconds) > {{ .Values.prometheus.prometheusRule.rules.watchCanary.stalledSeconds }}
      for: 2m
      labels:
        severity: critical
        component: controller
      annotations:
        summary: "LLMKube operator watch pipeline is stalled"
        description: "The watch canary's writes have gone unobserved by the operator's own informer for over {{ .Values.prometheus.prometheusRule.rules.watchCanary.stalledSeconds }}s on {{`{{ $labels.pod }}`}}. Spec changes are not being reconciled. Check the operator's liveness probe events and docs/operations/runbooks/operator-stalled-watch.md."

    # The canary never completed a full write-then-observe cycle: disabled by
    # a misconfigured namespace, missing lease RBAC (the operator then
    # restart-loops on its own liveness check), or a watch that never synced.
    # Standbys never write, so a lone 0 series is expected in HA: fire only
    # when no scraped pod in the namespace has completed a cycle.
    - alert: LLMKubeControllerWatchCanaryDown
      expr: llmkube_watch_canary_up == 0 and on(namespace) (max by (namespace) (llmkube_watch_canary_up) == 0)
      for: {{ .Values.prometheus.prometheusRule.rules.watchCanary.downFor }}
      labels:
        severity: warning
        component: controller
      annotations:
        summary: "LLMKube operator watch canary is not coming up"
        description: "The watch canary on {{`{{ $labels.pod }}`}} has not completed a single write-observe cycle for {{ .Values.prometheus.prometheusRule.rules.watchCanary.downFor }}. Check the operator logs for watch-canary write errors (RBAC or namespace misconfiguration)."
    {{- end }}
    {{- if $ugAlert }}

    # A spec change on an InferenceService or Model has gone unreconciled
    # (#2308): metadata.generation has stayed ahead of every condition's
    # observedGeneration past the threshold. Informers are per resource type,
    # so one kind's watch can die while the canary's Lease informer stays
    # healthy. The operator measures through the API server, not its cache, so
    # a frozen cache cannot hide the lag. Warning, not critical: a reconcile
    # error retried forever looks the same, and nothing restarts the pod.
    - alert: LLMKubeUnreconciledGeneration
      expr: llmkube_unreconciled_generation_oldest_seconds > {{ int (required "controllerManager.unreconciledGeneration.thresholdSeconds is required while the check is on" $ug.thresholdSeconds) }}
      for: 0m
      labels:
        severity: warning
        component: controller
      annotations:
        summary: "LLMKube {{`{{ $labels.kind }}`}} spec change has gone unreconciled"
        description: "A {{`{{ $labels.kind }}`}} spec change has gone unreconciled for {{`{{ $value | humanizeDuration }}`}} on {{`{{ $labels.pod }}`}}: metadata.generation is ahead of every status condition's observedGeneration. The {{`{{ $labels.kind }}`}} informer may have stopped delivering events. See docs/operations/runbooks/operator-stalled-watch.md."
    {{- end }}
  {{- end }}
{{- end }}
