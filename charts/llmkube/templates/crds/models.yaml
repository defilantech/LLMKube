{{- if .Values.crds.install }}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
    {{- if .Values.crds.keep }}
    helm.sh/resource-policy: keep
    {{- end }}
  name: models.inference.llmkube.dev
spec:
  group: inference.llmkube.dev
  names:
    kind: Model
    listKind: ModelList
    plural: models
    shortNames:
    - mdl
    singular: model
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.size
      name: Size
      type: string
    - jsonPath: .spec.hardware.accelerator
      name: Accelerator
      type: string
    - jsonPath: .status.gguf.architecture
      name: Arch
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Model is the Schema for the models API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Model
            properties:
              attestation:
                description: |-
                  Attestation references a Socair attestation for this Model's artifact:
                  a DSSE-signed in-toto statement whose subject digest must equal
                  spec.sha256. When the operator runs with --model-attestation=enforce, a
                  Model without an attestation that a trusted key signed and the policy
                  admits never becomes Ready, so no InferenceService serves it. With
                  --model-attestation=warn the result is reported on the
                  AttestationVerified condition without blocking.
                properties:
                  configMapKeyRef:
                    description: |-
                      ConfigMapKeyRef selects the key, in a ConfigMap in the Model's
                      namespace, that holds the attestation's DSSE envelope (the
                      attestation.dsse.json that `socair sign` writes).
                    properties:
                      key:
                        description: |-
                          The key to select from the ConfigMap's Data field.
                          Keys in the BinaryData field are not currently propagated to container env vars.
                        type: string
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                      optional:
                        description: Specify whether the ConfigMap or its key must
                          be defined
                        type: boolean
                    required:
                    - key
                    type: object
                    x-kubernetes-map-type: atomic
                required:
                - configMapKeyRef
                type: object
              fileSha256:
                additionalProperties:
                  description: SHA256Digest is a hex-encoded SHA256 digest (64 characters,
                    either case).
                  pattern: ^[a-fA-F0-9]{64}$
                  type: string
                description: |-
                  FileSHA256 is a per-file SHA256 map for multi-file staging, keyed by
                  file entry (the exact path or URL in spec.files, or spec.mmproj). Only
                  listed files are verified; a file with no entry is staged as before. It
                  is mutually exclusive with spec.sha256, and requires concrete file paths:
                  a glob cannot be keyed to an unknown expanded name, and a pre-staged
                  oci:// artifact carries its own digest, so both are rejected at admission
                  (#1978).
                maxProperties: 256
                type: object
              files:
                description: |-
                  Files lists model weight artifacts to stage from Source. Entries are
                  repo-relative for repository sources, or absolute http(s)/s3 object URLs.
                  HuggingFace resolve URLs retain the path within their repository; S3 URLs
                  retain the object key; other HTTP URLs use the basename. Conflicting
                  destination paths are rejected. Explicit URLs use per-origin credentials
                  and require in-cluster staging (not the Metal agent or pre-staged volumes).
                  The first entry is the primary model
                  file passed to the runtime. When Files is empty, Source must name a single
                  object directly.
                items:
                  maxLength: 512
                  type: string
                maxItems: 256
                type: array
              format:
                default: gguf
                description: |-
                  Format specifies the model file format.
                  "gguf" is used with the llama-server runtime; "mlx" is used with the oMLX runtime;
                  "safetensors", "pytorch", and "custom" are used with the generic runtime.
                enum:
                - gguf
                - mlx
                - safetensors
                - pytorch
                - custom
                type: string
              hardware:
                description: Hardware specifies hardware acceleration preferences
                properties:
                  accelerator:
                    default: cpu
                    description: |-
                      Accelerator specifies the type of hardware acceleration.
                      "vulkan" covers AMD and Intel GPUs using the Vulkan runtime
                      (gpu.vendor: amd/intel + gpu.runtime: vulkan). When set to
                      "vulkan" the readiness-check path uses devic.es/dri-render as
                      the GPU resource name instead of amd.com/gpu or nvidia.com/gpu.
                      "rocm" is the HIP compute tier for AMD GPUs (LLMKube's own
                      hardware-validated ROCm llama.cpp image, see #701); like "vulkan"
                      it resolves to devic.es/dri-render rather than amd.com/gpu, since
                      the two runtimes share the same physical device on single-GPU AMD
                      nodes. The tiers differ only in the container image they select.
                    enum:
                    - cpu
                    - metal
                    - cuda
                    - rocm
                    - intel
                    - vulkan
                    type: string
                  gpu:
                    description: GPU specifies GPU device requirements
                    properties:
                      count:
                        description: |-
                          Count is the number of GPUs the model uses. It sizes the runtime (for
                          example vLLM's --tensor-parallel-size when above 1) and, without
                          resourceClaims, requests that many devices through the device plugin as a
                          container limit (nvidia.com/gpu by default). With resourceClaims set the
                          claims allocate the devices and no device-plugin limit is added; set Count
                          to the number of devices the claims provide so the runtime is sized to match.
                        format: int32
                        maximum: 8
                        minimum: 0
                        type: integer
                      enabled:
                        description: Enabled indicates whether GPU acceleration is
                          enabled
                        type: boolean
                      layers:
                        description: |-
                          Layers specifies layer offloading configuration for multi-GPU
                          Format: number of layers to offload to GPU (e.g., 32 for full offload on 7B model)
                          -1 means auto-detect optimal layer split
                        format: int32
                        minimum: -1
                        type: integer
                      memory:
                        description: Memory specifies minimum GPU memory required
                          per GPU (e.g., "8Gi", "16Gi")
                        type: string
                      resourceClaims:
                        description: |-
                          ResourceClaims defines DRA (Dynamic Resource Allocation) claims for GPU devices.
                          Uses resource.k8s.io/v1 PodResourceClaim format. Each claim must have exactly
                          one of resourceClaimName or resourceClaimTemplateName set.
                          Mutually exclusive with resourceName. When set, the operator does not add a
                          device-plugin GPU limit; Count still sizes the runtime.
                        items:
                          description: |-
                            PodResourceClaim references exactly one ResourceClaim, either directly
                            or by naming a ResourceClaimTemplate which is then turned into a ResourceClaim
                            for the pod.

                            It adds a name to it that uniquely identifies the ResourceClaim inside the Pod.
                            Containers that need access to the ResourceClaim reference it with this name.

                            When the DRAWorkloadResourceClaims feature gate is enabled and this Pod
                            belongs to a PodGroup, a PodResourceClaim is matched to a
                            PodGroupResourceClaim if all of their fields are equal (Name,
                            ResourceClaimName, and ResourceClaimTemplateName). A matched claim references
                            a single ResourceClaim shared across all Pods in the PodGroup, reserved for
                            the PodGroup in ResourceClaimStatus.ReservedFor rather than for individual
                            Pods.
                          properties:
                            name:
                              description: |-
                                Name uniquely identifies this resource claim inside the pod.
                                This must be a DNS_LABEL.
                              type: string
                            resourceClaimName:
                              description: |-
                                ResourceClaimName is the name of a ResourceClaim object in the same
                                namespace as this pod.

                                Exactly one of ResourceClaimName and ResourceClaimTemplateName must
                                be set.
                              type: string
                            resourceClaimTemplateName:
                              description: |-
                                ResourceClaimTemplateName is the name of a ResourceClaimTemplate
                                object in the same namespace as this pod.

                                The template will be used to create a new ResourceClaim, which will
                                be bound to this pod. When this pod is deleted, the ResourceClaim
                                will also be deleted. The pod name and resource name, along with a
                                generated component, will be used to form a unique name for the
                                ResourceClaim, which will be recorded in pod.status.resourceClaimStatuses.

                                When the DRAWorkloadResourceClaims feature gate is enabled and the pod
                                belongs to a PodGroup that defines a PodGroupResourceClaim with the same
                                Name and ResourceClaimTemplateName, this PodResourceClaim resolves to the
                                ResourceClaim generated for the PodGroup. All pods in the group that
                                define an equivalent PodResourceClaim matching the
                                PodGroupResourceClaim's Name and ResourceClaimTemplateName share the same
                                generated ResourceClaim. ResourceClaims generated for a PodGroup are
                                owned by the PodGroup and their lifecycles are tied to the PodGroup
                                instead of any individual pod.

                                This field is immutable and no changes will be made to the
                                corresponding ResourceClaim by the control plane after creating the
                                ResourceClaim.

                                Exactly one of ResourceClaimName and ResourceClaimTemplateName must
                                be set.
                              type: string
                          required:
                          - name
                          type: object
                        maxItems: 16
                        type: array
                        x-kubernetes-validations:
                        - message: each claim must have exactly one of resourceClaimName
                            or resourceClaimTemplateName
                          rule: self.size() == 0 || self.all(c, (has(c.resourceClaimName)
                            && !has(c.resourceClaimTemplateName)) || (!has(c.resourceClaimName)
                            && has(c.resourceClaimTemplateName)))
                      resourceName:
                        description: |-
                          ResourceName overrides the extended resource the operator requests for
                          this Model's pods. Defaults are derived from Vendor:
                            nvidia -> nvidia.com/gpu
                            amd    -> amd.com/gpu
                            intel  -> gpu.intel.com/i915
                          Set this for non-default device plugins (e.g. squat/generic-device-plugin
                          advertising `squat.ai/dri-render`, NVIDIA MIG slices). When set, this
                          value also drives the GPU toleration unless TolerationKey is provided
                          explicitly.
                        pattern: ^[a-z0-9.\-]+/[a-z0-9._\-]+$
                        type: string
                      runtime:
                        description: |-
                          Runtime selects the GPU compute backend the operator schedules for this
                          Model, independent of the Vendor field. It exists so `vendor: amd` is not
                          overloaded to mean both "ROCm" and "Vulkan".

                          For the llama.cpp inference backend with `vendor: amd`:
                            - "vulkan": schedule LLMKube's Vulkan llama.cpp image and request the
                              generic-device-plugin resource `devic.es/dri-render` (unless
                              ResourceName overrides it). The plugin injects /dev/dri; the non-root
                              container still needs the host render group, supplied via
                              InferenceService.spec.podSecurityContext.supplementalGroups.
                            - "rocm": the HIP compute tier (#701). Schedules LLMKube's
                              hardware-validated ROCm llama.cpp image and requests the same
                              shared `devic.es/dri-render` resource as "vulkan" (unless
                              ResourceName overrides it): the two runtimes contend for the same
                              physical device on single-GPU AMD nodes, so they share one
                              device-plugin resource rather than each claiming their own. "rocm"
                              differs from "vulkan" only in the container image it selects.
                            - "" (empty): falls through to `amd.com/gpu` with the vendor-neutral
                              stock image, back-compatible with pre-#701 behavior, not the same
                              as "rocm".

                          Ignored for non-AMD vendors and non-llama.cpp backends.
                        enum:
                        - vulkan
                        - rocm
                        type: string
                      sharding:
                        description: |-
                          Sharding defines how to shard the model across multiple GPUs
                          Only applicable when Count > 1
                        properties:
                          layerSplit:
                            description: |-
                              LayerSplit defines custom layer splits per GPU
                              Example: [0-15, 16-31] for 2-GPU split of 32-layer model
                              If empty, auto-calculate even split
                            items:
                              type: string
                            type: array
                          strategy:
                            default: layer
                            description: |-
                              Strategy defines the sharding approach for multi-GPU model execution.
                              - "layer" (default): shard by transformer layers. llama.cpp --split-mode layer.
                              - "tensor" (alias: "row"): true tensor parallelism. llama.cpp --split-mode row.
                                Splits each tensor operation across GPUs rather than assigning whole layers
                                to each. Performance varies by workload; typically better on compute-bound ops.
                              - "none": disable multi-GPU sharding (single GPU). llama.cpp --split-mode none.
                              - "pipeline": accepted for forward compatibility but currently falls back to
                                "layer" with a reconciler warning; llama.cpp has no pipeline split-mode.
                            enum:
                            - layer
                            - tensor
                            - row
                            - pipeline
                            - none
                            type: string
                        type: object
                      tolerationKey:
                        description: |-
                          TolerationKey overrides the taint key the operator tolerates when
                          scheduling GPU pods. Defaults to ResourceName (or the vendor default
                          resource name when ResourceName is unset), so in most cases this can
                          be left empty.
                        pattern: ^[a-z0-9.\-]+/[a-z0-9._\-]+$
                        type: string
                      vendor:
                        default: nvidia
                        description: |-
                          Vendor specifies GPU vendor preference (nvidia, amd, intel)
                          Future-proof for multi-vendor support
                        enum:
                        - nvidia
                        - amd
                        - intel
                        type: string
                    type: object
                    x-kubernetes-validations:
                    - message: 'resourceClaims and resourceName are mutually exclusive:
                        use one or the other for GPU scheduling'
                      rule: '!(has(self.resourceName) && has(self.resourceClaims)
                        && self.resourceClaims.size() > 0)'
                  memoryBudget:
                    description: |-
                      MemoryBudget is an absolute memory limit for the model process
                      (e.g., "24Gi", "8192Mi"). When set, it takes precedence over
                      MemoryFraction and the agent-level --memory-fraction flag.
                      Parsed via resource.ParseQuantity().
                    type: string
                  memoryFraction:
                    description: |-
                      MemoryFraction is the fraction of total system memory to budget for
                      this model's inference process (0.0–1.0). Takes precedence over the
                      agent-level --memory-fraction flag but not MemoryBudget.
                    type: number
                type: object
              mmproj:
                description: |-
                  Mmproj is an optional multimodal projector file to stage from Source and
                  pass to runtimes that support projector arguments.
                type: string
              modelCache:
                description: |-
                  ModelCache names the cache claim this Model is staged into, with the
                  same fields an InferenceService's spec.modelCache carries.

                  When claimName is set it is the prefetch target: the Job writes there
                  and never falls back to the shared cache, whatever services exist. It
                  is also the default for referencing InferenceServices: a service with
                  no modelCache block of its own inherits the claim, so it is declared
                  once in a GitOps-applied pair; a service that sets its own block still
                  wins. modelCache.prefetch is an alias of spec.prefetch and, like it,
                  holds no service: a service that waits for the staging sets
                  modelCache.prefetch itself.

                  Without it, the prefetch target is inferred from the referencing
                  services as before. persistence Ephemeral cannot be combined with
                  prefetch: there is no cache volume to stage into.
                properties:
                  claimName:
                    description: |-
                      ClaimName names a pre-existing PersistentVolumeClaim in the
                      InferenceService's namespace to use as the writable model cache volume.
                      Weights land under the usual <cacheKey>/ subdirectory of the claim, so
                      RefreshPolicy and cache-key semantics are unchanged and multiple models
                      can share one claim without colliding. The claim must already exist:
                      when it is missing the InferenceService is marked Degraded rather than
                      silently falling back to the shared cache. Ignored for pvc:// model
                      sources (already staged, read-only, no download). Node alignment of
                      RWO/local claims (via nodeSelector) is the user's responsibility.
                    maxLength: 253
                    minLength: 1
                    type: string
                  persistence:
                    description: |-
                      Persistence selects whether weights survive a Pod restart.

                      Cached (the default) downloads into the model cache PVC, so a restart
                      reuses the bytes already on the node. Ephemeral declines the cache
                      entirely: weights land in an emptyDir and are re-downloaded every time
                      the Pod starts. No cache PVC is created, mounted, or required.

                      Ephemeral is for two situations.

                      A model origin fast enough that the cache does not earn its keep. Pulling
                      from an in-cluster or on-LAN object store can be quick enough that a
                      per-service volume on every GPU node costs more than the occasional
                      re-download, particularly since perService caches are node-local and are
                      never shared between services.

                      Clusters where a cache PVC is impractical for this workload: no suitable
                      StorageClass for the nodes it must run on, or a local-volume provisioner
                      that creates volumes through a helper Pod pinned to the target node and
                      so cannot serve a node whose taints that helper does not tolerate. That
                      last case can fail silently, leaving the Pod waiting on a volume that
                      will never bind. It does not arise on provisioners that create volumes
                      through a control-plane API call rather than an on-node Pod, which is how
                      most managed-cloud CSI drivers work.

                      Two costs, both paid later than the decision. The first request after ANY
                      restart waits for a full re-download, and with more than one replica every
                      replica downloads its own copy. Prefer Cached unless one of the situations
                      above applies.

                      Pair this with resources.ephemeralStorage. Weights land on node local
                      disk, and without a declared budget the scheduler cannot account for the
                      download and the kubelet has no per-pod ceiling to enforce; the operator
                      emits an UnboundedEphemeralCache warning when it is unset.

                      Mutually exclusive with claimName, which names a cache volume to use.
                    enum:
                    - Cached
                    - Ephemeral
                    type: string
                  prefetch:
                    description: |-
                      Prefetch asks for the Model's weights to be staged into this cache claim
                      by a prefetch Job before any serving pod consumes them.

                      On an InferenceService, the operator runs the referenced Model's
                      prefetch Job against this service's resolved cache claim (claimName,
                      else the Model's spec.modelCache.claimName, else the operator cache),
                      placed by the Model's prefetchNodeSelector, prefetchTolerations and
                      prefetchAffinity, whether or not the Model sets spec.prefetch. The
                      service creates no pods, and rolls no new pod template, until that
                      prefetch has succeeded for the Model's current spec; meanwhile it
                      reports ModelPrefetched=False with reason WaitingForPrefetch (or
                      PrefetchFailed, with the live workload left as it was). Once staged, the
                      serving pods mount the claim read-only with no downloader init
                      container, and fail with PrefetchedFilesMissing rather than download on
                      the serving node if a staged file is absent. Progress is reported per
                      claim in the Model's status.prefetch.

                      On a Model, it is equivalent to spec.prefetch: either field makes the
                      Model stage itself into its own modelCache.claimName.

                      Cannot be set with persistence Ephemeral: an emptyDir cannot be
                      prefetched. Reported as PrefetchNotApplicable, and not waited for, only
                      where nothing downloads at serve time: Metal (no cache claim is
                      mounted) and pre-staged sources (pvc://, oci://, local paths). A
                      request the pods could not consume is refused and held as
                      PrefetchUnsupported: model caching disabled on the operator, a runtime
                      the operator does not stage, a spec.speculativeDecoding.draftModelRef or a
                      spec.vllmConfig.speculative.model, a multiNode member with its own
                      modelCache.claimName, or a source the downloader does not stage ahead
                      of time (s3://).
                    type: boolean
                  storageClassName:
                    description: |-
                      StorageClassName overrides the operator's --model-cache-storage-class
                      flag for the model-cache PVC this operator creates for the service
                      (#1963). A mixed cluster can then cache on local disk where a
                      cloud-default class cannot attach, without hand-managing a claimName
                      PVC per service.

                      In perService mode the field is authoritative: the per-service claim is
                      created with this class. In shared mode the namespace has one claim
                      that every service shares, so the field is honored only at first
                      creation (first writer wins); a service whose request differs from the
                      existing claim's class gets a ModelCacheStorageClassIgnored warning and
                      uses the claim as created, because storageClassName is immutable once
                      bound. An empty value falls back to the flag; with neither set, the
                      cluster default applies. Existing PVCs are never mutated.

                      Mutually exclusive with claimName (the claim is user-owned) and with
                      persistence Ephemeral (no PVC exists to class).
                    maxLength: 63
                    minLength: 1
                    type: string
                type: object
                x-kubernetes-validations:
                - message: 'claimName cannot be set when persistence is Ephemeral:
                    one names a cache volume to use, the other declines to use any'
                  rule: '!(has(self.persistence) && self.persistence == ''Ephemeral''
                    && has(self.claimName))'
                - message: 'storageClassName cannot be set together with claimName:
                    the named claim is user-owned and its storage class was chosen
                    when the claim itself was created'
                  rule: '!(has(self.storageClassName) && has(self.claimName))'
                - message: 'storageClassName cannot be set when persistence is Ephemeral:
                    the weights land in an emptyDir and no PVC is created to class'
                  rule: '!(has(self.persistence) && self.persistence == ''Ephemeral''
                    && has(self.storageClassName))'
                - message: 'prefetch cannot be set when persistence is Ephemeral:
                    there is no cache volume to stage into'
                  rule: '!(has(self.persistence) && self.persistence == ''Ephemeral''
                    && has(self.prefetch) && self.prefetch)'
              prefetch:
                description: |-
                  Prefetch, when true on a remote (http/https/hf) source, makes the
                  operator download the artifact into a model cache PVC ahead of any
                  InferenceService, via an owner-ref'd Job that reuses the serving
                  init-container download stack. The Model reads Downloading until the
                  Job completes and Ready after it, so a referencing service starts from
                  a cache hit. A glob in spec.files is expanded from the repository
                  listing before the Job is built, as the serving path expands it.

                  The Job stages into spec.modelCache.claimName when set. Otherwise the
                  target is inferred: the single modelCache.claimName the referencing
                  InferenceServices agree on, else the namespace's shared cache
                  (llmkube-model-cache). Where every prefetch landed is recorded per
                  claim in status.prefetch; a referencing service that mounts a claim the
                  Model was not staged into is reported by the PrefetchTargetMismatch
                  condition, since it downloads at serve time. A service can instead ask
                  for its own staging with modelCache.prefetch, which also holds its
                  rollout until the weights are in place.

                  A source the downloader does not stage (local paths, pvc://, oci://,
                  s3://) is reported by the PrefetchSkipped condition rather than
                  prefetched.
                type: boolean
              prefetchAffinity:
                description: |-
                  PrefetchAffinity is applied to the prefetch Job's pod alongside
                  PrefetchNodeSelector and PrefetchTolerations, and governs nothing else.
                  It expresses what a selector cannot: keep the download off the GPU
                  nodes (a NotIn or DoesNotExist node affinity), a list of allowed hosts,
                  or a preference rather than a requirement.
                properties:
                  nodeAffinity:
                    description: Describes node affinity scheduling rules for the
                      pod.
                    properties:
                      preferredDuringSchedulingIgnoredDuringExecution:
                        description: |-
                          The scheduler will prefer to schedule pods to nodes that satisfy
                          the affinity expressions specified by this field, but it may choose
                          a node that violates one or more of the expressions. The node that is
                          most preferred is the one with the greatest sum of weights, i.e.
                          for each node that meets all of the scheduling requirements (resource
                          request, requiredDuringScheduling affinity expressions, etc.),
                          compute a sum by iterating through the elements of this field and adding
                          "weight" to the sum if the node matches the corresponding matchExpressions; the
                          node(s) with the highest sum are the most preferred.
                        items:
                          description: |-
                            An empty preferred scheduling term matches all objects with implicit weight 0
                            (i.e. it's a no-op). A null preferred scheduling term matches no objects (i.e. is also a no-op).
                          properties:
                            preference:
                              description: A node selector term, associated with the
                                corresponding weight.
                              properties:
                                matchExpressions:
                                  description: A list of node selector requirements
                                    by node's labels.
                                  items:
                                    description: |-
                                      A node selector requirement is a selector that contains values, a key, and an operator
                                      that relates the key and values.
                                    properties:
                                      key:
                                        description: The label key that the selector
                                          applies to.
                                        type: string
                                      operator:
                                        description: |-
                                          Represents a key's relationship to a set of values.
                                          Valid operators are In, NotIn, Exists, DoesNotExist. Gt, and Lt.
                                        type: string
                                      values:
                                        description: |-
                                          An array of string values. If the operator is In or NotIn,
                                          the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                          the values array must be empty. If the operator is Gt or Lt, the values
                                          array must have a single element, which will be interpreted as an integer.
                                          This array is replaced during a strategic merge patch.
                                        items:
                                          type: string
                                        type: array
                                        x-kubernetes-list-type: atomic
                                    required:
                                    - key
                                    - operator
                                    type: object
                                  type: array
                                  x-kubernetes-list-type: atomic
                                matchFields:
                                  description: A list of node selector requirements
                                    by node's fields.
                                  items:
                                    description: |-
                                      A node selector requirement is a selector that contains values, a key, and an operator
                                      that relates the key and values.
                                    properties:
                                      key:
                                        description: The label key that the selector
                                          applies to.
                                        type: string
                                      operator:
                                        description: |-
                                          Represents a key's relationship to a set of values.
                                          Valid operators are In, NotIn, Exists, DoesNotExist. Gt, and Lt.
                                        type: string
                                      values:
                                        description: |-
                                          An array of string values. If the operator is In or NotIn,
                                          the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                          the values array must be empty. If the operator is Gt or Lt, the values
                                          array must have a single element, which will be interpreted as an integer.
                                          This array is replaced during a strategic merge patch.
                                        items:
                                          type: string
                                        type: array
                                        x-kubernetes-list-type: atomic
                                    required:
                                    - key
