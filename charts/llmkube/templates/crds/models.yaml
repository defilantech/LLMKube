                        spec change that alters it starts a new prefetch into the same claim.
                      type: string
                    jobName:
                      description: |-
                        JobName is the prefetch Job driving this entry. The Job is removed a
                        day after it finishes; the entry outlives it.
                      type: string
                    lastTransitionTime:
                      description: LastTransitionTime is when Phase last changed.
                      format: date-time
                      type: string
                    message:
                      description: Message explains a Pending or Failed phase.
                      type: string
                    observedGeneration:
                      description: |-
                        ObservedGeneration is the Model generation the entry was last
                        confirmed against. A consumer treats an entry whose generation trails
                        the Model's as not yet current.
                      format: int64
                      type: integer
                    own:
                      description: |-
                        Own marks the Model's own prefetch target (spec.prefetch), the entry
                        that gates the Model's Ready. Entries an InferenceService requested
                        leave it unset.
                      type: boolean
                    phase:
                      description: Phase is Pending, Running, Succeeded or Failed.
                      enum:
                      - Pending
                      - Running
                      - Succeeded
                      - Failed
                      type: string
                  required:
                  - claimName
                  - phase
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - claimName
                x-kubernetes-list-type: map
              sha256:
                description: |-
                  SHA256 is the computed SHA256 hash of the model file.
                  Populated after download/copy for integrity tracking.
                type: string
              size:
                description: |-
                  Size is a human-readable byte count such as "190.4 GiB": the downloaded
                  file, the cache entry, the probed remote GGUF, or the total of the staged
                  files when spec.files expands against a repository listing. Empty when the
                  controller could not measure the source.
                type: string
              sourceContentLength:
                description: |-
                  SourceContentLength is the upstream size recorded at the last revalidation.
                  For http/https sources it is the Content-Length reported by a HEAD request;
                  for local sources it is the file size on disk. Used together with
                  SourceETag (or mtime for local sources) to detect upstream changes.
                format: int64
                type: integer
              sourceETag:
                description: |-
                  SourceETag is the HTTP ETag recorded for the upstream source at the last
                  revalidation. Used to detect upstream changes for http/https sources
                  (HuggingFace serves the blob SHA as the ETag, so a moved branch is caught).
                type: string
              stagedFiles:
                description: |-
                  StagedFiles lists the repo-relative paths staged in the model cache.
                  Populated when spec.files or spec.mmproj are set.
                items:
                  type: string
                type: array
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
