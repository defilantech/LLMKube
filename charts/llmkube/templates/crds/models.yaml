              rule: '!(has(self.prefetch) && self.prefetch && has(self.modelCache)
                && has(self.modelCache.persistence) && self.modelCache.persistence
                == ''Ephemeral'')'
          status:
            description: status defines the observed state of Model
            properties:
              acceleratorReady:
                description: AcceleratorReady indicates if hardware acceleration is
                  configured and ready
                type: boolean
              cacheKey:
                description: |-
                  CacheKey is the SHA256 hash prefix of the source URL used for cache storage
                  Models with the same source URL share the same cache entry
                type: string
              conditions:
                description: |-
                  conditions represent the current state of the Model resource.
                  Each condition has a unique type and reflects the status of a specific aspect of the resource.

                  Standard condition types include:
                  - "Available": the model is downloaded and ready for use
                  - "Progressing": the model is being downloaded or processed
                  - "Degraded": the model download or setup failed
                  - "SourceDrifted": the upstream source bytes differ from the cached copy

                  The status of each condition is one of True, False, or Unknown.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              gguf:
                description: GGUF contains metadata extracted from the GGUF file header
                properties:
                  architecture:
                    description: Architecture is the model architecture (e.g., "llama",
                      "mistral", "phi")
                    type: string
                  contextLength:
                    description: ContextLength is the maximum context length (tokens)
                    format: int64
                    type: integer
                  embeddingSize:
                    description: EmbeddingSize is the embedding dimension size
                    format: int64
                    type: integer
                  fileVersion:
                    description: FileVersion is the GGUF file format version
                    format: int32
                    type: integer
                  headCount:
                    description: HeadCount is the number of attention heads
                    format: int64
                    type: integer
                  headCountKV:
                    description: |-
                      HeadCountKV is the number of key/value attention heads (grouped-query
                      attention). 0 means the GGUF did not provide a usable scalar value
                      (absent, array-valued, or written by an older controller); consumers
                      must treat 0 as unknown and fall back to the embedding-width estimate.
                    format: int64
                    type: integer
                  keyLength:
                    description: |-
                      KeyLength is the per-head key dimension from the GGUF attention metadata.
                      0 means the GGUF did not provide a usable scalar value; consumers treat
                      it as unknown and derive it when needed.
                    format: int64
                    type: integer
                  layerCount:
                    description: LayerCount is the number of transformer layers/blocks
                    format: int64
                    type: integer
                  license:
                    description: License is the license identifier extracted from
                      the GGUF file metadata
                    type: string
                  modelName:
                    description: ModelName is the model name as stored in the GGUF
                      file
                    type: string
                  quantization:
                    description: Quantization is the quantization type (e.g., "Q4_K_M",
                      "Q5_K_M")
                    type: string
                  tensorCount:
                    description: TensorCount is the number of tensors in the model
                    format: int64
                    type: integer
                  valueLength:
                    description: |-
                      ValueLength is the per-head value dimension from the GGUF attention metadata.
                      0 means the GGUF did not provide a usable scalar value; consumers treat
                      it as unknown and derive it when needed.
                    format: int64
                    type: integer
                type: object
              lastRevalidated:
                description: |-
                  LastRevalidated is the timestamp of the last upstream revalidation check.
                  Revalidation is cadence-gated so the controller does not issue a HEAD on
                  every reconcile.
                format: date-time
                type: string
              lastUpdated:
                description: LastUpdated is the timestamp of the last status update
                format: date-time
                type: string
              path:
                description: Path represents the local path where the model is stored
                type: string
              phase:
                description: |-
                  Phase represents the current lifecycle phase of the model.
                  Possible values: Pending, Downloading, Copying, Ready, Failed.
                enum:
                - Pending
                - Downloading
                - Copying
                - Ready
                - Failed
                type: string
              prefetch:
                description: |-
                  Prefetch reports every cache claim this Model has been, or is being,
                  prefetched into: one entry per claim, whether the Model asked for it
                  (spec.prefetch) or a referencing InferenceService did
                  (modelCache.prefetch). A service waits on the entry for its own claim.
                items:
                  description: |-
                    PrefetchStatus is the state of one prefetch target: a Model staged into one
                    cache claim.
                  properties:
                    cacheKey:
                      description: CacheKey is the cache directory under the claim
                        the files land in.
                      type: string
                    claimName:
                      description: ClaimName is the PersistentVolumeClaim the Job
                        stages into.
                      minLength: 1
                      type: string
                    files:
                      description: |-
                        Files are the cache-relative names the Job staged under cacheKey, in
                        staging order with the primary file first. A pod that consumes the
                        prefetched claim verifies and serves exactly these, so a later change
