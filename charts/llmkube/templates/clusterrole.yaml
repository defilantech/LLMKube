{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "llmkube.fullname" . }}-manager-role
  labels:
    {{- include "llmkube.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - serviceaccounts
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - namespaces
  - nodes
  - pods
  - secrets
  verbs:
  - get
  - list
  - watch
# Multi-node serving groups own their member pods directly (#1423); the
# other core resources above stay read-only.
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - create
  - delete
- apiGroups:
  - discovery.k8s.io
  resources:
  - endpointslices
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - federation.llmkube.dev
  resources:
  - federatedclusters
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - federation.llmkube.dev
  resources:
  - federatedclusters/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - ""
  resources:
  - persistentvolumeclaims
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
# Read-only, and only to tell a volume the provisioner never stamped from one
# that is legitimately pinned elsewhere: both produce the same scheduler
# wording, and the operator should not assert a cause it has not established.
- apiGroups:
  - ""
  resources:
  - persistentvolumes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - pods/eviction
  verbs:
  - create
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - autoscaling
  resources:
  - horizontalpodautoscalers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
# The ModelRouter controller creates a Role for each pooled router's proxy that
# grants coordination.k8s.io leases. RBAC escalation prevention requires the
# operator to hold those verbs itself, so they are granted cluster-wide here
# and not only by the leader-election Role in one namespace.
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
- apiGroups:
  - scheduling.k8s.io
  resources:
  - priorityclasses
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - inference.llmkube.dev
  resources:
  - gpuquotas
  - inferenceservices
  - loraadapters
  - modelpools
  - modelrouters
  - models
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - inference.llmkube.dev
  resources:
  - inferenceservices/finalizers
  - loraadapters/finalizers
  - modelpools/finalizers
  - modelrouters/finalizers
  - models/finalizers
  verbs:
  - update
- apiGroups:
  - inference.llmkube.dev
  resources:
  - gpuquotas/status
  - inferenceservices/status
  - loraadapters/status
  - modelpools/status
  - modelrouters/status
  - models/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - gateway.envoyproxy.io
  resources:
  - backends
  - backendtrafficpolicies
  - securitypolicies
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - aigateway.envoyproxy.io
  resources:
  - aigatewayroutes
  - aiservicebackends
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - inference.networking.k8s.io
  resources:
  - inferencemodels
  - inferencepools
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - grafana.integreatly.org
  resources:
  - grafanadashboards
  verbs:
  - create
  - delete
  - get
  - update
- apiGroups:
  - pyrra.dev
  resources:
  - servicelevelobjectives
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - rolebindings
  - roles
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - resource.k8s.io
  resources:
  - resourceclaims
  - resourceclaimtemplates
  verbs:
  - get
  - list
  - watch
# Model prefetch (#904) creates and polls a batch Job per prefetching Model.
# Without this the controller-runtime cache cannot start its Job informer, the
# reflector retries the cluster-scoped list forever, and prefetch is dead with
# only a "Failed to watch" line to show for it (#1593).
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - create
  - delete
  - get
  - list
  - watch
# Read by the offload log reader (clientsetPodLogReader in cmd/main.go), which
# parses a ready pod's serving log to populate status.acceleration.
- apiGroups:
  - ""
  resources:
  - pods/log
  verbs:
  - get
{{- end }}
