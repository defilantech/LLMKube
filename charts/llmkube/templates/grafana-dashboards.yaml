{{- if .Values.grafana.dashboards.enabled }}
{{- /* Globbed once: the ConfigMap keys and the CRs' configMapRef keys are the
       same file list by construction. */}}
{{- $dashboards := .Files.Glob "dashboards/*.json" }}
{{- with .Values.grafana.dashboards.only }}
{{- /* Checked per name, not on the combined glob: `{a,typo}` still matches `a`,
       so a whole-set check would ship less than asked without saying so. */}}
{{- range . }}
{{- if not ($.Files.Glob (printf "dashboards/%s.json" .)) }}
{{- fail (printf "grafana.dashboards.only names %q, which matches no dashboard in dashboards/" .) }}
{{- end }}
{{- end }}
{{- $dashboards = $.Files.Glob (printf "dashboards/{%s}.json" (join "," .)) }}
{{- end }}
{{- /* Dashboards whose panels read one runtime's metrics only, so they render
       blank until something serves that runtime. The chart cannot tell: it is
       an InferenceService fact that does not exist at install time. In auto
       mode these are deferred to the operator instead of published here. */}}
{{- $runtimeDashboards := dict "sglang-dashboard.json" "sglang" "vllm-dashboard.json" "vllm" }}
{{- $defer := and .Values.grafana.dashboards.operator.enabled (eq .Values.grafana.dashboards.operator.mode "auto") }}
{{- $fullname := include "llmkube.fullname" . }}
{{- $configMapName := printf "%s-dashboards" $fullname }}
{{- $namespace := default (include "llmkube.namespace" .) .Values.grafana.dashboards.namespace }}
{{- $labels := include "llmkube.labels" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $configMapName }}
  namespace: {{ $namespace }}
  labels:
    {{- $labels | nindent 4 }}
    {{- with .Values.grafana.dashboards.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.grafana.dashboards.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  {{- $dashboards.AsConfig | nindent 2 }}
{{- if .Values.grafana.dashboards.operator.enabled }}
{{- /* The deferred manifests travel whole, so every CR field stays owned by
       values.yaml: the operator decides only whether a dashboard exists. */}}
{{- $candidates := dict }}
{{- range $path, $_ := $dashboards }}
{{- $base := base $path }}
{{- $requiresRuntime := get $runtimeDashboards $base }}
{{- $deferred := and $defer $requiresRuntime }}
{{- $manifest := include "llmkube.grafanaDashboard" (dict "root" $ "base" $base "fullname" $fullname "namespace" $namespace "labels" $labels "configMapName" $configMapName "requiresRuntime" $requiresRuntime "deferred" $deferred) }}
{{- if $deferred }}
{{- $_ := set $candidates (printf "%s.yaml" (trimSuffix ".json" $base)) $manifest }}
{{- else }}
---
{{ $manifest }}
{{- end }}
{{- end }}
{{- if $candidates }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-dashboard-candidates
  namespace: {{ $namespace }}
  labels:
    {{- $labels | nindent 4 }}
data:
  {{- range $key, $manifest := $candidates }}
  {{ $key }}: |
    {{- $manifest | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}

{{/*
One GrafanaDashboard manifest. Rendered either as a document of its own or
into the candidates ConfigMap, so both paths agree by construction.
Deferred manifests carry a dashboards.llmkube.dev/managed-by label — a key of
our own rather than app.kubernetes.io/managed-by, which llmkube.labels already
sets to Helm and which would otherwise be emitted twice. The operator adopts
and retires only what carries it, never a hand-authored dashboard that happens
to share a name.
*/}}
{{- define "llmkube.grafanaDashboard" -}}
{{- $operator := .root.Values.grafana.dashboards.operator -}}
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: {{ printf "%s-%s" .fullname (trimSuffix ".json" .base) }}
  namespace: {{ .namespace }}
  labels:
    {{- .labels | nindent 4 }}
    {{- if .deferred }}
    dashboards.llmkube.dev/managed-by: llmkube
    {{- end }}
  {{- if .deferred }}
  annotations:
    dashboards.llmkube.dev/requires-runtime: {{ .requiresRuntime | quote }}
    {{- /* Helm refuses to adopt an object it did not create, so without these
           a later `mode: all` upgrade fails on whatever the operator has
           published and has to be untangled by hand. The operator applies
           these on the release's behalf, so claiming the release is honest,
           and it makes auto <-> all switch cleanly in both directions. Inert
           while in auto mode: Helm never sees an object outside its own
           manifest. */}}
    meta.helm.sh/release-name: {{ .root.Release.Name }}
    meta.helm.sh/release-namespace: {{ .root.Release.Namespace }}
  {{- end }}
spec:
  allowCrossNamespaceImport: {{ $operator.allowCrossNamespaceImport }}
  {{- with $operator.folder }}
  folder: {{ . | quote }}
  {{- end }}
  {{- with $operator.resyncPeriod }}
  resyncPeriod: {{ . | quote }}
  {{- end }}
  # Required by the CRD and immutable after creation.
  instanceSelector:
    {{- toYaml $operator.instanceSelector | nindent 4 }}
  {{- with $operator.datasources }}
  datasources:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  configMapRef:
    name: {{ .configMapName }}
    key: {{ .base }}
{{- end }}
