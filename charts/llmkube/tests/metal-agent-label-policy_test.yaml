suite: metal-agent label policy
# An object labeled llmkube.ai/managed-by=metal-agent is a macOS agent
# registration, so only a llmkube-metal-* ServiceAccount may write one
# (GHSA-863w-vh42-mjhj). Unlike the write policy, this one carries no identity
# match condition: that absence is what makes it apply to every writer. The CEL
# is pinned to deployment/macos/metal-agent-label-policy.yaml by
# make check-metal-agent-rbac and exercised against a real API server in
# pkg/agent/label_guard_repro_test.go.
templates:
  - metal-agent-label-policy.yaml

tests:
  - it: renders the policy and a Deny binding by default
    capabilities:
      apiVersions:
        - admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy
    release:
      name: rel
      namespace: llmkube-system
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: ValidatingAdmissionPolicy
        documentIndex: 0
      - equal:
          path: metadata.name
          value: rel-llmkube-metal-agent-labels
        documentIndex: 0
      - equal:
          path: spec.failurePolicy
          value: Fail
        documentIndex: 0
      - equal:
          path: spec.matchConditions[0].name
          value: not-llmkube-controller
        documentIndex: 0
      - equal:
          path: spec.matchConditions[0].expression
          value: request.userInfo.username != 'system:serviceaccount:llmkube-system:rel-llmkube-controller-manager'
        documentIndex: 0
      - equal:
          path: spec.matchConstraints.resourceRules
          value:
            - apiGroups: [""]
              apiVersions: ["v1"]
              operations: ["CREATE", "UPDATE"]
              resources: ["services", "endpoints"]
            - apiGroups: ["discovery.k8s.io"]
              apiVersions: ["v1"]
              operations: ["CREATE", "UPDATE"]
              resources: ["endpointslices"]
        documentIndex: 0
      - equal:
          path: spec.validations[0].reason
          value: Forbidden
        documentIndex: 0
      - isKind:
          of: ValidatingAdmissionPolicyBinding
        documentIndex: 1
      - equal:
          path: spec.policyName
          value: rel-llmkube-metal-agent-labels
        documentIndex: 1
      - equal:
          path: spec.validationActions
          value: [Deny]
        documentIndex: 1

  - it: renders nothing when labelGuard is disabled
    capabilities:
      apiVersions:
        - admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy
    set:
      metalAgent.writePolicy.labelGuard.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders nothing when the write policy is disabled
    capabilities:
      apiVersions:
        - admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy
    set:
      metalAgent.writePolicy.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders nothing on a cluster without ValidatingAdmissionPolicy
    asserts:
      - hasDocuments:
          count: 0
