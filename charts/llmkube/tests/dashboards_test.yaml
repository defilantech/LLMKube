suite: grafana dashboards ship from the chart, not by hand
# The ConfigMap is the single copy of the JSON; the sidecar label and the
# GrafanaDashboard CRs are independent opt-ins that point at it.
templates:
  - grafana-dashboards.yaml

tests:
  - it: should render nothing by default
    asserts:
      - hasDocuments:
          count: 0

  # --- ConfigMap: the one copy of the JSON ---

  - it: should render only the ConfigMap, labelled for the sidecar, when the operator is off
    set:
      grafana.dashboards.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: RELEASE-NAME-llmkube-dashboards
      - equal:
          path: metadata.labels.grafana_dashboard
          value: "true"
      - notExists:
          path: metadata.annotations

  - it: should annotate the ConfigMap when annotations are set
    set:
      grafana.dashboards.enabled: true
      grafana.dashboards.annotations:
        grafana_folder: LLMKube
        k8s-sidecar-target-directory: /tmp/dashboards
    asserts:
      - equal:
          path: metadata.annotations.grafana_folder
          value: LLMKube
      - equal:
          path: metadata.annotations["k8s-sidecar-target-directory"]
          value: /tmp/dashboards

  - it: should default the namespace to the release namespace and allow an override
    set:
      grafana.dashboards.enabled: true
    release:
      namespace: llmkube-system
    asserts:
      - equal:
          path: metadata.namespace
          value: llmkube-system

  - it: should place the ConfigMap in the configured namespace
    set:
      grafana.dashboards.enabled: true
      grafana.dashboards.namespace: monitoring
    asserts:
      - equal:
          path: metadata.namespace
          value: monitoring

  - it: should carry each dashboard file whole, one key per file
    set:
      grafana.dashboards.enabled: true
    asserts:
      # Anchored braces plus the dashboard's own uid: a broken glob yields an
      # empty ConfigMap, and a mangled copy loses the uid or the closing brace.
      - matchRegex:
          path: data["llmkube-slo.json"]
          pattern: '(?s)^\{.*"uid": "llmkube-slo".*\}\s*$'
      - matchRegex:
          path: data["amd-gpu-observability.json"]
          pattern: '(?s)^\{.*"uid": "llmkube-amd-gpu-monitor".*\}\s*$'
      - matchRegex:
          path: data["model-router-dashboard.json"]
          pattern: '(?s)^\{.*"uid": "llmkube-model-router".*\}\s*$'

  # --- GrafanaDashboard CRs: grafana-operator, same ConfigMap ---

  - it: should add a GrafanaDashboard per file alongside the ConfigMap
    set:
      grafana.dashboards.enabled: true
      grafana.dashboards.operator.enabled: true
      # Deferral is the default; this is the per-file shape without it.
      grafana.dashboards.operator.mode: all
    asserts:
      - hasDocuments:
          count: 9

  - it: should point each GrafanaDashboard at its own ConfigMap key
    set:
      grafana.dashboards.enabled: true
      grafana.dashboards.operator.enabled: true
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-llmkube-llmkube-slo
    asserts:
      - isKind:
          of: GrafanaDashboard
      - isAPIVersion:
          of: grafana.integreatly.org/v1beta1
      - equal:
          path: spec.configMapRef
          value:
            name: RELEASE-NAME-llmkube-dashboards
            key: llmkube-slo.json
      - notExists:
          path: spec.datasources

  - it: should set the CRD-required instanceSelector and cross-namespace import
    set:
      grafana.dashboards.enabled: true
      grafana.dashboards.operator.enabled: true
      grafana.dashboards.operator.allowCrossNamespaceImport: false
      grafana.dashboards.operator.instanceSelector:
        matchLabels:
          dashboards: grafana
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-llmkube-llmkube-slo
    asserts:
      - equal:
          path: spec.instanceSelector.matchLabels.dashboards
          value: grafana
      - equal:
          path: spec.allowCrossNamespaceImport
          value: false
      # Unset leaves the CRD's own defaults rather than pinning them here.
      - notExists:
          path: spec.folder
      - notExists:
          path: spec.resyncPeriod

  - it: should place the dashboards in a folder and resync on the configured period
    set:
      grafana.dashboards.enabled: true
      grafana.dashboards.operator.enabled: true
      grafana.dashboards.operator.folder: LLMKube
      grafana.dashboards.operator.resyncPeriod: 10m
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-llmkube-llmkube-slo
    asserts:
      - equal:
          path: spec.folder
          value: LLMKube
      - equal:
          path: spec.resyncPeriod
          value: 10m

  - it: should remap the dashboard datasource variable when configured
    set:
      grafana.dashboards.enabled: true
      grafana.dashboards.operator.enabled: true
      grafana.dashboards.operator.datasources:
        - inputName: DS_PROMETHEUS
          datasourceName: VictoriaMetrics
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-llmkube-llmkube-slo
    asserts:
      - contains:
          path: spec.datasources
          content:
            inputName: DS_PROMETHEUS
            datasourceName: VictoriaMetrics

  - it: should render no CRs when the operator is enabled but dashboards are off
    set:
      grafana.dashboards.enabled: false
      grafana.dashboards.operator.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: should ship only the named dashboards when narrowed
    set:
      grafana.dashboards.enabled: true
      grafana.dashboards.only:
        - llmkube-inference
        - vllm-dashboard
    asserts:
      - exists:
          path: data["llmkube-inference.json"]
      - exists:
          path: data["vllm-dashboard.json"]
      # The runtime this cluster does not run would render a blank dashboard.
      - notExists:
          path: data["sglang-dashboard.json"]
      - notExists:
          path: data["amd-gpu-observability.json"]

  - it: should render a CR per narrowed dashboard, not per file on disk
    set:
      grafana.dashboards.enabled: true
      grafana.dashboards.only:
        - llmkube-inference
      grafana.dashboards.operator.enabled: true
    asserts:
      - hasDocuments:
          count: 2

  - it: should fail rather than silently ship nothing on a typo
    set:
      grafana.dashboards.enabled: true
      grafana.dashboards.only:
        - llmkube-inferance
    asserts:
      - failedTemplate:
          errorPattern: matches no dashboard

  # A `{a,typo}` glob still matches `a`, so a whole-set check would pass here
  # and ship one dashboard instead of the two asked for.
  - it: should fail on a typo among names that do match
    set:
      grafana.dashboards.enabled: true
      grafana.dashboards.only:
        - llmkube-inference
        - llmkube-inferance
    asserts:
      - failedTemplate:
          errorPattern: 'llmkube-inferance.*matches no dashboard'

  # --- auto mode: the runtime dashboards are deferred to the operator ---

  - it: should defer the runtime dashboards and publish the rest itself
    set:
      grafana.dashboards.enabled: true
      grafana.dashboards.operator.enabled: true
    asserts:
      # 5 unconditional CRs + the dashboards ConfigMap + the candidates one.
      - hasDocuments:
          count: 7

  - it: should hand the deferred manifests to the operator, whole and labelled
    set:
      grafana.dashboards.enabled: true
      grafana.dashboards.operator.enabled: true
      grafana.dashboards.operator.folder: LLMKube
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-llmkube-dashboard-candidates
    asserts:
      - isKind:
          of: ConfigMap
      # managed-by scopes what the operator may retire; the annotation is the
      # runtime it waits for. Values-owned fields ride along untouched.
      - matchRegex:
          path: data["vllm-dashboard.yaml"]
          pattern: 'requires-runtime: "vllm"'
      - matchRegex:
          path: data["vllm-dashboard.yaml"]
          pattern: 'dashboards.llmkube.dev/managed-by: llmkube'
      - matchRegex:
          path: data["vllm-dashboard.yaml"]
          pattern: 'folder: "LLMKube"'
      - matchRegex:
          path: data["sglang-dashboard.yaml"]
          pattern: 'requires-runtime: "sglang"'
      - matchRegex:
          path: data["llamacpp-dashboard.yaml"]
          pattern: 'requires-runtime: "llamacpp"'
      # Without these Helm refuses to adopt what the operator published, and a
      # later mode: all upgrade fails on invalid ownership metadata instead of
      # taking the dashboards over.
      - matchRegex:
          path: data["vllm-dashboard.yaml"]
          pattern: 'meta.helm.sh/release-name: RELEASE-NAME'
      - matchRegex:
          path: data["vllm-dashboard.yaml"]
          pattern: 'meta.helm.sh/release-namespace: NAMESPACE'

  - it: should publish every dashboard directly in all mode
    set:
      grafana.dashboards.enabled: true
      grafana.dashboards.operator.enabled: true
      grafana.dashboards.operator.mode: all
    asserts:
      # 8 CRs + the dashboards ConfigMap, and no candidates ConfigMap.
      - hasDocuments:
          count: 9
      - notExists:
          path: data["vllm-dashboard.yaml"]
      - notExists:
          path: data["llamacpp-dashboard.yaml"]

  - it: should keep the sidecar path shipping every dashboard in auto mode
    set:
      grafana.dashboards.enabled: true
      grafana.dashboards.operator.enabled: true
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-llmkube-dashboards
    asserts:
      - exists:
          path: data["vllm-dashboard.json"]
      - exists:
          path: data["sglang-dashboard.json"]
      - exists:
          path: data["llamacpp-dashboard.json"]
