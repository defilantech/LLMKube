suite: prometheus rules match the chart's own scrape targets
# A rule whose matcher selects nothing installs clean and evaluates empty,
# which is indistinguishable from a healthy cluster (#1223). Rules are
# addressed by name, never by index.
templates:
  - prometheusrule.yaml
  - inference-podmonitor.yaml
  - servicemonitor.yaml

tests:
  # --- job label: pinned on the monitors, matched by the alerts ---

  - it: should pin the inference job label to what InferenceServiceDown matches
    template: inference-podmonitor.yaml
    set:
      prometheus.inferencePodMonitor.enabled: true
    asserts:
      - contains:
          path: spec.podMetricsEndpoints[0].relabelings
          content:
            targetLabel: job
            replacement: llmkube-inference

  - it: should pin the controller job label to what ControllerDown matches
    template: servicemonitor.yaml
    set:
      prometheus.serviceMonitor.enabled: true
    asserts:
      - contains:
          path: spec.endpoints[0].relabelings
          content:
            targetLabel: job
            replacement: llmkube-controller

  - it: should alert on the job names the monitors pin
    template: prometheusrule.yaml
    set:
      prometheus.prometheusRule.enabled: true
    asserts:
      - equal:
          path: spec.groups[?(@.name=="llmkube-inference")].rules[?(@.alert=="InferenceServiceDown")].expr
          value: up{job="llmkube-inference"} == 0
      - equal:
          path: spec.groups[?(@.name=="llmkube-inference")].rules[?(@.alert=="ControllerDown")].expr
          value: up{job="llmkube-controller"} == 0

  - it: should guard the controller job label with an absence alert
    template: prometheusrule.yaml
    set:
      prometheus.prometheusRule.enabled: true
      prometheus.serviceMonitor.enabled: true
    asserts:
      # up{} == 0 needs the series to exist; a stale job label removes it.
      - equal:
          path: spec.groups[?(@.name=="llmkube-inference")].rules[?(@.alert=="ControllerMetricsMissing")].expr
          value: absent(up{job="llmkube-controller"})
      - lengthEqual:
          path: spec.groups[?(@.name=="llmkube-inference")].rules
          count: 3

  - it: should omit the absence alert when the chart scrapes nothing
    template: prometheusrule.yaml
    set:
      prometheus.prometheusRule.enabled: true
      prometheus.serviceMonitor.enabled: false
    asserts:
      # No chart-owned target means nothing to be absent from; the alert
      # would fire forever.
      - lengthEqual:
          path: spec.groups[?(@.name=="llmkube-inference")].rules
          count: 2

  # --- restart rule: every backend container, keyed by a label KSM emits ---

  - it: should select every backend container, keyed by a label KSM carries
    template: prometheusrule.yaml
    set:
      prometheus.prometheusRule.enabled: true
    asserts:
      # Whole alternation, not substrings: a bare `vllm` also matches
      # `vllm-swift`. TestChartRestartRuleCoversEveryBackend owns the list.
      - matchRegex:
          path: spec.groups[?(@.name=="llmkube-inference-recording")].rules[?(@.record=="llmkube:inference:restarts:rate5m")].expr
          pattern: 'container=~"llama-server\|sglang\|vllm\|tgi\|personaplex\|inference-server"'
      # service and runtime exist only on the inference pods' own metrics.
      - matchRegex:
          path: spec.groups[?(@.name=="llmkube-inference-recording")].rules[?(@.record=="llmkube:inference:restarts:rate5m")].expr
          pattern: 'sum by \(namespace, pod, container\)'

  # --- recording rules: only histograms some runtime emits ---

  - it: should record only latency histograms a runtime publishes
    template: prometheusrule.yaml
    set:
      prometheus.prometheusRule.enabled: true
    asserts:
      # Five and no more: llama.cpp exposes no request-latency histogram,
      # so a rule over llamacpp:request_seconds_bucket is always empty.
      - lengthEqual:
          path: spec.groups[?(@.name=="llmkube-inference-recording")].rules
          count: 5
      - isNotNullOrEmpty:
          path: spec.groups[?(@.name=="llmkube-inference-recording")].rules[?(@.record=="llmkube:inference:request_latency:p95_5m")].expr
      - isNotNullOrEmpty:
          path: spec.groups[?(@.name=="llmkube-inference-recording")].rules[?(@.record=="llmkube:inference:restarts:rate5m")].expr
      - isNotNullOrEmpty:
          path: spec.groups[?(@.name=="llmkube-inference-recording")].rules[?(@.record=="llmkube:inference:ttft_seconds:p95_5m")].expr

  # --- GPU alerts: exporter-agnostic OR-fallback (#1356) ---
  # An AMD cluster has zero DCGM series and vice versa, so a single vendor's
  # metric family was a silent no-op for the others. Each rule now ORs the
  # normalized expression for every exporter this chart knows, so whichever
  # exporter a cluster runs is the one that evaluates.

  - it: should default to 4 GPU rules, with GPUMemoryPressure off
    template: prometheusrule.yaml
    set:
      prometheus.prometheusRule.enabled: true
    asserts:
      - lengthEqual:
          path: spec.groups[?(@.name=="llmkube-slo")].rules
          count: 4
      - notMatchRegex:
          path: spec.groups[?(@.name=="llmkube-slo")].rules[*].alert
          pattern: GPUMemoryPressure

  - it: should OR all three exporter families in GPUHighUtilization, edge-case-free precedence
    template: prometheusrule.yaml
    set:
      prometheus.prometheusRule.enabled: true
    asserts:
      - equal:
          path: spec.groups[?(@.name=="llmkube-slo")].rules[?(@.alert=="GPUHighUtilization")].expr
          value: (DCGM_FI_DEV_GPU_UTIL or amdgpu_gpu_busy_percent or drm_engine_utilization_ratio{engine="gpu"} * 100) > 90

  - it: should OR all three exporter families in GPUPowerLimit
    template: prometheusrule.yaml
    set:
      prometheus.prometheusRule.enabled: true
    asserts:
      - equal:
          path: spec.groups[?(@.name=="llmkube-slo")].rules[?(@.alert=="GPUPowerLimit")].expr
          value: (DCGM_FI_DEV_POWER_USAGE or node_hwmon_power_watt or drm_power_watts) > 250

  - it: should pin the temperature alert to the edge sensor on the drm branch
    template: prometheusrule.yaml
    set:
      prometheus.prometheusRule.enabled: true
    asserts:
      - matchRegex:
          path: spec.groups[?(@.name=="llmkube-slo")].rules[?(@.alert=="GPUHighTemperature")].expr
          pattern: 'drm_temperature_celsius\{sensor="edge"\}'
      - matchRegex:
          path: spec.groups[?(@.name=="llmkube-slo")].rules[?(@.alert=="GPUHighTemperature")].expr
          pattern: '^\(DCGM_FI_DEV_GPU_TEMP or node_hwmon_temp_celsius or drm_temperature_celsius\{sensor="edge"\}\) > 85$'

  - it: should enable GPUMemoryPressure opt-in, with pool=vram pinned on both sides
    template: prometheusrule.yaml
    set:
      prometheus.prometheusRule.enabled: true
      prometheus.prometheusRule.rules.gpu.memoryPressure.enabled: true
    asserts:
      - lengthEqual:
          path: spec.groups[?(@.name=="llmkube-slo")].rules
          count: 5
      - equal:
          path: spec.groups[?(@.name=="llmkube-slo")].rules[?(@.alert=="GPUMemoryPressure")].expr
          value: ((DCGM_FI_DEV_FB_USED / DCGM_FI_DEV_FB_TOTAL) * 100 or (amdgpu_vram_used_bytes / amdgpu_vram_total_bytes) * 100 or (drm_memory_used_bytes{pool="vram"} / drm_memory_total_bytes{pool="vram"}) * 100) > 90

  - it: should AND absence across all three utilization families in GPUMetricsMissing
    template: prometheusrule.yaml
    set:
      prometheus.prometheusRule.enabled: true
    asserts:
      - equal:
          path: spec.groups[?(@.name=="llmkube-slo")].rules[?(@.alert=="GPUMetricsMissing")].expr
          value: absent(DCGM_FI_DEV_GPU_UTIL) and absent(amdgpu_gpu_busy_percent) and absent(drm_engine_utilization_ratio{engine="gpu"})

  - it: should omit all GPU rules including the absence guard when the group is disabled
    template: prometheusrule.yaml
    set:
      prometheus.prometheusRule.enabled: true
      prometheus.prometheusRule.rules.gpu.enabled: false
    asserts:
      - notMatchRegex:
          path: spec.groups[*].name
          pattern: llmkube-slo
