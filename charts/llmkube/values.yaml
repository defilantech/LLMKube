# Default values for llmkube.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Namespace to deploy the controller
namespace: llmkube-system

# Controller manager configuration
controllerManager:
  # Controller image
  image:
    # Registry for the controller image. When set, prepended to repository.
    # Useful for air-gapped or enterprise proxy registries.
    # Example: "my-registry.company.com"
    registry: ""
    repository: ghcr.io/defilantech/llmkube-controller
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: ""
    # Image digest (sha256:...) - takes precedence over tag when set.
    # Use digests for production deployments to ensure immutable, verifiable images.
    # Example: sha256:abc123def456...
    digest: ""

  # Number of controller replicas (recommended: 1 for active/passive HA)
  replicaCount: 1

  # Old ReplicaSets kept on the controller Deployment. Helm upgrades otherwise
  # leave up to 10 scaled-to-zero ReplicaSets behind (Kubernetes default);
  # use `helm rollback` to roll back. 0 keeps none.
  revisionHistoryLimit: 3

  # Leader election configuration
  leaderElection:
    enabled: true

  # Watch-canary stall detection (#2069). The operator renews a Lease in its
  # own namespace every interval and requires its own informer to deliver the
  # write back; when a write goes unobserved for failAfter the liveness probe
  # fails and the kubelet restarts the pod. This catches the silent-stall
  # failure mode where the operator keeps serving probes and webhooks while
  # its controllers stop reconciling. Set interval to "0s" to disable.
  watchCanary:
    interval: "60s"
    failAfter: "5m"
    # Namespace for the canary Lease. Empty uses the chart's namespace.
    namespace: ""

  # Per-kind unreconciled-generation check (#2308). The canary above proves
  # the Lease informer delivers events, but informers are per resource type,
  # so the InferenceService or Model informer can die alone. Every interval
  # the leader lists both kinds through the API server (not its cache) and
  # exports how long each one's metadata.generation has run ahead of the
  # highest observedGeneration on its conditions. Alert only: it never
  # restarts the pod. Set interval to "0s" to disable.
  unreconciledGeneration:
    interval: "60s"
    # How long a spec change may go unreconciled before it counts, and the
    # threshold the LLMKubeUnreconciledGeneration alert fires on. Keep it
    # above reconcileTimeout (15m) so a reconcile that legitimately runs to
    # its deadline does not count.
    thresholdSeconds: 1200

  # Deadline for a single Model or InferenceService reconcile, so a call that
  # never returns cannot hold a controller worker forever (#2069). On expiry
  # the reconcile is cancelled and requeued with backoff. Set to "0s" to
  # disable.
  reconcileTimeout: "15m"

  # Resource limits and requests
  resources:
    limits:
      cpu: 500m
      memory: 2Gi
    requests:
      cpu: 10m
      memory: 512Mi

  # Security context for the controller pod
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  # Security context for the manager container
  securityContext:
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - "ALL"

  # Health probe configuration
  livenessProbe:
    httpGet:
      path: /healthz
      port: 8081
    initialDelaySeconds: 15
    periodSeconds: 20

  readinessProbe:
    httpGet:
      path: /readyz
      port: 8081
    initialDelaySeconds: 5
    periodSeconds: 10

  # Node affinity for multi-architecture support
  nodeSelector: {}

  tolerations: []

  affinity: {}

  # Container image used for the model downloader init container
  initContainer:
    registry: ""
    repository: docker.io/curlimages/curl
    tag: "8.18.0"
    # Default fsGroup applied to the rendered PodSecurityContext when the
    # InferenceService does not provide its own Spec.PodSecurityContext.
    # 102 matches curlimages/curl curl_group GID and lets the init container
    # write to a freshly-provisioned PVC on storage classes that initialize
    # volumes as root:root 0755 (e.g., Longhorn, OpenShift restricted-v2).
    #
    # Set to 0 on OpenShift, where the restricted-v2 SCC injects fsGroup
    # from the namespace's allocated range and rejects pods with explicit
    # values outside that range.
    defaultFSGroup: 102
    # Numeric uid the init image above runs as (--init-container-user). 101 is
    # curl_user in the default curlimages/curl image; set it to your image's
    # uid when you mirror a different one (`docker run --rm <image> id`). With
    # defaultFSGroup 0 and no InferenceService runAsUser, model-cache-prep
    # chowns the cache root to <user>:0 mode 770 so the downloader can write;
    # under modelCache.prep never it is the prefetch Job's runAsUser. Must be
    # a non-root uid (1-2147483647).
    user: 101

  # GID of your GPU nodes' DRI render group: the group that owns
  # /dev/dri/renderD128. It is added to a Vulkan InferenceService pod's
  # supplementalGroups so the serving container can open the render node.
  # fsGroup does nothing for device access, so without this llama.cpp cannot
  # open the render node, fails open, and serves from CPU at roughly half
  # speed with no status condition (#1560).
  #
  # Defaults to 0 (disabled) because there is no portable value. The `render`
  # group is allocated dynamically and differs per host: it is 991 on Ubuntu
  # 26.04, and elsewhere something else again. GID 44 is NOT the render group,
  # it is `video`, which owns card0 rather than the render node (#1572).
  #
  # Read the real value from one of your GPU nodes:
  #
  #   stat -c '%g' /dev/dri/renderD128
  #
  # Only applies on the Vulkan path, and never overrides a service that sets
  # its own spec.podSecurityContext. On a fleet whose nodes disagree, set this
  # to the majority value and override the outliers per service.
  driRenderGID: 0

  # Additional environment variables
  env: []

  # Name of a ConfigMap holding a CA bundle for model downloads from endpoints
  # signed by a private CA. Mounted into the model-downloader init container at
  # /custom-certs. The ConfigMap is read from each WORKLOAD's namespace (every
  # namespace with an InferenceService, or a Model with spec.prefetch), not the
  # operator's: copy it into each one (extraObjects can render the copies).
  # While it is missing there the operator creates no pod and reports
  # CACertConfigMapAvailable=False on the InferenceService or Model.
  caCertConfigMap: ""

  # Default container image for ModelRouter-managed router-proxy pods.
  # Per-ModelRouter spec.proxy.image overrides this for individual routers.
  # The router-proxy is a lightweight HTTP server that fronts
  # InferenceServices and external provider backends, speaks
  # OpenAI chat completions, and enforces policy routing.
  #
  # This same image also runs the per-InferenceService relay Deployment the
  # controller creates for Metal InferenceServices, once their Mac's
  # metal-agent publishes an authenticated ingress.
  #
  # The release pipeline publishes ghcr.io/defilantech/llmkube-router-proxy
  # alongside the controller image with matching version tags (#449), so the
  # empty tag below resolves to the chart appVersion.
  routerProxy:
    # Registry prefix for the router-proxy image (mirrors controller image).
    # Useful for air-gapped or enterprise proxy registries.
    registry: ""
    repository: ghcr.io/defilantech/llmkube-router-proxy
    pullPolicy: IfNotPresent
    # Image tag. Empty defaults to the chart appVersion, which matches the
    # tag the release pipeline publishes for this chart version.
    tag: ""
    # Image digest (sha256:...) - takes precedence over tag when set.
    digest: ""

    # Cluster-wide default URL for ModelRouter External backends whose
    # provider=litellm and url is unspecified. Lets platform teams
    # centralize the LiteLLM proxy endpoint so application teams can
    # declare `external: {provider: litellm, model: ...}` without
    # repeating the LiteLLM Service URL on every ModelRouter. Empty
    # means application teams must include url explicitly.
    #
    # Example (in-cluster LiteLLM at the standard port):
    #   defaultLiteLLMURL: "http://litellm.litellm.svc.cluster.local:4000"
    defaultLiteLLMURL: ""

# Service account configuration
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# RBAC configuration
rbac:
  # Specifies whether RBAC resources should be created
  create: true

# Metrics service configuration
metrics:
  # Enable metrics endpoint
  enabled: true
  # Add prometheus.io/scrape,path,port annotations (port = the fully-resolved
  # container port: spec.containerPort -> spec.endpoint.port -> the runtime's
  # default) to every inference Pod so annotation-based scrapers (e.g. Grafana
  # Alloy) discover the runtime's /metrics without a per-InferenceService
  # podAnnotations block or a PodMonitor. A user-set spec.podAnnotations value
  # always wins. The router-proxy Pods a ModelRouter creates get the same three
  # annotations, pointing at the proxy's metrics port (9090). Default off.
  #
  # This is an ALTERNATIVE to a PodMonitor/ServiceMonitor, not a companion: if
  # one already scrapes these pods, do NOT also enable this against the same
  # Prometheus, or every target is scraped twice (duplicated series and
  # samples). Pick one discovery mechanism per Prometheus. That covers
  # inferencePodMonitor for inference pods and routerPodMonitor for router-proxy
  # pods.
  emitScrapeAnnotations: false
  # Serve metrics over HTTPS with authn/authz (true) or plain HTTP (false).
  # Set to false when scraping from outside the cluster without a ServiceAccount token.
  secure: true
  # Service type for metrics
  service:
    type: ClusterIP
    port: 8443
    # NodePort to expose when service type is NodePort (optional, auto-assigned if empty)
    nodePort: ""
    annotations: {}

# Gateway-scoped audit access log (sub-slice 2c).
#
# Envoy Gateway configures access logging ONLY on the EnvoyProxy resource
# (telemetry.accessLog), gateway-infrastructure-scoped, not per route. The
# operator references an EXTERNAL Gateway via gatewayRef and does not own the
# EnvoyProxy, so the audit trail ships here as an opt-in, gateway-scoped artifact
# rather than a per-ModelRouter compiled resource. Default off, so existing
# installs are unaffected.
#
# Security posture (from the homelab spike):
#   - Header allowlist only: the Authorization header is NEVER logged.
#   - Request path and query string are omitted.
#   - Token fields (llm_input/output/total_token) are null on errors and
#     non-final frames; they are present only at end-of-stream on success.
#   - Request/response bodies are not loggable via access logs at all.
#
# The audit fields are produced by other slices already on the wire, so they
# populate automatically once those slices are active:
#   - team (x-team) from JWT auth (ModelRouter policy.auth.jwt),
#   - model (x-ai-eg-model) from the ext_proc,
#   - llm_*_token from the budget llmRequestCosts metadata.
gateway:
  auditLog:
    # Enable the gateway audit EnvoyProxy. Off by default.
    enabled: false
    # Name/namespace of the rendered EnvoyProxy. You MUST reference this
    # EnvoyProxy from your GatewayClass (spec.parametersRef) or Gateway
    # (spec.infrastructure.parametersRef): the chart cannot own external gateway
    # infra, so the access log only takes effect once you wire that parametersRef.
    envoyProxyName: llmkube-audit
    # Namespace for the EnvoyProxy (defaults to the release namespace).
    envoyProxyNamespace: ""
    # OpenTelemetry sink (the Loki/collector path). When disabled, only the
    # File/stdout JSON sink is emitted.
    otel:
      enabled: false
      # gRPC backend reference for the OTel collector.
      backendRef:
        name: otel-collector
        namespace: ""
        port: 4317
      # Resource attributes attached to every emitted log record.
      resourceAttributes:
        serviceName: llmkube-ai-gateway
        clusterName: llmkube

# Prometheus Operator integration
prometheus:
  # Enable Prometheus ServiceMonitor
  serviceMonitor:
    enabled: false
    # Additional labels for ServiceMonitor (e.g., for prometheus-operator selector)
    additionalLabels:
      prometheus: kube-prometheus-stack-prometheus
    # Scrape interval
    interval: 30s
    # Namespace for ServiceMonitor (defaults to release namespace)
    namespace: ""

  # Enable PodMonitor for inference pod metrics (llama.cpp /metrics)
  inferencePodMonitor:
    enabled: false
    # Additional labels for PodMonitor
    additionalLabels:
      prometheus: kube-prometheus-stack-prometheus
    # Scrape interval
    interval: 30s

  # Enable PodMonitor for router-proxy metrics (llmkube_router_* on the
  # --metrics-bind-address listener)
  routerPodMonitor:
    enabled: false
    # Additional labels for PodMonitor
    additionalLabels:
      prometheus: kube-prometheus-stack-prometheus
    # Scrape interval
    interval: 30s

  # Enable PrometheusRule for alerts
  prometheusRule:
    enabled: false
    # Additional labels for PrometheusRule
    additionalLabels:
      prometheus: kube-prometheus-stack-prometheus
      role: alert-rules
    # Namespace for PrometheusRule
    namespace: monitoring
    # Alert rules configuration
    rules:
      # GPU alerts
      gpu:
        enabled: true
        highUtilizationThreshold: 90
        highTemperatureThreshold: 85
        # Off by default: on an inference host VRAM utilization reports the
        # fraction the runtime was configured to reserve, not pressure. Enable
        # where VRAM is allocated on demand.
        memoryPressure:
          enabled: false
        memoryPressureThreshold: 90
        powerLimitThreshold: 250
      # GPU fault alerts (NVIDIA, DCGM exporter). The NVIDIA device plugin
      # ignores some Xids that NVIDIA's own catalog resolves with a GPU reset
      # (109 among them), so a faulted GPU can stay allocatable and keep
      # receiving pods. These alerts surface it. Three of the series they read
      # are not in the DCGM exporter's default counter list; see
      # docs/site/guides/gpu-fault-handling.md for the counters to enable. With
      # the defaults alone, the last-Xid and row-remap alerts still work.
      gpuHealth:
        enabled: true
        # Xids whose catalog resolution is RESET_GPU, RESTART_BM,
        # CONTACT_SUPPORT, XID_154, or a hardware workflow (ECC, NVLink).
        # Application Xids (RESTART_APP: 13, 31, 68, 69, 94) and IGNORE Xids
        # are left out. Source:
        # https://docs.nvidia.com/deploy/xid-errors/analyzing-xid-catalog.html
        criticalXids: [48, 61, 62, 64, 74, 79, 95, 109, 110, 119, 120, 122, 123, 124, 125, 136, 140, 143, 144, 145, 146, 147, 148, 149, 150, 154, 155, 156]
      # Inference service alerts
      inference:
        enabled: true
      # Serving-quality alerts: engine is up and Ready but not admitting work.
      # Also gated on prometheus.inferencePodMonitor.enabled: the rules group
      # by the service/runtime labels only that PodMonitor's relabelings add.
      serving:
        enabled: true
        # Mean queue wait; healthy single-GPU deployments sit in the low single digits
        queueTimeSecondsThreshold: 30
        # Requires a KV connector, off by default since OffloadingConnector is experimental
        kvOffload:
          enabled: false
          loadSecondsThreshold: 10
      # Watch-canary alerts (#2069): the operator's own watch pipeline has
      # stopped delivering events, so spec changes are silently ignored while
      # the pod looks healthy. Rendered only when
      # controllerManager.watchCanary.interval is not "0s": the alert reads the
      # canary's gauges, which only the canary updates.
      watchCanary:
        enabled: true
        # Fire when the last observed canary write is older than this. Should
        # sit above --watch-canary-fail-after (5m default) so the alert is a
        # backstop for a canary that keeps restarting rather than its only
        # signal.
        stalledSeconds: 900
        # Fire when the canary has never completed a full write-observe cycle
        # for this long: covers a canary that is disabled-by-misconfiguration
        # or stuck in a restart loop.
        downFor: 15m
      # Unreconciled-generation alert (#2308): an InferenceService or Model
      # spec change has gone unreconciled past
      # controllerManager.unreconciledGeneration.thresholdSeconds, the sign of
      # a single dead informer the watch canary cannot see. Rendered only when
      # controllerManager.unreconciledGeneration.interval is not "0s".
      unreconciledGeneration:
        enabled: true

# Grafana dashboards shipped in charts/llmkube/dashboards/. One ConfigMap holds
# every dashboard, one key per file; the sidecar label and the grafana-operator
# CRs are independent opt-ins on top of it.
grafana:
  dashboards:
    enabled: false
    # Dashboards to ship, by filename without .json. Empty ships all of them.
    # A dashboard for something the cluster does not run renders blank, which
    # is indistinguishable from an idle cluster, so narrow this to what you
    # deploy: sglang-dashboard and vllm-dashboard need an InferenceService on
    # that runtime, amd-gpu-observability needs AMD GPUs, llmkube-slo needs
    # pyrra.enabled.
    #
    # The queue-wait panels on sglang-dashboard and vllm-dashboard additionally
    # need prometheus.prometheusRule.enabled: they read the
    # llmkube:inference:queue_time_seconds:p95_5m recording rule rather than
    # deriving a quantile from raw buckets. That flag defaults false and is
    # independent of this one, so those two panels render blank on an install
    # that enables dashboards alone.
    only: []
    # Additional labels for the ConfigMap. grafana_dashboard is the key the
    # kube-prometheus-stack Grafana sidecar watches for.
    additionalLabels:
      grafana_dashboard: "true"
    # Namespace for the ConfigMap and the CRs (defaults to release namespace).
    # The sidecar only reads namespaces it is configured to search.
    namespace: ""
    # Annotations for the ConfigMap (e.g. grafana_folder for the sidecar)
    annotations: {}
    # Emit grafana-operator GrafanaDashboard CRs referencing the ConfigMap
    operator:
      enabled: false
      # auto: publish the runtime dashboards (SGLang, vLLM) only while an
      # InferenceService on that runtime exists, so none of them renders blank.
      # The chart hands those manifests to the operator instead of applying
      # them; the rest are applied here as always. all: apply every dashboard.
      mode: auto
      # Required by the CRD and immutable once set; {} matches every Grafana.
      instanceSelector: {}
      allowCrossNamespaceImport: true
      # Grafana folder for the dashboards. The sidecar path uses the
      # grafana_folder annotation above instead; this is the CR's own field.
      folder: ""
      # How often grafana-operator re-reads the ConfigMap. Empty leaves the
      # CRD default (5m).
      resyncPeriod: ""
      # Literal ${inputName} -> datasourceName replace over the dashboard JSON.
      # datasourceName must be the datasource UID, not its display name: the
      # placeholder sits inside the dashboards' "uid" fields, so a display name
      # lands verbatim as a uid that resolves to nothing and every panel
      # silently renders "datasource not found" (unless the UID happens to
      # equal the name).
      #   datasources:
      #     - inputName: DS_PROMETHEUS
      #       datasourceName: prometheus-uid
      datasources: []

# Pyrra SLO integration. When enabled, the operator renders a Pyrra
# ServiceLevelObjective for every InferenceService that declares spec.slo,
# and Pyrra generates the Prometheus recording/alert rules and error-budget
# math. Pyrra itself is NOT installed by this chart; install it alongside
# kube-prometheus-stack first: https://github.com/pyrra-dev/pyrra
# See docs/observability/slo.md.
pyrra:
  enabled: false

# Custom Resource Definitions
crds:
  # Install CRDs as part of chart installation
  install: true
  # Keep CRDs on chart uninstall (recommended for production)
  keep: true

# Model cache configuration
modelCache:
  # Enable the persistent model cache. When true the operator provisions a cache
  # PVC for each InferenceService (perService) or a single shared PVC (shared),
  # per `mode` below.
  enabled: true
  # Cache provisioning mode:
  #   shared (default): a "<release>-model-cache" PVC is created in the operator
  #     namespace (honoring accessMode below), unless existingClaim is set.
  #     The operator mounts it. InferenceServices use their namespace's shared
  #     cache (or spec.modelCache.claimName); existingClaim does not select those
  #     claims. Shared caches allow cross-isvc dedup and `llmkube cache list`
  #     can inspect them. On a multi-node cluster
  #     use an RWX storage class (NFS/EFS) so the cache is reachable from any
  #     node; the cluster default RWO class only works single-node.
  #   perService: each InferenceService gets its own RWO, WaitForFirstConsumer
  #     cache PVC ("<isvc>-model-cache") that binds on the node its serving pod
  #     schedules to. Use this as the opt-in escape hatch for multi-node clusters
  #     that do NOT have an RWX storage class: the cache co-locates with the
  #     workload instead of pinning to one node (#728). The tradeoff is no
  #     cross-isvc dedup (each InferenceService downloads its own copy).
  #     `llmkube cache list` discovers operator-managed per-service cache PVCs;
  #     user-managed `spec.modelCache.claimName` PVCs are outside that discovery
  #     contract.
  mode: shared
  # Storage size for each model cache PVC
  size: 100Gi
  # Storage class (leave empty for the cluster default). For shared on a
  # multi-node cluster use an RWX class; for perService the default class should
  # use volumeBindingMode WaitForFirstConsumer so the PVC binds on the serving
  # node. On a hard-tainted node, the storage provisioner's helper path must also
  # tolerate the taint; otherwise use a pre-provisioned claim.
  storageClass: ""
  # Pre-provisioned PVC in the operator namespace, mounted only in shared mode.
  # When set, the chart does not create or manage a shared cache PVC. This does
  # not select inference workload claims: use spec.modelCache.claimName on each
  # InferenceService for those (claims are scoped to the workload namespace).
  existingClaim: ""
  # Fail a live install/upgrade if shared caching needs the cluster default
  # StorageClass and none exists. Offline rendering skips the lookup check; an
  # already Bound chart-managed claim also skips it on upgrade. The Helm caller
  # needs StorageClass list permission. Set false for the first install of a
  # manually bound chart-managed claim (before it is Bound) or for restricted
  # callers, and verify binding yourself.
  requireDefaultStorageClass: true
  # Access mode for the shared cache PVC (only used when mode=shared):
  # ReadWriteOnce (single-node) or ReadWriteMany (multi-node with NFS/EFS).
  # perService caches are always ReadWriteOnce.
  accessMode: ReadWriteOnce
  # Whether to inject the root model-cache-prep init container into cache-backed
  # pods and prefetch Jobs:
  #   always (default): chown the cache root so the non-root downloader can
  #     write. Required on storage that does not apply the pod fsGroup (a CSI
  #     driver with fsGroupPolicy None, or an unset policy on an RWX volume).
  #     The prep runs as uid 0 and cannot pass Pod Security `restricted`.
  #   never: omit it. Only for storage that applies the pod fsGroup itself (a
  #     CSI driver with fsGroupPolicy File, see
  #     `kubectl get csidriver <name> -o jsonpath='{.spec.fsGroupPolicy}'`), or a
  #     cache pre-provisioned with the downloader's ownership. Owned by the
  #     operator, not the workload: a namespace that enforces `restricted`
  #     still needs each InferenceService to set spec.podSecurityContext with
  #     runAsNonRoot: true, a numeric runAsUser, and
  #     seccompProfile: RuntimeDefault (see docs/MODEL-CACHE.md, `PSA restricted`).
  prep: always
  # Logical model cache path inside inference pods (passed to the operator as
  # --model-cache-path; not an operator-pod mount).
  mountPath: /models
  # Annotations for the shared PVC (e.g., for backup policies)
  annotations: {}

# Socair model attestation policy. A Model references a Socair attestation (a
# DSSE envelope from `socair sign`) in spec.attestation; the controller verifies
# it against the trusted keys and checks its digest is spec.sha256.
#   mode: off (default) | warn (report on the AttestationVerified condition,
#         never block) | enforce (a Model without an admitted attestation is
#         Failed and never served)
#   trustedKeysConfigMap: namespace/name of a ConfigMap whose *.pub values are
#         the trusted Ed25519 public keys (PEM); required for warn and enforce
#   allowConditions: also admit authorized_with_conditions attestations
#   maxAge: refuse attestations issued longer ago, e.g. 2160h; empty disables
modelAttestation:
  mode: "off"
  trustedKeysConfigMap: ""
  allowConditions: false
  maxAge: ""

# Host-path allowlist for local (/abs and file://) and hostPath model sources.
# SECURITY (GHSA-jw3m-8q7m-f35r): empty list disables all such sources. To serve
# a model from node-local disk, list the absolute directory roots you trust, e.g.
#   allowedHostPathRoots:
#     - /srv/models
# Scope: this governs only the hostPath volume the operator generates for a
# Model's local spec.source. It does not inspect InferenceService
# spec.extraVolumes or security contexts, which reach the pod as written, so it
# is not a boundary against an InferenceService author. Enforce Pod Security
# Admission (baseline or restricted) on inference namespaces for that; note
# that baseline also refuses the hostPath a local source generates. See
# SECURITY.md, "Trust model".
modelSource:
  allowedHostPathRoots: []
  # Remote-host allowlist for the controller-side SSRF guard on http/https
  # model sources. SECURITY (GHSA-jw3m-8q7m-f35r): the controller's metadata
  # and revalidation requests refuse to connect to private, link-local,
  # loopback, or unspecified addresses. Public hosts are always allowed; list
  # hostnames and/or CIDRs here only to re-permit trusted internal hosts, e.g.
  #   allowedRemoteHosts:
  #     - models.corp.internal
  #     - 10.20.0.0/16
  allowedRemoteHosts: []

# Priority classes for GPU scheduling
priorityClasses:
  # Create LLMKube priority classes (critical, high, normal, low, batch)
  enabled: true

# Image pull secrets for private registries
imagePullSecrets: []

# Name override
nameOverride: ""
fullnameOverride: ""

# Pod annotations
podAnnotations: {}

# Pod labels
podLabels: {}

# Extra Kubernetes manifests to deploy with the chart. Each item is a map or a
# string, and is rendered through `tpl`, so it can use chart values. A string
# item is what a manifest needs to use template control flow.
extraObjects: []
#  - apiVersion: storage.k8s.io/v1
#    kind: StorageClass
#    metadata:
#      name: llmkube-model-cache
#    provisioner: file.csi.azure.com
#    parameters:
#      skuName: Premium_LRS
#    mountOptions: [mfsymlinks, actimeo=30, nosharesock, cache=loose]
#    reclaimPolicy: Delete
#    volumeBindingMode: Immediate

# Validating admission webhook for ModelRouter (#661). Promotes the gateway
# honest-boundary checks (unsupported match, unsupported budget, invalid auth,
# invalid authorization, unsupported auditLog, unsafe sensitive route) from a
# post-reconcile GatewayReady=False status to an apply-time rejection, so a
# misconfigured router fails loud at `kubectl apply` instead of applying cleanly
# and silently doing nothing.
webhook:
  # enabled toggles ALL webhook resources (cert Secret, Service,
  # ValidatingWebhookConfiguration) AND the operator's --webhook-cert-path flag
  # plus the cert mount. False renders none of them and starts the operator with
  # the webhook server off (cmd/main.go only registers the webhook when the
  # serving cert is present). Defaults true to match the foreman chart; the
  # chart self-generates a stable serving cert (no cert-manager dependency), so
  # an upgrade of an existing install starts serving the webhook without manual
  # cert setup.
  enabled: true

  # failurePolicy controls what happens when the webhook is unreachable.
  # "Fail" (default) rejects the apply, which is the safe choice for an operator
  # that should always be running. "Ignore" admits the CR unvalidated; use only
  # if a transient operator outage blocking applies is worse than admitting an
  # occasional invalid ModelRouter.
  #
  # Operational tradeoff with a SINGLE controller replica (the default): the
  # webhook server runs in the controller pod, so a rolling restart or upgrade
  # leaves a brief window where the old pod is gone and the new pod is not yet
  # Ready. During that window, with failurePolicy "Fail", every ModelRouter
  # CREATE/UPDATE clusterwide is rejected (the API server cannot reach any
  # webhook backend). If that window is unacceptable, either set failurePolicy
  # to "Ignore" (accept unvalidated CRs during the gap) or run 2+ controller
  # replicas so a Ready webhook backend always exists across a rollout.
  failurePolicy: Fail

  # port the controller's webhook server listens on. This single value drives
  # all three consistently: the operator's --webhook-port flag (the server's
  # actual bind port), the container port, and the Service targetPort. Safe to
  # change; 9443 is the controller-runtime default.
  port: 9443

  # certificate validity in days. The cert is reused across upgrades, so this is
  # effectively the rotation horizon (re-install or delete the serving Secret to
  # force regeneration before expiry).
  certValidityDays: 3650

  # certManager hands the webhook serving cert to cert-manager instead of the
  # chart's self-generated one (#1601). Required for ArgoCD: ArgoCD does not
  # support Helm lookups, so every re-render ran the lookup-reuse path and
  # regenerated the cert, and ArgoCD's server-side-apply dry-run against the API
  # server (webhook active) then failed the sync until the operator reloaded.
  # With this on, the chart renders a cert-manager Certificate that populates the
  # SAME Secret the deployment mounts (so the controller needs no change), and
  # the webhook configurations' CA bundle is injected via the
  # cert-manager.io/inject-ca-from annotation instead of a chart-generated
  # caBundle. The chart-generated cert Secret is NOT rendered in this mode.
  # Defaults false: the self-generated path (no cert-manager dependency) stays
  # the default. Requires cert-manager to be installed.
  certManager:
    # Hand the webhook serving cert to cert-manager instead of the chart's
    # self-generated one. Requires cert-manager to be installed; the chart
    # fails the render with an actionable message if cert-manager.io/v1 is
    # not present, rather than applying half the release and then hitting an
    # unknown-kind error.
    #
    # certValidityDays above applies in this mode too: it is rendered as the
    # Certificate's duration, with renewBefore at a third of it.
    #
    # INSTALL ORDER, worth knowing before you use an external issuer. The
    # controller mounts the serving Secret as a REQUIRED volume, because a
    # webhook with no cert cannot serve and the operator only registers the
    # webhook when the cert is present. cert-manager creates that Secret
    # asynchronously, AFTER this release applies, so on a first install the
    # controller pod sits in ContainerCreating until issuance completes.
    # With the chart's self-signed Issuer that is seconds. With a slow
    # external issuer (ACME, AWS PCA, Venafi, step) it can be minutes, and
    # `helm install --wait --atomic` will time out and roll back, deleting
    # the Certificate so the install can never converge. Either drop
    # --atomic on the first install, raise --timeout past your issuer's
    # issuance time, or pre-create the Certificate.
    #
    # The volume is deliberately NOT optional: marking it optional would let
    # the controller start with admission silently disabled, which is worse
    # than a pod that visibly waits.
    enabled: false
    # issuerRef is cert-manager's ObjectReference: {name, kind, group}.
    # Empty (default) renders the chart's own self-signed Issuer. name is
    # REQUIRED once any field is set, otherwise the Certificate points at the
    # self-signed Issuer's name while that Issuer is not rendered, and
    # cert-manager reports IssuerNotFound forever. group defaults to
    # cert-manager.io and must be set for an external issuer, e.g.
    #   issuerRef: {name: pca, kind: AWSPCAClusterIssuer, group: awspca.cert-manager.io}
    issuerRef: {}

# multitenancy gates the opt-in multi-tenant admission + RBAC surface (#416).
# Default off: the InferenceService quota ValidatingWebhookConfiguration entry is
# NOT rendered (so InferenceService admission is never intercepted) and no tenant
# ClusterRoles are installed. Enabling it also requires webhook.enabled=true (the
# quota webhook reuses the same serving cert + Service). It does not change any
# existing (ModelRouter/Model) webhook.
multitenancy:
  enabled: false

# Metal relay (macOS metal-agent) settings.
metalRelay:
  secretCreatePolicy:
    # Install a ValidatingAdmissionPolicy that lets only the controller's
    # ServiceAccount CREATE the per-namespace relay token Secret
    # (llmkube-metal-relay), so someone who can create Secrets but not read
    # them cannot plant a token they know (#1957). Updates (rotation) and
    # deletes (revocation) are not restricted. Rendered only when the cluster
    # serves admissionregistration.k8s.io/v1 ValidatingAdmissionPolicy
    # (Kubernetes 1.30 or newer).
    enabled: true

# Least-privilege identity for the macOS metal-agent (#2152). The agent runs
# outside the cluster and authenticates with a kubeconfig, so it needs its own
# ServiceAccount rather than your admin credentials. Off by default; when on,
# the chart renders the same identity as deployment/macos/metal-agent-rbac.yaml
# and a CI check (make check-metal-agent-rbac) fails if the two rule sets drift.
#
# The chart never renders a token Secret: mint the agent's kubeconfig with
# `kubectl create token` (see deployment/macos/README.md), so credentials stay
# out of the release and rot on your schedule rather than the chart's.
metalAgent:
  rbac:
    # Render the agent's ServiceAccount, Role (or ClusterRole) and binding.
    enabled: false
    # namespaced: a Role and RoleBinding in each namespace listed below, for an
    # agent watching ONE namespace (`--namespace <ns>`, its flag's "default").
    # cluster: a ClusterRole and ClusterRoleBinding, for an agent watching all
    # namespaces (`--namespace ""`).
    scope: namespaced
    # Namespaces to install into under scope namespaced, e.g. [default] for an
    # agent left on its flag default. Required in that scope, and deliberately
    # not defaulted to the release namespace: the agent's own default is
    # "default", not llmkube-system, so a silent default would put the identity
    # somewhere the agent never looks. These must exist before the install,
    # because Helm creates only the release namespace. Removing a namespace
    # from the list deletes its three objects.
    namespaces: []
    # Pin the agent's Secret read to these names. Empty grants get on all
    # Secrets in each namespace because the agent also reads Model
    # sourceSecretRef credentials (HF_TOKEN, AWS_*). Narrow it to
    # [llmkube-metal-relay] when no Model uses sourceSecretRef. Under scope
    # cluster, empty means the agent can read every Secret in the cluster.
    secretNames: []
    serviceAccount:
      # Create the ServiceAccount. false binds an identity you already manage,
      # which serviceAccount.name then requires; under scope namespaced that
      # identity must exist in EVERY listed namespace, since each gets its own
      # RoleBinding subject.
      create: true
      # Name of the ServiceAccount. Empty uses llmkube-metal-agent, the name
      # deployment/macos/README.md's `kubectl create token` recipe uses.
      # Keep the llmkube-metal- prefix, or writePolicy below does not cover
      # the agent.
      name: ""
  writePolicy:
    # Install a ValidatingAdmissionPolicy that holds every ServiceAccount named
    # llmkube-metal-<name>, in any namespace, to the Services, EndpointSlices
    # and Endpoints the agent manages (#2081): a create or update must leave
    # the llmkube.ai/managed-by=metal-agent label on the object, and an update
    # or delete must find it there. The one exception is an update of a
    # Service an InferenceService controls, which the agent takes over after a
    # CUDA to Metal switch or a relay hand-back. The llmkube-metal- prefix is
    # reserved for Mac agents; the controller's own ServiceAccount is excluded
    # by name. Independent of rbac.enabled: it also covers identities from
    # deployment/macos/metal-agent-rbac.yaml and `llmkube metal token create`.
    # Rendered only when the cluster serves admissionregistration.k8s.io/v1
    # ValidatingAdmissionPolicy (Kubernetes 1.30 or newer); older clusters keep
    # only the Role, the weaker fallback.
    enabled: true

# Network policies for the controller manager pod
networkPolicies:
  enabled: false
  additionalEgressCIDRs: []
  # Namespaces allowed through the router-proxy ingress policy on the metrics
  # listener (9090): the Prometheus scrape source. The PodMonitor is scraped by
  # whatever Prometheus runs here, which is not the controller-manager, so
  # without an entry the router metrics scrape is denied. Matches the default
  # prometheus.prometheusRule.namespace.
  metricsScrapeNamespaces:
    - monitoring

# GPU sharing configuration for the operator's gpuSharing feature (#1196).
# These values are rendered as operator flags; they do not change any CRD.
gpuSharing:
  # Pools for gpuSharing mode "shared". When a shared pool is configured,
  # InferenceServices with gpuSharing.mode=shared are scheduled onto nodes
  # matching this nodeSelector (the operator passes it as
  # --gpu-sharing-shared-pool-selector). Empty means no shared pool exists
  # and mode shared is rejected at admission.
  pools:
    shared:
      nodeSelector: {}
  # Device memory (GiB) of one whole GPU in this fleet, used to derive the
  # VRAM footprint of exclusive-mode InferenceServices for GPUQuota
  # vramBytes accounting. 0 (default) means exclusive footprints are unknown;
  # quotas with a vramBytes cap then deny such admissions with an actionable
  # message.
  vramPerDeviceGiB: 0

# Fleet-wide runtime image overrides (#1197). When set, a value replaces the
# operator's built-in default image for that runtime backend, including its
# vendor-specific divergences. Intended for air-gapped or mirrored registries.
# An explicit InferenceService spec.image always wins over these. Empty values
# are ignored (stock defaults apply); the stock defaults are pinned in
# internal/controller/runtime_*.go and listed in docs/operations/
# b200-validation-matrix.md.
runtimeImages:
  llamacpp: ""
  vllm: ""
  sglang: ""
  tgi: ""

# Informational platform floors for NVIDIA Blackwell (B200-class) serving
# (#1197). Rendered into NOTES.txt at install time so a first deploy on new
# silicon fails loudly at the checklist, not cryptically at CUDA init. These
# do not gate anything; they document what the fleet's nodes must satisfy.
# Verified 2026-07-31 (#1374) against the NVIDIA supported-drivers matrix, the
# CUDA release notes, the GPU Operator release notes, the k8s-device-plugin and
# DCGM releases, and the NCCL release notes. Re-verify quarterly: this stack
# moves fast enough that a floor can go end-of-life between releases.
platformFloors:
  # Render the floors block in NOTES.txt.
  show: true
  # R570 reached end-of-life in Feb 2026. R580 is the current LTS branch
  # (EOL Jun 2028) and is what DGX OS 7.5 ships; any driver >= 580 covers
  # the whole CUDA 13.x family via minor-version compatibility.
  nvidiaDriver: ">= 580.173.02 (R580 LTS; R570 is EOL)"
  # 12.8 is the first toolkit with sm_100 codegen. 13.3 Update 1 is the
  # current GA line (13.4 is developer-preview only). CUDA 13 drops
  # pre-Turing architectures.
  cudaToolkit: ">= 12.8 (first sm_100 codegen; 13.3 GA current)"
  nccl: ">= 2.25.1 (first Blackwell support; 2.30.x recommended)"
  # Pin v26.3.3 exactly: v26.3.0/.1/.2 unconditionally set MOFED_ENABLED and
  # GDS_ENABLED, injecting ibverbs device nodes into every GPU container and
  # breaking RDMA/NCCL -- the multi-GPU path a Blackwell fleet depends on.
  gpuOperator: ">= v26.3.3 (do NOT use v26.3.0/.1/.2: they break RDMA/NCCL)"
  k8sDevicePlugin: ">= v0.19.3 (Blackwell-aware product labels)"
  # Tag format is "<DCGM version>-<exporter version>". The 3.3.x line is not
  # viable on B200: Blackwell NVSwitch telemetry needs the 4.x NVSDM backend.
  dcgmExporter: ">= 4.6.0-4.8.3 (DCGM 3.3.x is not viable on B200)"
  # A Fabric Manager / driver mismatch silently degrades NVLink to PCIe with
  # no error surface. See docs/operations/runbooks/nvlink-degrade-to-pcie.md.
  fabricManager: "must match the installed NVIDIA driver version exactly"
