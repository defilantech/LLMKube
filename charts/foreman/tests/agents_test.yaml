suite: agents map multi-fleet (#994)
templates:
  - agent-deployment.yaml
  - agent-rbac.yaml
  - gate-cache-pvc.yaml
  - operator-deployment.yaml
  - operator-rbac.yaml
  - coder-rbac.yaml
  - webhook.yaml
  - crs-configmap.yaml
  - prometheusrule.yaml
  - grafana-dashboard.yaml

tests:
  # ---- Backward compat: legacy agent: block ----

  - it: legacy agent renders exactly one deployment with the unsuffixed name
    template: agent-deployment.yaml
    set:
      agent.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-foreman-agent
      - equal:
          path: spec.replicas
          value: 1

  - it: legacy agent renders SA plus ClusterRole plus ClusterRoleBinding
    template: agent-rbac.yaml
    set:
      agent.enabled: true
    asserts:
      - hasDocuments:
          count: 3
      - equal:
          path: metadata.name
          value: RELEASE-NAME-foreman-agent

  - it: legacy agent renders exactly one gate-cache PVC with the unsuffixed name
    template: gate-cache-pvc.yaml
    set:
      agent.enabled: true
      agent.gateCache.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-foreman-gate-cache

  # ---- Multi-fleet: agents: map ----

  - it: one deployment is rendered per explicit agents entry
    template: agent-deployment.yaml
    values:
      - ./values-multi.yaml
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-foreman-default-agent
      matchMany: false
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-foreman-default-agent

  - it: llmkube-fork agent gets its own suffixed deployment
    template: agent-deployment.yaml
    values:
      - ./values-multi.yaml
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-foreman-llmkube-fork-agent
      matchMany: false
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-foreman-llmkube-fork-agent

  - it: SA plus ClusterRole plus ClusterRoleBinding per agent (nine docs total)
    template: agent-rbac.yaml
    values:
      - ./values-multi.yaml
    asserts:
      # default + llmkube-fork + omitted-enabled each render 3 docs
      # (SA + ClusterRole + ClusterRoleBinding); disabled-agent skips.
      - hasDocuments:
          count: 9

  - it: gate-cache PVC per agent whose gateCache.enabled is true
    template: gate-cache-pvc.yaml
    values:
      - ./values-multi.yaml
    asserts:
      # default + omitted-enabled both keep gateCache enabled
      # (omitted-enabled inherits from .Values.agent); llmkube-fork
      # disables it explicitly. Two PVCs expected.
      - hasDocuments:
          count: 2

  - it: default agent renders its own gate-cache PVC
    template: gate-cache-pvc.yaml
    values:
      - ./values-multi.yaml
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-foreman-default-gate-cache
      matchMany: false
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-foreman-default-gate-cache

  - it: omitted-enabled agent inherits gateCache from defaults and renders its PVC
    template: gate-cache-pvc.yaml
    values:
      - ./values-multi.yaml
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-foreman-omitted-enabled-gate-cache
      matchMany: false
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-foreman-omitted-enabled-gate-cache

  # ---- Per-agent field propagation ----

  - it: per-agent replicaCount plus roles flow through to args
    template: agent-deployment.yaml
    values:
      - ./values-multi.yaml
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-foreman-llmkube-fork-agent
      matchMany: false
    asserts:
      - equal:
          path: spec.replicas
          value: 1
      - contains:
          path: spec.template.spec.containers[0].args
          content: --roles=coder-fork

  - it: per-agent gitRemoteURL and commit-author flow through to args
    template: agent-deployment.yaml
    values:
      - ./values-multi.yaml
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-foreman-llmkube-fork-agent
      matchMany: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --git-remote-url=https://github.com/joryirving/LLMKube
      - contains:
          path: spec.template.spec.containers[0].args
          content: --commit-author-name=Jory Dogfood
      - contains:
          path: spec.template.spec.containers[0].args
          content: --commit-author-email=jory-dogfood@example.com

  - it: per-agent coderGitSecret overrides the chart-level coder.gitCredentialsSecret
    template: agent-deployment.yaml
    values:
      - ./values-multi.yaml
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-foreman-llmkube-fork-agent
      matchMany: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --coder-git-secret=foreman-fork-credentials
      - contains:
          path: spec.template.spec.containers[0].args
          content: --coder-git-secret-key=token

  - it: per-agent githubToken secret flows through to env
    template: agent-deployment.yaml
    values:
      - ./values-multi.yaml
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-foreman-llmkube-fork-agent
      matchMany: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GITHUB_TOKEN
            valueFrom:
              secretKeyRef:
                name: foreman-agent-fork
                key: GITHUB_TOKEN

  - it: agent without per-agent githubToken does NOT render a GITHUB_TOKEN env
    template: agent-deployment.yaml
    values:
      - ./values-multi.yaml
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-foreman-default-agent
      matchMany: false
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: GITHUB_TOKEN

  # ---- #1538: gate-cache PVC threaded to the agent flag ----

  - it: --gate-cache-pvc renders from the same helper that names the PVC
    template: agent-deployment.yaml
    values:
      - ./values-multi.yaml
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-foreman-default-agent
      matchMany: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --gate-cache-pvc=RELEASE-NAME-foreman-default-gate-cache

  - it: --gate-cache-pvc is absent when gateCache.enabled is false
    template: agent-deployment.yaml
    values:
      - ./values-multi.yaml
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-foreman-llmkube-fork-agent
      matchMany: false
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --gate-cache-pvc=

  # ---- Job-mode supervision bound (#1559) ----

  - it: --max-supervised-tasks renders per pool when maxSupervisedTasks is set
    template: agent-deployment.yaml
    values:
      - ./values-multi.yaml
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-foreman-default-agent
      matchMany: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --max-supervised-tasks=2

  - it: --max-supervised-tasks is absent for a pool that leaves it unset
    template: agent-deployment.yaml
    values:
      - ./values-multi.yaml
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-foreman-llmkube-fork-agent
      matchMany: false
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --max-supervised-tasks=

  - it: --max-supervised-tasks is absent by default on the legacy agent block
    template: agent-deployment.yaml
    set:
      agent.enabled: true
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --max-supervised-tasks=

  # ---- Accelerator flag (#1242) ----

  - it: --accelerator flag renders when agent.accelerator is set
    template: agent-deployment.yaml
    set:
      agent.enabled: true
      agent.accelerator: cuda
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --accelerator=cuda

  - it: --accelerator flag is absent when agent.accelerator is unset
    template: agent-deployment.yaml
    set:
      agent.enabled: true
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --accelerator=

  - it: per-agent accelerator override beats the shared agent default
    template: agent-deployment.yaml
    set:
      agent.accelerator: cuda
    values:
      - ./values-multi.yaml
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-foreman-llmkube-fork-agent
      matchMany: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --accelerator=vulkan

  # ---- agent.enabled: false skips that agent ----

  - it: agents entry with enabled false is omitted from the deployment list
    template: agent-deployment.yaml
    values:
      - ./values-multi.yaml
    asserts:
      # only 3 enabled agents out of 4 entries (default, llmkube-fork,
      # omitted-enabled; disabled-agent is skipped)
      - hasDocuments:
          count: 3

  # ---- omitted enabled field inherits from .Values.agent ----

  - it: an agent entry that omits enabled still renders resources via the legacy default
    template: agent-deployment.yaml
    values:
      - ./values-multi.yaml
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-foreman-omitted-enabled-agent
      matchMany: false
    asserts:
      # The merged $agent.enabled inherits true from .Values.agent,
      # so the entry renders. Its explicit replicaCount override also
      # survives the merge.
      - equal:
          path: metadata.name
          value: RELEASE-NAME-foreman-omitted-enabled-agent
      - equal:
          path: spec.replicas
          value: 5

  # ---- Singletons stay singleton ----

  - it: operator Deployment renders once even with multiple agents
    template: operator-deployment.yaml
    values:
      - ./values-multi.yaml
    asserts:
      - hasDocuments:
          count: 1

  - it: coder SA plus Role plus RoleBinding render once even with multiple agents
    template: coder-rbac.yaml
    values:
      - ./values-multi.yaml
    asserts:
      - hasDocuments:
          count: 3

  # ---- CRS: disabled by default ----

  - it: CRS ConfigMap is omitted when foreman.crs.enabled is false
    template: crs-configmap.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: CRS ConfigMap renders when foreman.crs.enabled is true
    template: crs-configmap.yaml
    set:
      foreman.crs.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-foreman-crs
      - isKind:
          of: ConfigMap

  - it: CRS ConfigMap contains the AgenticTask mapping
    template: crs-configmap.yaml
    set:
      foreman.crs.enabled: true
    asserts:
      - matchRegex:
          path: data["foreman-crs.yaml"]
          pattern: "AgenticTask"

  - it: CRS ConfigMap contains the Workload mapping
    template: crs-configmap.yaml
    set:
      foreman.crs.enabled: true
    asserts:
      - matchRegex:
          path: data["foreman-crs.yaml"]
          pattern: "Workload"

  - it: CRS ConfigMap contains the FleetNode mapping
    template: crs-configmap.yaml
    set:
      foreman.crs.enabled: true
    asserts:
      - matchRegex:
          path: data["foreman-crs.yaml"]
          pattern: "FleetNode"

  # ---- PrometheusRule: disabled by default ----

  - it: PrometheusRule is omitted when foreman.crs.alerts.enabled is false
    template: prometheusrule.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: PrometheusRule renders when foreman.crs.alerts.enabled is true
    template: prometheusrule.yaml
    set:
      foreman.crs.enabled: true
      foreman.crs.alerts.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-foreman-alerts
      - isKind:
          of: PrometheusRule

  - it: PrometheusRule contains the stuck-pending alert
    template: prometheusrule.yaml
    set:
      foreman.crs.enabled: true
      foreman.crs.alerts.enabled: true
    asserts:
      - matchRegex:
          path: spec.groups[0].rules[0].alert
          pattern: "ForemanWorkloadStuckPending"

  - it: PrometheusRule contains the stale-heartbeat alert
    template: prometheusrule.yaml
    set:
      foreman.crs.enabled: true
      foreman.crs.alerts.enabled: true
    asserts:
      - matchRegex:
          path: spec.groups[1].rules[0].alert
          pattern: "ForemanFleetNodeHeartbeatStale"

  # ---- Grafana dashboard: disabled by default ----

  - it: Grafana dashboard ConfigMap is omitted when foreman.crs.enabled is false
    template: grafana-dashboard.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: Grafana dashboard ConfigMap renders when foreman.crs.enabled is true
    template: grafana-dashboard.yaml
    set:
      foreman.crs.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-foreman-grafana-dashboard
      - equal:
          path: metadata.labels.grafana_dashboard
          value: "true"
  # ---- #1523: pools must not select each other's pods ----

  - it: each agents entry gets a pool-scoped selector, so pools cannot adopt each other's pods
    template: agent-deployment.yaml
    values:
      - values-multi.yaml
    asserts:
      # documentIndex 0 = the "default" pool, 1 = "llmkube-fork" (map order is
      # alphabetical). Before #1523 both rendered the identical selector
      # {name, instance, part-of, component}, so each Deployment counted the
      # other's replicas toward its own replicaCount.
      - equal:
          path: spec.selector.matchLabels["foreman.llmkube.dev/agent-pool"]
          value: default
        documentIndex: 0
      - equal:
          path: spec.selector.matchLabels["foreman.llmkube.dev/agent-pool"]
          value: llmkube-fork
        documentIndex: 1
      # The pod template must carry the same pool label, or the selector
      # matches nothing and the Deployment never becomes available.
      - equal:
          path: spec.template.metadata.labels["foreman.llmkube.dev/agent-pool"]
          value: default
        documentIndex: 0
      - equal:
          path: spec.template.metadata.labels["foreman.llmkube.dev/agent-pool"]
          value: llmkube-fork
        documentIndex: 1

  - it: the legacy single-agent selector is left alone, since Deployment selectors are immutable
    template: agent-deployment.yaml
    set:
      agent.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - notExists:
          path: spec.selector.matchLabels["foreman.llmkube.dev/agent-pool"]
      - notExists:
          path: spec.template.metadata.labels["foreman.llmkube.dev/agent-pool"]
