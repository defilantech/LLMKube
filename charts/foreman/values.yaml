# Default values for the Foreman chart.
#
# Foreman is opt-in: installing it pulls in foreman-operator (the
# controllers for Agent / AgenticTask / FleetNode / Workload) plus
# zero or more foreman-agent Pods (the per-node worker that claims
# Scheduled tasks and runs them). See README and
# https://llmkube.com/docs/foreman/install-verifier-node for a full install walkthrough.

# Optional name overrides. Same semantics as the llmkube chart.
nameOverride: ""
fullnameOverride: ""

# Where the chart's resources land. Defaults to .Release.Namespace.
# Override only when you need a namespace different from the one
# `helm install -n` points at.
namespace: ""

# imagePullSecrets are attached to BOTH the operator and agent
# Deployments when set.
imagePullSecrets: []

# CRD installation toggle. Set to false when installing a secondary
# agent-only release alongside a primary release that already owns
# the CRDs (e.g., operator.enabled: false, webhook.enabled: false).
crds:
  install: true

# Foreman-wide policy knobs that span operator + agent. Add new
# settings here when they are not naturally scoped to one component.
networkPolicies:
  enabled: false
  additionalEgressCIDRs: []
foreman:
  # allowCloudProviders is the cluster-wide sovereignty kill switch
  # for cloud-proxy reviewer Agents (v0.2).
  #
  # When true (default), reviewer Agents whose spec.provider is
  # "cloud-proxy" may dispatch, subject to per-Workload
  # spec.allowCloudReviewers gating. When false, the
  # WorkloadReconciler drops every step whose Agent.spec.provider is
  # non-local and surfaces a CloudReviewersSuppressed condition on
  # the Workload. Air-gapped and compliance-restricted clusters
  # should set this false.
  allowCloudProviders: true

  # Foreman CRD status metrics via kube-state-metrics Custom Resource State.
  #
  # Maps the Foreman CRD status fields (Workload, AgenticTask, FleetNode) to
  # Prometheus gauges so job and fleet state is scrapable and alertable in the
  # Prometheus + Grafana stack operators already run. Pure configuration
  # against the kube-state-metrics already deployed in most clusters: no new
  # operator code.
  #
  # The CRS config is rendered as a ConfigMap in the Foreman release namespace.
  # The kube-state-metrics deployment (or the kube-prometheus-stack
  # `kube-state-metrics.customResourceState` values path) must be pointed at
  # this ConfigMap for the metrics to land in the existing scrape pipeline.
  #
  # Set `enabled: false` to opt out (e.g. when the cluster does not run
  # kube-state-metrics, or when a different observability stack is in use).
  crs:
    enabled: false
    # Metrics path the CRS ConfigMap is served at inside the ConfigMap.
    # Matches the kube-prometheus-stack default (`/etc/ksm-cmaps/...`) so
    # the stack picks it up without extra wiring.
    configMapKey: foreman-crs.yaml
    # Namespace to render the CRS ConfigMap into. kube-state-metrics can
    # only mount ConfigMaps from its own namespace, so set this when it
    # runs elsewhere (e.g. observability). Empty = the release namespace.
    namespace: ""
    # Example PrometheusRule alerts shipped alongside the CRS config.
    # Disable when you prefer to author your own alerts against the same
    # metric series.
    alerts:
      enabled: false
      # How long a Workload may sit in Pending before the alert fires.
      stuckPendingDuration: 15m
      # How long a FleetNode's heartbeat must be stale before the alert
      # fires. Must be > FleetNodeHeartbeatTimeout (90s) to avoid flapping.
      staleHeartbeatDuration: 5m
      # Numeric threshold in seconds used for the `> N` comparison in the
      # ForemanFleetNodeHeartbeatStale expr. Defaults to 300 (5 minutes).
      # The `staleHeartbeatDuration` duration string is used for the `for:`
      # field and the alert description instead.
      staleHeartbeatSeconds: 300
      # Labels applied to the PrometheusRule metadata so a Prometheus
      # instance that restricts ruleSelector (e.g. the default
      # kube-prometheus-stack) will adopt these rules.
      additionalLabels:
        prometheus: kube-prometheus-stack-prometheus

  # Terminal-task archival (#1654). Off by default.
  #
  # When enabled the operator writes one immutable bundle per terminal
  # task to `dir`, containing the audit record and the agent transcript.
  # READ THIS BEFORE ENABLING: those two artifacts contain source code,
  # issue text, and whatever appeared in tool output, so turning this on
  # writes all of that to the volume below, in plain text, outside the
  # 7 day audit retention window. That is a deliberate operator decision
  # about where your code and issue text come to rest, not a detail.
  #
  # The operator only writes files. Getting bundles off the node is a
  # separate concern: run a CronJob that syncs `dir` to durable storage.
  # Both storage classes in a typical install are RWO and reclaim with
  # Delete, so a bundle that is never shipped is one PVC deletion from
  # gone.
  #
  # AGENT VERSION SKEW: archival captures transcripts only from agents at
  # the same version as this chart. The `transcriptRef` lift that
  # publishes a transcript ships in foreman-agent; the archiver that reads
  # it ships in foreman-operator. Metal agents are commonly updated out of
  # band from the chart, so skew is normal. Against an older agent
  # `status.transcriptRef` stays empty, the archiver takes neither the
  # transcript_read nor the transcript_empty branch, every bundle records
  # `hasTranscript: false`, and foreman_archive_failures_total stays at
  # zero. That is indistinguishable from a fleet of deterministic runs, so
  # there is no failure signal at all: bring the agents to this version
  # before you trust a transcript to be there.
  #
  # ROLLBACK: use `helm rollback` (or `kubectl rollout undo`), which
  # reverts the operator's args and its image together. Rolling the image
  # back on its own while this stays enabled, as in
  # `helm upgrade --set operator.image.tag=<old>`, crashloops the
  # operator: the older binary does not define -archive-dir, Go's flag
  # package exits 2 on a flag it does not know, and the pod lands in
  # CrashLoopBackOff. Set `enabled: false` in the same command if you
  # really must roll only the image.
  archive:
    enabled: false
    # Absolute path the operator writes bundles to, and the mount path of
    # the volume below. The two are always the same path by construction.
    dir: /var/lib/foreman/archive
    # Volume mounted at `dir` when enabled. Any volume source works; the
    # operator never learns what is behind it. Empty here on purpose: the
    # chart renders `emptyDir: {}` when you name no source, which keeps a
    # mistaken `enabled: true` from silently filling a node disk that
    # something else depends on. It also means bundles die with the pod,
    # so point this at a persistentVolumeClaim for real use. Read the
    # fsGroup note below before you do.
    #
    #   volume:
    #     persistentVolumeClaim:
    #       claimName: foreman-archive
    #
    # Do NOT put `emptyDir: {}` back here as the default. Helm deep-merges
    # your values onto the chart's, so a default source is ADDED to the one
    # you name rather than replaced, and a Volume carrying two sources is
    # rejected by the API server with "may not specify more than 1 volume
    # type": helm upgrade fails and nothing rolls out.
    volume: {}
    # fsGroup applied to the operator pod, but ONLY while archival is
    # enabled, so a default install's pod security context is unchanged.
    #
    # This is what makes the persistentVolumeClaim above actually usable.
    # The operator image runs as UID 65532 with runAsNonRoot, and most
    # provisioners hand out a freshly-bound PVC owned root:root 0755. With
    # no fsGroup the operator cannot create its bundle directory, every
    # terminal task increments
    # foreman_archive_failures_total{reason="write"}, and not one bundle is
    # written. The emptyDir default hides this completely, because the
    # kubelet creates an emptyDir already owned by the pod.
    #
    # Set to 0 to render no fsGroup at all. That is what OpenShift needs:
    # the restricted-v2 SCC injects fsGroup from the namespace's allocated
    # range and rejects a pod that names a value outside it.
    fsGroup: 65532

# agents is the multi-fleet map (#994). Leave it UNSET for a single
# agent (the legacy `agent:` block above is used as-is and renders
# exactly the resources it always has, so an existing install is
# unchanged on upgrade). Set it to render one Deployment +
# ServiceAccount + ClusterRole/ClusterRoleBinding + gate-cache PVC PER
# entry, each suffixed with the agent key, so multiple heterogeneous
# agent fleets coexist in one release instead of needing a second
# chart install (which would collide on the chart's singletons).
#
# Real-world use cases:
#
#   agents:
#     default:                  # the primary multi-repo worker/coder pool
#       replicaCount: 3
#       roles: [worker, coder, verifier]
#     llmkube-fork:             # a fork-pinned dogfood agent for upstream PRs
#       replicaCount: 1
#       roles: [coder-fork]
#       gitRemoteURL: https://github.com/<you>/LLMKube
#       githubToken: { secretName: foreman-agent-fork, secretKey: GITHUB_TOKEN }
#       commitAuthorName: "<you>"
#       commitAuthorEmail: "<you>@users.noreply.github.com"
#       coderGitSecret: foreman-fork-credentials     # per-agent coder PAT
#       gateCache: { enabled: false }                  # fork agents don't gate
#
# Each entry's fields DEEP-MERGE with the legacy `agent:` block above
# (which serves as the defaults) so you only have to specify what
# differs. Naming convention: per-agent resources are
# `<fullname>-<agentKey>-agent` (Deployment / SA / ClusterRole /
# ClusterRoleBinding) and `<fullname>-<agentKey>-gate-cache` (PVC), so
# agents never collide. The shared components — operator Deployment,
# webhook, CRDs, coder SA/Role/RoleBinding — remain single per release.
#
# Setting `agents:` opts you OUT of the implicit legacy agent: render
# path; if you need a "default" fleet alongside custom ones, list it
# explicitly under `agents:` with the name `default` (or any other key).
#
# UPGRADE NOTE, existing `agents:` users only (#1523). Every pool's
# Deployment now carries `foreman.llmkube.dev/agent-pool: <key>` in its
# selector. Before this, all pools rendered the SAME selector, so each
# Deployment adopted the others' pods and the controllers fought over
# replicaCount. A Deployment's selector is immutable, so `helm upgrade`
# on a release created before this change fails with:
#
#   spec.selector: Invalid value: {...}: field is immutable
#
# Agent Deployments are stateless, so the fix is to delete them and let
# the upgrade recreate them. In-flight tasks are re-claimed by a sibling:
#
#   kubectl -n <namespace> delete deploy -l app.kubernetes.io/component=agent
#   helm upgrade ...
#
# Installs on the legacy `agent:` block are unaffected: that path renders
# under the "_implicit_" sentinel with no pool label and its selector is
# byte-identical across this change.

operator:
  enabled: true
  replicaCount: 1

  image:
    # registry: ghcr.io                                 # optional prefix
    repository: ghcr.io/defilantech/llmkube-foreman-operator
    tag: ""                                             # defaults to .Chart.AppVersion
    digest: ""                                          # wins over tag when set
    pullPolicy: IfNotPresent

  serviceAccount:
    create: true
    name: ""                                            # generated by helper

  leaderElection:
    enabled: true

  # The four foreman controllers stream logs at this level. Bump to
  # debug only when debugging a bad reconcile cycle.
  logLevel: info

  # Audit reaper (#990). The audit writer stamps audit-record
  # ConfigMaps WITHOUT ownerReferences by design — the record must
  # outlive the AgenticTask so it remains a compliance trail after
  # task GC. That design choice leaves the records to accumulate
  # unbounded in the task namespace over time, so the operator runs
  # a periodic reaper that deletes any audit CM older than
  # `audit.retention`. Set retention to a zero-duration (e.g. "0s",
  # "0m", "0") to disable the reaper entirely.
  #
  # With leader election enabled (the default), the reaper only runs
  # on the elected leader — so a HA deployment (replicaCount > 1)
  # cannot double-sweep, and a standalone (replicaCount=1) deployment
  # runs it on the only replica.
  audit:
    # Maximum age before an audit-record ConfigMap is deleted.
    # Default: 7 days. Override shorter for tighter retention
    # (e.g. "24h"); override longer for compliance-driven horizons.
    # Set to "0s" / "0m" / "0" to disable the reaper.
    retention: 168h
    # How often the reaper sweeps. Default 1h; only useful to lower
    # for tests. The first sweep runs immediately on operator start,
    # so a fresh install with a backlog of stale audit CMs does not
    # wait for the first tick.
    interval: 1h

  # Metrics + health endpoints on the operator pod. Match the
  # llmkube core operator's defaults for symmetry.
  metrics:
    enabled: true
    port: 8081
  health:
    port: 8082

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

  nodeSelector: {}
  affinity: {}
  tolerations: []
  podAnnotations: {}
  podLabels: {}
  # env is passed straight to the foreman-agent container. Set
  # FOREMAN_REPOMAP_BACKEND=ripwire to use the ripwire call graph as the
  # coder's repo-map backend (#1904), and FOREMAN_RIPWIRE_BIN to point at the
  # binary when it is not on PATH (the macOS install stages it into the
  # install root and sets this for you). Both are off by default. The binary
  # must be present on the host; see docs/third-party/ripwire.md.
  env: []

# webhook configures the validating admission webhook that fronts Agent +
# AgenticTask CRs (#520). It surfaces invariant violations (unknown tool
# name, missing systemPrompt, dangling agentRef) at `kubectl apply` time
# instead of at executor-dispatch time.
#
# Certs are self-signed by the chart with Helm's genCA/genSignedCert and
# stay stable across `helm upgrade` via a lookup-reuse of the existing
# serving Secret. No cert-manager dependency: the chart installs cleanly
# in a bare cluster.
webhook:
  # enabled toggles ALL webhook resources (Service, cert Secret,
  # ValidatingWebhookConfiguration) and the operator's --enable-webhooks
  # flag. False renders none of them and starts the operator with the
  # webhook server off.
  enabled: true

  # failurePolicy controls what happens when the webhook is unreachable.
  # "Fail" (default) rejects the apply, which is the safe choice for an
  # operator that should always be running. "Ignore" admits the CR
  # unvalidated; use only if a transient operator outage blocking applies
  # is worse than admitting an occasional invalid CR.
  #
  # Operational tradeoff with a SINGLE operator replica (the default):
  # because the webhook server runs in the operator pod, a rolling
  # restart or upgrade leaves a brief window where the old pod is gone
  # and the new pod is not yet Ready. During that window, with
  # failurePolicy "Fail", EVERY Agent and AgenticTask CREATE/UPDATE
  # clusterwide is rejected (the API server cannot reach any webhook
  # backend), which can stall the Foreman pipeline and any controller
  # that patches these CRs. If that window is unacceptable, either set
  # failurePolicy to "Ignore" (accept unvalidated CRs during the gap) or
  # run 2+ operator replicas so a Ready webhook backend always exists
  # across a rollout. Do NOT add a namespaceSelector to dodge this: it
  # would narrow enforcement and let unvalidated CRs through in the
  # excluded namespaces permanently, not just during a restart.
  failurePolicy: Fail

  # port the operator's webhook server listens on (matches the container
  # port + the Service targetPort).
  port: 9443

  # certificate validity in days. The cert is reused across upgrades, so
  # this is effectively the rotation horizon (re-install or delete the
  # serving Secret to force regeneration before expiry).
  certValidityDays: 3650

agent:
  # foreman-agent claims Scheduled AgenticTasks for this node and
  # executes them. Disable when only running the foreman-operator
  # (e.g. on the control-plane cluster while workers run elsewhere).
  enabled: true
  replicaCount: 1

  # How long the kubelet waits after sending SIGTERM before force-killing
  # the agent pod.
  #
  # This is the drain window. On SIGTERM the agent DRAINS instead of
  # dropping its work (#1438): the watcher's poll loop stops claiming new
  # tasks, but the turns it already launched keep running and write their
  # terminal status before the process exits, so a rollout no longer kills a
  # local-model turn mid-patch (pkg/foreman/agent/watcher.go). The FleetNode
  # registrar keeps its existing Draining heartbeat throughout
  # (pkg/foreman/agent/fleetnode.go).
  #
  # The default of 300s (5 min) is generous for a bounded turn to land its
  # final patch without a forced kill. A turn that runs past the window is
  # force-killed by the kubelet, and the work is recovered by the operator,
  # not the agent.
  #
  # What recovers the killed task is the operator, not the agent. It is
  # NOT recoverOrphanedTasks: that matches only tasks whose
  # status.assignedNode equals the agent's own FleetNode name, and the
  # replacement pod registers under a different name (the agent falls back
  # to os.Hostname(), the POD name; see the strategy note below), so it
  # never sees the dead pod's work. It is checkClaimExpiry in
  # internal/foreman/controller/agentictask_controller.go, which releases
  # the task back to Pending once the assigned FleetNode's heartbeat goes
  # stale and terminal-fails it on the third expiry. The cost is real: a
  # rollout during a long run spends one of that task's three strikes, so
  # repeated rollouts can fail a task outright rather than re-queue it.
  #
  # Must be a non-negative whole number of seconds. The chart fails the
  # render on a negative, non-numeric or fractional value, rather than
  # shipping a manifest the API server rejects or silently truncating a
  # 30.5 to 30. Lower the value on a pool that should die fast; the default
  # 300 is what buys a slow turn a clean finish.
  terminationGracePeriodSeconds: 300

  # Pod rollout strategy for this agent Deployment.
  #
  # Recreate (default) tears the pool down before starting replacements, so it
  # never runs two agents for the pool at once. RollingUpdate replaces them one
  # at a time, so an image bump does not stop the whole pool.
  #
  # On the "two agents would race for the same task" reasoning, which the older
  # comment here stated as fact: that race is currently UNREACHABLE, and only
  # because of a bug. agent-deployment.yaml sets FLEET_NODE_NAME from
  # spec.nodeName (the Kubernetes NODE), but no Go code reads it, so the agent
  # falls back to os.Hostname() -- the POD name -- and each replica registers
  # its own FleetNode. pollOnce then claims only tasks whose
  # status.assignedNode matches its own node, so two pods are never offered the
  # same task. Under the INTENDED node-scoped identity they would share one
  # FleetNode and the race would be real. Tracked as #1640.
  #
  # So maxSurge 0 is the conservative default, not an enforced invariant: the
  # chart will not hard-fail a non-zero surge, because that would be an
  # unbypassable policy ruling resting on a bug staying unfixed. Raise it
  # knowingly, and re-read #1640 first if it has been resolved.
  #
  # Know what "knowingly" costs. The sharper hazard is not the lost Scheduled
  # claim, it is recoverOrphanedTasks (pkg/foreman/agent/watcher.go): it runs
  # once at agent startup and resets EVERY task in phase=Running assigned to
  # its own FleetNode back to Pending. A surging pod that shared a node-scoped
  # identity with its still-running sibling would reset that sibling's
  # in-flight work at boot, the scheduler would re-dispatch a task that is
  # still executing, and two agents would end up pushing the same branch.
  # That is worse than losing a Scheduled claim. It is unreachable today for
  # the same reason the claim race is (the two pods register separate
  # FleetNodes under pod-name identity), and #1640 is what would make it
  # reachable.
  #
  # Worth knowing before opting in: with the chart's default replicaCount of 1,
  # RollingUpdate with maxSurge 0 is behaviourally IDENTICAL to Recreate. The
  # pool must scale to zero before the new pod starts, because it can never
  # exceed `replicas`. This option only buys you anything at replicaCount > 1.
  #
  # maxUnavailable may not be 0 when maxSurge is 0; the Deployment validator
  # rejects that pair and the chart fails the render rather than the apply.
  strategy:
    type: Recreate

  image:
    # registry: ghcr.io
    # Default: the lean runtime image (alpine + git). To run a coder-enabled
    # in-cluster agent, point this at the coder image
    # (ghcr.io/defilantech/llmkube-foreman-agent-coder, same tag), which ships
    # the Go toolchain + golangci-lint/controller-gen/make/helm the coder's
    # fast self-gate needs, and add "coder" to agent.roles below (#835).
    repository: ghcr.io/defilantech/llmkube-foreman-agent
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent

  serviceAccount:
    create: true
    name: ""

  # Executor mode the foreman-agent starts in.
  #   stub:   sleep 10s + write a synthetic Succeeded result. Useful
  #           for chart-install smoke tests and for nodes that should
  #           visibly register without yet hosting a model.
  #   native: the M3 native agent loop. Requires an InferenceService
  #           reachable from this node when the Agent CR points at one.
  # The gate Agent (M4) works fine in native mode without
  # an InferenceService because it's deterministic.
  mode: stub

  # --roles flag passed to the foreman-agent. The scheduler matches
  # AgenticTask.spec.requiredCapability.roles against this set.
  # Conventions: "worker" = "this node can run user-facing
  # AgenticTasks"; "verifier" = "this node can host the gate Agent";
  # "coder" = "this node can run a coder loop end-to-end". Only advertise
  # "coder" on an agent running the coder image (see agent.image above) and
  # with coder.gitCredentialsSecret set, so its fast self-gate has the Go
  # toolchain and it can push the branch (#835).
  roles:
    - worker

  # Labels stamped onto this agent's FleetNode metadata on every
  # registration (via --node-labels), so capability-routing nodeSelectors
  # (an Agent's requiredCapability.nodeSelector) keep matching across pod
  # restarts. A hand-applied `kubectl label fleetnode` is lost when the pod
  # (and its FleetNode, named for the pod) is recreated; these are not (#881).
  # Example:
  #   nodeLabels:
  #     coder-pool: amd
  nodeLabels: {}

  # --task-namespace flag. Empty = watch all namespaces. Pin to a
  # namespace when a single Foreman install serves multiple
  # tenants that should not see each other's tasks.
  taskNamespace: ""

  # --max-supervised-tasks flag. How many Job-mode AgenticTasks this node
  # supervises at once. A Job-mode task's loop runs in an ephemeral coder
  # Job pod, so the agent only submits it, polls Job.Status and tails logs;
  # those tasks are therefore accounted separately from the single
  # in-process slot (#1559). Each one is still an outstanding coder Job
  # competing for pods, cache volumes and inference capacity, so lower it
  # on a cluster where those are tight. 1 serializes Job-mode work the way
  # it behaved before #1559. Unset (0) leaves the agent's built-in default
  # of 4 in place.
  maxSupervisedTasks: 0

  # --foreman-namespace flag. Namespace the agent submits gate Jobs
  # into. Defaults to the release namespace, which is where the chart
  # creates the foreman-gate-cache PVC. Override only when the PVC
  # and the agent live in different namespaces.
  foremanNamespace: ""

  # Accelerator family this node advertises in its FleetNode capability.
  # One of: metal, cuda, vulkan, none. Required on Linux, since the
  # scheduler rejects capability-pinned tasks when this is empty.
  accelerator: ""

  # Models the foreman-agent advertises in its FleetNode.spec
  # heartbeat. Use kebab-case slugs (e.g. "qwen36-35b-carnice-mtp").
  installedModels: []

  # Optional override for the InferenceService base URL the native
  # executor talks to. Leave empty in-cluster and set in dev when the
  # agent runs outside the cluster against a port-forwarded service.
  inferenceBaseURLOverride: ""

  # Where the native + deterministic executors clone working copies
  # of a repo for the duration of a task. The /workspace path is
  # mounted as an emptyDir below; override here if you want a PVC-
  # backed workspace (e.g. to keep go-build caches warm across runs)
  # or a different in-Pod path. The default /workspace is the right
  # answer on the published distroless image because the binary's
  # home dir (/home/nonroot) is on the read-only rootfs and breaks
  # the deterministic gate Agent's workspace prep step.
  workspaceDir: /workspace

  # Git remote the executor reads from and pushes branches to. OPTIONAL
  # as of #915:
  #
  #   - Set: pins every coder task to this one fork/repo (the single-repo
  #     fork-PR model). The coder pushes the branch here and the gate
  #     clones it from here.
  #   - Empty: each coder task clones and pushes its OWN payload.repo
  #     (github.com/<owner>/<name>), so a single agent serves many repos.
  #     The gate then constructs the same clone URL from payload.repo, so
  #     it still finds the branch the coder pushed.
  #
  # Set this only to force every task onto one remote (a shared fork).
  # A coder task with neither this NOR a payload.repo fails at the clone
  # step with GitRemoteNotConfigured. Stub-mode agents ignore it.
  gitRemoteURL: ""

  # Git author + committer identity stamped onto commits the coder-
  # role executor produces. Required when agent.mode=native AND the
  # agent's roles include "worker" (i.e. it can host the coder Agent).
  # Verifier-only nodes can leave these empty -- the gate path does not
  # commit anything.
  commitAuthorName: ""    # defaults to "Foreman Bot" inside the binary
  commitAuthorEmail: ""

  # The memory LIMIT is a cap, not a reservation (requests stays lean), so a
  # reviewer/scheduler/worker agent still uses ~256Mi -- the high cap only
  # matters for a coder-role agent. A coder's in-workspace self-gate runs
  # golangci-lint + go build + go test over the whole target module, which
  # spikes well past 2Gi and OOMKills the pod at the old default (#880). 8Gi
  # gives that gate headroom while costing non-coder agents nothing. Lower the
  # limit if you only run reviewer/scheduler roles on memory-tight nodes.
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "2"
      memory: 8Gi

  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

  # GitHub token the M3 coder-role Agent uses to push branches to the
  # fork. Set tokenSecret.name to a pre-created Secret holding
  # `GITHUB_TOKEN`. Leaving this empty disables the env-var injection
  # (stub mode, gate-only nodes).
  githubToken:
    secretName: ""
    secretKey: GITHUB_TOKEN

  # M4 gate cache PVC. Shared across run_gate_job invocations so
  # GOMODCACHE / GOCACHE / XDG_DATA_HOME persist between runs.
  # Disable on nodes that never host the gate Agent.
  gateCache:
    enabled: true
    name: ""                                            # generated by helper
    accessModes: ["ReadWriteOnce"]
    size: 20Gi
    storageClass: ""                                    # cluster default if unset
    annotations: {}

  nodeSelector: {}
  affinity: {}
  tolerations: []
  podAnnotations: {}
  podLabels: {}
  env: []

  # Per-agent override of the chart-level coder.gitCredentialsSecret
  # passed through as --coder-git-secret. Empty falls back to
  # .Values.coder.gitCredentialsSecret so existing installs that only
  # set the chart-level value are unchanged. (#994)
  coderGitSecret: ""
  coderGitSecretKey: ""

agents: {}

# coder gates the ServiceAccount + namespaced Role the Job-mode coder
# pods run under (#620). A Job-mode Agent (spec.execution.mode=Job) runs
# `foreman-agent run-task` in an ephemeral Job whose pod uses this SA.
# The run-task body only READS the AgenticTask, the referenced Agent, and
# its InferenceService, so the Role is read-only. Leave enabled when any
# Agent in the cluster uses Job-mode execution; disable on clusters that
# only run the in-process (metal) coder path.
coder:
  enabled: true

  serviceAccount:
    # When create is true, the chart provisions the SA and its Role +
    # RoleBinding. Set false to bind an externally managed SA (still
    # gets the Role + RoleBinding so long as coder.enabled is true).
    create: true
    # Name of the coder Job ServiceAccount. Defaults to "foreman-coder"
    # so a sample Agent's spec.execution.serviceAccountName=foreman-coder
    # works without extra wiring. Override to suit your naming.
    name: ""

  # Git Secret the coder Job projects as GITHUB_TOKEN for the clone +
  # push (#620). These pass through to the foreman-agent watcher as
  # --coder-git-secret / --coder-git-secret-key.
  #
  # Defaults match the standalone foreman-git-credentials Secret (key
  # "token") so existing installs are unchanged. To REUSE an existing
  # git Secret instead of creating a new one, point these at it: e.g.
  # gitCredentialsSecret: foreman-github with gitCredentialsSecretKey:
  # GITHUB_TOKEN reuses the same Secret the foreman-agent itself uses.
  gitCredentialsSecret: foreman-git-credentials
  gitCredentialsSecretKey: token
