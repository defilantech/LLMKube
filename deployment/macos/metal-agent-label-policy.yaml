# Admission policy that makes llmkube.ai/managed-by=metal-agent mean what the
# controller reads it as (GHSA-863w-vh42-mjhj).
#
# metal-agent-write-policy.yaml holds the agent's own identities to the label.
# Its identity match condition filters every other writer out before a
# validation runs, so on its own it says nothing about anyone else.
#
# The controller trusts that label as proof the macOS agent published a
# registration. It reads the "<isvc>-agent" EndpointSlice, takes the
# llmkube.ai/agent-ingress-spki annotation as the certificate to pin, and a
# fresh llmkube.ai/agent-heartbeat as proof the agent is up (metal_relay.go,
# decideMetalMode). Nothing in that path authenticates the writer, so a
# namespace editor could publish the label on a slice pointing at its own TLS
# server: the controller would enter relay mode pinned to that server, and the
# relay would present the per-namespace relay token to it.
#
# This policy is the exception to that: it applies to every writer, because it
# has no condition that filters writers down to the agent's identities. It
# requires a llmkube-metal-* ServiceAccount of any Service, EndpointSlice or
# Endpoints object that claims the label, less the controller exemption below.
# An object without the label is not agent-authored and is unaffected, so
# ordinary objects keep working for everyone. Delete stays allowed, as in the
# policy above: removing an object never publishes the label.
#
# The controller's own ServiceAccount is exempt: it patches a stale
# agent-managed EndpointSlice to withdraw its endpoints without dropping the
# label (withdrawStaleMetalEndpoints, #1918), and that write is not the agent's.
# The kustomize controller runs as llmkube-controller-manager. The Helm chart
# renders the same policy and exempts the release's controller ServiceAccount,
# since a release named, say, llmkube-metal-prod names it
# llmkube-metal-prod-controller-manager; a second release in one cluster is
# denied by this copy and needs the chart's guard off or a distinct name.
# make check-metal-agent-rbac fails if the two copies drift.
#
# A system controller that rewrites a leftover core/v1 Endpoints still carrying
# the label (EndpointSliceMirroring, the endpoints controller) is denied by this
# policy, and that is accepted: the agent reaps the legacy Endpoints on its
# next registration, so the state clears itself.
#
# Cluster-scoped. Needs Kubernetes 1.30 or newer (admissionregistration.k8s.io/v1
# ValidatingAdmissionPolicy); older clusters have only the Role, which is the
# weaker fallback. A cluster admin applies it once per cluster, beside
# metal-agent-write-policy.yaml:
#
#   kubectl apply -f deployment/macos/metal-agent-label-policy.yaml
#
# The has() guards matter: with failurePolicy Fail, an evaluation error would
# deny the request.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: llmkube-metal-agent-labels
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["services", "endpoints"]
    - apiGroups: ["discovery.k8s.io"]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["endpointslices"]
  matchConditions:
  - name: not-llmkube-controller
    expression: request.userInfo.username != 'system:serviceaccount:llmkube-system:llmkube-controller-manager'
  validations:
  - expression: >-
      !has(object.metadata.labels) ||
      !('llmkube.ai/managed-by' in object.metadata.labels) ||
      object.metadata.labels['llmkube.ai/managed-by'] != 'metal-agent' ||
      request.userInfo.username.matches('^system:serviceaccount:[a-z0-9]([-a-z0-9]*[a-z0-9])?:llmkube-metal-[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
    message: >-
      an object labeled llmkube.ai/managed-by=metal-agent is a macOS agent
      registration; only a ServiceAccount named llmkube-metal-* may write one
      (GHSA-863w-vh42-mjhj)
    reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: llmkube-metal-agent-labels
spec:
  policyName: llmkube-metal-agent-labels
  validationActions: [Deny]
